          {dragging && <div className="drag-ghost" style={{ left: dragPos.x, top: dragPos.y }}>{dragType === 'wood' ? '🪵' : '🔥'}</div>}
        </div>
      )}

      {armorOpen && (
        <div className="overlay-veil" onClick={(e) => { if (e.target === e.currentTarget) setArmorOpen(false); }}>
          <div className="overlay-card">
            <div className="overlay-kicker">Šarvai</div>
            <h2 className="overlay-title">Šarvų meniu</h2>
            {hud.helmetOn ? (
              <div className="inv-grid">
                <div className="inv-slot weapon-slot equipped" onClick={toggleHelmet}>
                  <span className="inv-slot-tag">Užsidėta</span>
                  <span className="inv-slot-icon">🪖</span>
                  <span className="inv-slot-label">Šalmas</span>
                  <span className="inv-slot-count">{hud.helmetCount + 1}</span>
                </div>
              </div>
            ) : hud.helmetCount > 0 ? (
              <p className="inv-empty-note">Šalmą turi kuprinėje. Eik į inventorių (🎒 arba <b>I</b>) ir jį užsidėk, tada jis atsiras čia.</p>
            ) : (
              <p className="inv-empty-note">Dar neturi jokių šarvų. Šalmą retkarčiais galima rasti pasaulyje, jį numeta nugalėti zombiai, arba nusipirkti pas benamį.</p>
            )}
            <button className="overlay-btn primary" onClick={() => setArmorOpen(false)}>Uždaryti</button>
          </div>
        </div>
      )}

      {shopOpen && (
        <div className="overlay-veil" onClick={(e) => { if (e.target === e.currentTarget) setShopOpen(false); }}>
          <div className="overlay-card">
            <div className="overlay-kicker">Miestelis</div>
            <h2 className="overlay-title">Benamio parduotuvė</h2>
            <p className="craft-hint">Turi <b>{hud.coins} 🪙</b>. Paspausk prekę, kad ją nupirktum arba parduotum.</p>
            {shopMsg && <div className="forge-error" style={{ marginBottom: 14 }}>{shopMsg}</div>}
            <p style={{ fontWeight: 700, margin: '4px 0 8px', fontSize: 13.5 }}>Pirkti</p>
            <div className="inv-grid">
              {SHOP_ITEMS.map((item) => (
                <div key={item.type}
                  className={'inv-slot weapon-slot' + (hud.coins < item.price ? ' disabled' : '')}
                  onClick={() => buyItem(item)}>
                  <span className="inv-slot-icon">{item.icon}</span>
                  <span className="inv-slot-label">{item.label}</span>
                  <span className="inv-slot-count">🪙{item.price}</span>
                </div>
              ))}
            </div>
            <p style={{ fontWeight: 700, margin: '16px 0 8px', fontSize: 13.5 }}>Parduoti</p>
            {sellables.length > 0 ? (
              <div className="inv-grid">
                {sellables.map((it) => (
                  <div key={it.type} className="inv-slot weapon-slot" onClick={() => sellItem(it.type)}>
                    <span className="inv-slot-tag">turi {it.qty}</span>
                    <span className="inv-slot-icon">{it.icon}</span>
                    <span className="inv-slot-label">{it.label}</span>
                    <span className="inv-slot-count">🪙{it.price}</span>
                  </div>
                ))}
              </div>
            ) : (
              <p className="inv-empty-note">Kuprinėje neturi nieko, ką galėtum parduoti.</p>
            )}
            <button className="overlay-btn primary" onClick={() => setShopOpen(false)}>Uždaryti</button>
          </div>
        </div>
      )}

      {questOpen && (() => {
        // "Užduotys" HUD mygtukas langą atidaro iš bet kur žemėlapyje, todėl čia patikrinama, ar
        // šiuo metu esi prie miškininko - priimti/atsiimti veiksmai vis tiek apsaugoti ir acceptQuest/
        // claimQuest viduje, bet mygtuką rodome tik kai iš tikrųjų gali juo pasinaudoti.
        const nearNpc2 = Math.hypot(hud.x - NPC2_POS.x, hud.y - NPC2_POS.y) < QUEST_RANGE;
        return (
        <div className="overlay-veil" onClick={(e) => { if (e.target === e.currentTarget) setQuestOpen(false); }}>
          <div className="overlay-card">
            <div className="overlay-kicker">Miškininkas</div>
            <h2 className="overlay-title">Medžių kirtimo užduotis</h2>
            {questState === 'available' && (
              <>
                <p className="craft-hint">„Reikia pagalbos - nukirsk {QUEST_CHOP_TARGET} medžių, o aš tau atsilyginsiu {QUEST_REWARD_COINS} 🪙."</p>
                {nearNpc2 ? (
                  <button className="overlay-btn primary" onClick={acceptQuest}>Priimti užduotį</button>
                ) : (
                  <p className="inv-empty-note">Turi būti prie miškininko, kad priimtum užduotį.</p>
                )}
              </>
            )}
            {questState === 'active' && (
              <p className="craft-hint">Nukirsta medžių: <b>{hud.questChopped} / {QUEST_CHOP_TARGET}</b>. Kirsk medžius kirviu ir grįžk, kai baigsi.</p>
            )}
            {questState === 'ready' && (
              <>
                <p className="craft-hint">Užduotis atlikta! Nukirtai {QUEST_CHOP_TARGET} medžių.</p>
                {nearNpc2 ? (
                  <button className="overlay-btn primary" onClick={claimQuest}>Atsiimti apdovanojimą (+{QUEST_REWARD_COINS} 🪙)</button>
                ) : (
                  <p className="inv-empty-note">Apdovanojimą gali atsiimti tik pas miškininką - grįžk pas jį.</p>
                )}
              </>
            )}
            {questState === 'done' && (
              <p className="craft-hint">Ačiū už pagalbą miške! Užduotis baigta.</p>
            )}
            <button className="overlay-btn ghost" style={{ marginTop: 10 }} onClick={() => setQuestOpen(false)}>Uždaryti</button>
          </div>
        </div>
        );
      })()}

      {deathStats && (
        <div className="overlay-veil">
          <div className="overlay-card">
            <div className="overlay-kicker">Žuvote</div>
            <h2 className="overlay-title danger">Ištiko mirtis</h2>
            <p className="craft-hint">Prarasta visa kuprinė - ginklai, mediena, degtukai, šalmas ir valiuta. Lygis ir patirtis išsaugoti.</p>
            <div className="overlay-stats">
              <div><div className="overlay-stat-label">Išgyveno</div><div className="overlay-stat-value">{deathStats.survived}s</div></div>
              <div><div className="overlay-stat-label">Lygis</div><div className="overlay-stat-value">{deathStats.level}</div></div>
              <div><div className="overlay-stat-label">Nužudyta</div><div className="overlay-stat-value">{deathStats.kills}</div></div>
              <div><div className="overlay-stat-label">XP</div><div className="overlay-stat-value">{deathStats.xp}</div></div>
            </div>
            <div className="overlay-actions">
              <button className="overlay-btn primary" onClick={respawn}>Prisikelti prie namų</button>
              <button className="overlay-btn ghost" onClick={doLogout}>Į pagrindinį meniu</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Admin žemėlapio redaktorius - pasiekiamas TIK per realų /api/login, kai serveris grąžina
   isAdmin=true (žr. AuthForge.submit/onAdminEnter), o ne per jokį atskirą "admin" prisijungimo
   ekraną. Leidžia pasodinti/naikinti medžius konkrečiuose langeliuose bei perkelti parduotuvės
   ir miškininko NPC bei du dekoratyvius namukus - viskas skaitoma/saugoma per REST
   (GET/PUT /api/admin/map-overrides, žr. src/adminRoutes.js), matoma VISIEMS žaidėjams (ne tik
   šiam naršyklei) - žr. applyServerMapOverrides()/bootstrap() failo pradžioje/pabaigoje, kur
   TAS PATS /api/map-overrides atsakymas pritaikomas visų žaidėjų terenno generavimui.
   ============================================================ */
function AdminScreen({ onExit, token }) {
  const [npcPos, setNpcPos] = useState(DEFAULT_NPC_POS);
  const [npc2Pos, setNpc2Pos] = useState(DEFAULT_NPC2_POS);
  const [hutPositions, setHutPositions] = useState(DEFAULT_HUT_POSITIONS);
  const [forcedTrees, setForcedTrees] = useState(new Set());
  const [forcedClear, setForcedClear] = useState(new Set());
  const [tool, setTool] = useState('tree');
  const [tilePx, setTilePx] = useState(8);
  const [hoverTile, setHoverTile] = useState(null);
  const [savedMsg, setSavedMsg] = useState('');
  const canvasRef = useRef(null);
  const paintingRef = useRef(false);

  // Pradinis žemėlapio override'ų užkrovimas iš serverio (viešas endpoint'as - žr.
  // src/publicRoutes.js) - kol neatsakė, redaktorius rodo numatytąjį išdėstymą.
  useEffect(() => {
    apiFetch('/api/map-overrides', { token }).then((data) => {
      const ov = data && data.overrides;
      if (!ov) return;
      if (ov.npcPos) setNpcPos(ov.npcPos);
      if (ov.npc2Pos) setNpc2Pos(ov.npc2Pos);
      if (ov.hutPositions) setHutPositions(ov.hutPositions);
      if (Array.isArray(ov.forcedTrees)) setForcedTrees(new Set(ov.forcedTrees));
      if (Array.isArray(ov.forcedClear)) setForcedClear(new Set(ov.forcedClear));
    }).catch(() => { /* liks numatytosios reikšmės */ });
  }, [token]);

  // Admin taip pat gali peržiūrėti visus registruotus narius, juos blokuoti/atblokuoti ar
  // ištrinti, bei pasižiūrėti pilną kiekvieno herojaus būklę ir kuprinės turinį - viskas per
  // REST (žr. src/adminRoutes.js), nariai identifikuojami DB id, ne vardu.
  const [adminTab, setAdminTab] = useState('map');
  const [usersList, setUsersList] = useState([]);
  const [selectedUserId, setSelectedUserId] = useState(null);
  const [selectedDetail, setSelectedDetail] = useState(null);
  const [confirmDeleteUser, setConfirmDeleteUser] = useState(null);
  const [memberMsg, setMemberMsg] = useState('');

  function refreshUsers() {
    apiFetch('/api/admin/users', { token }).then((data) => setUsersList(data.users || [])).catch(() => {});
  }
  useEffect(() => { refreshUsers(); }, [token]);

  // Pasirinkto nario pilna herojaus detalė - paduodama atskirai (ne kartu su sąrašu), kad
  // sąrašo puslapis liktų lengvas net turint daug narių.
  useEffect(() => {
    if (!selectedUserId) { setSelectedDetail(null); return; }
    let cancelled = false;
    apiFetch('/api/admin/users/' + selectedUserId + '/hero', { token })
      .then((data) => { if (!cancelled) setSelectedDetail({ user: data.user, hero: hydrateNetworkHero(data.hero) }); })
      .catch(() => { if (!cancelled) setSelectedDetail(null); });
    return () => { cancelled = true; };
  }, [selectedUserId, token]);

  function handleToggleBlock(userId, currentlyBlocked) {
    apiFetch('/api/admin/users/' + userId + '/block', { method: 'POST', token, body: JSON.stringify({ blocked: !currentlyBlocked }) })
      .then(() => { refreshUsers(); setMemberMsg(!currentlyBlocked ? 'Paskyra užblokuota.' : 'Paskyra atblokuota.'); })
      .catch(() => setMemberMsg('Nepavyko atlikti veiksmo.'));
  }
  function handleDeleteMember(userId) {
    apiFetch('/api/admin/users/' + userId, { method: 'DELETE', token })
      .then(() => {
        if (selectedUserId === userId) setSelectedUserId(null);
        setConfirmDeleteUser(null);
        refreshUsers();
        setMemberMsg('Paskyra ištrinta.');
      })
      .catch(() => setMemberMsg('Nepavyko ištrinti paskyros.'));
  }

  // Perskaičiuoja grynai procedūrinį (be admin override'ų) reljefą aplink DABARTINĘ (dar
  // neišsaugotą) parduotuvės NPC poziciją, kad redaktorius iškart rodytų, kaip persislinktų
  // miško/pievos juosta perkėlus parduotuvę - identiška formulė kaip globali naturalTileType().
  function editorNaturalTileType(x, y) {
    if (inPond(x, y)) return 'water';
    if (inLake(x, y)) return 'water';
    const homeDist = Math.hypot(x - npcPos.x, y - npcPos.y);
    if (homeDist < 7) return 'town';
    if (homeDist >= DANGER_START) return 'danger';
    const clearingFrac = Math.max(0, Math.min(1, (homeDist - 7) / (FOREST_FULL_AT - 7)));
    const forestChance = FOREST_MIN_DENSITY + clearingFrac * (FOREST_MAX_DENSITY - FOREST_MIN_DENSITY);
    return hash2(x * 7 + 1, y * 13 + 3) > 0.5 * (1 - forestChance) ? 'forest' : 'grass';
  }

  function addTree(key) {
    setForcedTrees((prev) => { if (prev.has(key)) return prev; const s = new Set(prev); s.add(key); return s; });
    setForcedClear((prev) => { if (!prev.has(key)) return prev; const s = new Set(prev); s.delete(key); return s; });
  }
  function addClear(key) {
    setForcedClear((prev) => { if (prev.has(key)) return prev; const s = new Set(prev); s.add(key); return s; });
    setForcedTrees((prev) => { if (!prev.has(key)) return prev; const s = new Set(prev); s.delete(key); return s; });
  }
  function eraseOverride(key) {
    setForcedTrees((prev) => { if (!prev.has(key)) return prev; const s = new Set(prev); s.delete(key); return s; });
    setForcedClear((prev) => { if (!prev.has(key)) return prev; const s = new Set(prev); s.delete(key); return s; });
  }

  function applyToolAt(x, y) {
    if (x < 0 || y < 0 || x >= WORLD_SIZE || y >= WORLD_SIZE) return;
    const key = x + ',' + y;
    if (tool === 'tree') addTree(key);
    else if (tool === 'clear') addClear(key);
    else if (tool === 'erase') eraseOverride(key);
    else if (tool === 'shop') setNpcPos({ x, y });
    else if (tool === 'lumberjack') setNpc2Pos({ x, y });
    else if (tool === 'hut1') setHutPositions((prev) => [{ x, y }, prev[1] || DEFAULT_HUT_POSITIONS[1]]);
    else if (tool === 'hut2') setHutPositions((prev) => [prev[0] || DEFAULT_HUT_POSITIONS[0], { x, y }]);
    setSavedMsg('');
  }

  function coordsFromEvent(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return { x: Math.floor((e.clientX - rect.left) / tilePx), y: Math.floor((e.clientY - rect.top) / tilePx) };
  }
  function onPointerDown(e) {
    const { x, y } = coordsFromEvent(e);
    paintingRef.current = true;
    applyToolAt(x, y);
  }
  function onPointerMoveCanvas(e) {
    const { x, y } = coordsFromEvent(e);
    setHoverTile(x >= 0 && y >= 0 && x < WORLD_SIZE && y < WORLD_SIZE ? { x, y } : null);
    if (paintingRef.current && (tool === 'tree' || tool === 'clear' || tool === 'erase')) applyToolAt(x, y);
  }
  function onPointerUpCanvas() { paintingRef.current = false; }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const px = tilePx;
    canvas.width = WORLD_SIZE * px * dpr;
    canvas.height = WORLD_SIZE * px * dpr;
    canvas.style.width = (WORLD_SIZE * px) + 'px';
    canvas.style.height = (WORLD_SIZE * px) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const baseColors = { grass: '#3c6a37', forest: '#1e341f', danger: '#332822', water: '#2d5a74', town: '#6b5a3f' };
    for (let gx = 0; gx < WORLD_SIZE; gx++) {
      for (let gy = 0; gy < WORLD_SIZE; gy++) {
        const key = gx + ',' + gy;
        let type = editorNaturalTileType(gx, gy);
        let markOverride = null;
        if (type === 'grass' || type === 'forest') {
          if (forcedClear.has(key)) { markOverride = type === 'forest' ? 'clear' : null; type = 'grass'; }
          else if (forcedTrees.has(key)) { markOverride = type === 'grass' ? 'tree' : null; type = 'forest'; }
        }
        ctx.fillStyle = baseColors[type];
        ctx.fillRect(gx * px, gy * px, px, px);
        if (markOverride === 'tree') { ctx.fillStyle = '#59d1ff'; ctx.fillRect(gx * px + px * 0.3, gy * px + px * 0.3, px * 0.4, px * 0.4); }
        else if (markOverride === 'clear') { ctx.fillStyle = '#ff5c5c'; ctx.fillRect(gx * px + px * 0.3, gy * px + px * 0.3, px * 0.4, px * 0.4); }
      }
    }

    function marker(pos, color) {
      ctx.beginPath();
      ctx.arc(pos.x * px + px / 2, pos.y * px + px / 2, Math.max(3, px * 0.65), 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
    }
    marker(HOME_POS, '#e6a13c');
    marker(npcPos, '#5ea8d1');
    marker(npc2Pos, '#8a6fd1');
    hutPositions.forEach((h) => marker(h, '#c1503f'));

    if (hoverTile) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(hoverTile.x * px + 0.5, hoverTile.y * px + 0.5, px - 1, px - 1);
    }
  }, [tilePx, forcedTrees, forcedClear, npcPos, npc2Pos, hutPositions, hoverTile]);

  function handleSave() {
    apiFetch('/api/admin/map-overrides', {
      method: 'PUT', token,
      body: JSON.stringify({ npcPos, npc2Pos, hutPositions, forcedTrees: [...forcedTrees], forcedClear: [...forcedClear] }),
    })
      .then(() => setSavedMsg('Išsaugota visiems žaidėjams! Prisijungę žaidėjai naują žemėlapį pamatys kitą kartą prisijungę (arba perkrovę puslapį).'))
      .catch(() => setSavedMsg('Nepavyko išsaugoti - patikrinkite ryšį su serveriu.'));
  }
  function handleResetDefaults() {
    setNpcPos(DEFAULT_NPC_POS); setNpc2Pos(DEFAULT_NPC2_POS); setHutPositions(DEFAULT_HUT_POSITIONS);
    setForcedTrees(new Set()); setForcedClear(new Set());
    setSavedMsg('Atstatyta į numatytąjį išdėstymą (dar neišsaugota).');
  }
  function handleClearSaved() {
    handleResetDefaults();
    apiFetch('/api/admin/map-overrides', {
      method: 'PUT', token,
      body: JSON.stringify({ npcPos: DEFAULT_NPC_POS, npc2Pos: DEFAULT_NPC2_POS, hutPositions: DEFAULT_HUT_POSITIONS, forcedTrees: [], forcedClear: [] }),
    })
      .then(() => setSavedMsg('Išsaugoti žemėlapio pakeitimai pašalinti (visiems žaidėjams).'))
      .catch(() => setSavedMsg('Nepavyko pašalinti išsaugotų pakeitimų.'));
  }

  const TOOLS = [
    { key: 'tree', label: '🌲 Sodinti medį' },
    { key: 'clear', label: '🪓 Naikinti medį' },
    { key: 'erase', label: '♻️ Grąžinti natūralų' },
    { key: 'shop', label: '🛒 Kelti parduotuvės NPC' },
    { key: 'lumberjack', label: '🪵 Kelti miškininką' },
    { key: 'hut1', label: '🏠 Kelti namelį 1' },
    { key: 'hut2', label: '🏠 Kelti namelį 2' },
  ];

  const selectedHero = selectedDetail ? selectedDetail.hero : null;

  return (
    <div className="forge admin-screen">
      <div className="admin-panel">
        <div>
          <div className="forge-kicker">Vienkiemis · admin</div>
          <h1 className="forge-title">Admin <span>valdymo skydas</span></h1>
        </div>

        <div className="admin-tabs">
          <button type="button" className={adminTab === 'map' ? 'active' : ''} onClick={() => setAdminTab('map')}>🗺️ Žemėlapis</button>
          <button type="button" className={adminTab === 'members' ? 'active' : ''} onClick={() => setAdminTab('members')}>👥 Nariai ({usersList.length})</button>
        </div>

        {adminTab === 'map' && (
          <React.Fragment>
            <p className="forge-sub">
              Pasirink įrankį, tada spausk (arba tempk pele/pirštu virš medžių įrankių) ant žemėlapio.
              Medžių įrankiai veikia tik miško/pievos juostoje - miestelyje, vandenyje ir pavojaus zonoje
              jie neturi įtakos. Išsaugojus, pakeitimus žaidime pamatysi kitą kartą prisijungęs.
            </p>

            <div className="admin-toolbar">
              {TOOLS.map((t) => (
                <button key={t.key} type="button" className={'admin-tool-btn' + (tool === t.key ? ' active' : '')} onClick={() => setTool(t.key)}>{t.label}</button>
              ))}
            </div>

            <div className="admin-zoom-row">
              <span>Mastelis:</span>
              <button type="button" className="overlay-btn ghost" onClick={() => setTilePx((p) => Math.max(4, p - 2))}>−</button>
              <span>{tilePx}px/langelis</span>
              <button type="button" className="overlay-btn ghost" onClick={() => setTilePx((p) => Math.min(18, p + 2))}>+</button>
              {hoverTile && <span className="admin-coord-readout">Langelis: {hoverTile.x}, {hoverTile.y}</span>}
            </div>

            <div className="admin-map-wrap">
              <canvas
                ref={canvasRef} className="admin-canvas"
                onPointerDown={onPointerDown} onPointerMove={onPointerMoveCanvas}
                onPointerUp={onPointerUpCanvas} onPointerLeave={onPointerUpCanvas}
              />
            </div>

            <div className="admin-legend">
              <span><i style={{ background: '#3c6a37' }} /> pieva</span>
              <span><i style={{ background: '#1e341f' }} /> miškas</span>
              <span><i style={{ background: '#332822' }} /> pavojaus zona</span>
              <span><i style={{ background: '#2d5a74' }} /> vanduo</span>
              <span><i style={{ background: '#6b5a3f' }} /> miestelis</span>
              <span><i style={{ background: '#59d1ff' }} /> pasodintas medis</span>
              <span><i style={{ background: '#ff5c5c' }} /> pašalintas medis</span>
              <span><i style={{ background: '#e6a13c', borderRadius: '50%' }} /> namai</span>
              <span><i style={{ background: '#5ea8d1', borderRadius: '50%' }} /> parduotuvės NPC</span>
              <span><i style={{ background: '#8a6fd1', borderRadius: '50%' }} /> miškininkas</span>
              <span><i style={{ background: '#c1503f', borderRadius: '50%' }} /> namukai</span>
            </div>

            {savedMsg && <div className="forge-error" style={{ background: 'rgba(111,174,90,0.14)', borderColor: 'rgba(111,174,90,0.5)', color: '#bfe6ab' }}>{savedMsg}</div>}

            <div className="admin-actions">
              <button type="button" className="forge-submit" onClick={handleSave}>💾 Išsaugoti žemėlapį</button>
              <button type="button" className="overlay-btn ghost" onClick={handleResetDefaults}>Atstatyti numatytąjį (neišsaugota)</button>
              <button type="button" className="overlay-btn ghost" onClick={handleClearSaved}>Pašalinti išsaugotus pakeitimus</button>
            </div>
          </React.Fragment>
        )}

        {adminTab === 'members' && (
          <React.Fragment>
            <p className="forge-sub">Visi registruoti žaidėjai. Paspausk narį, kad pamatytum pilną jo būklę ir kuprinės turinį.</p>

            {memberMsg && <div className="forge-error" style={{ background: 'rgba(111,174,90,0.14)', borderColor: 'rgba(111,174,90,0.5)', color: '#bfe6ab' }}>{memberMsg}</div>}

            {usersList.length === 0 ? (
              <p className="inv-empty-note">Dar nėra registruotų žaidėjų.</p>
            ) : (
              <div className="admin-member-list">
                {usersList.map((u) => (
                  <div className={'admin-member-row' + (selectedUserId === u.id ? ' selected' : '')} key={u.id}>
                    <div className="admin-member-info" onClick={() => setSelectedUserId(u.id)}>
                      <div className="admin-member-name">
                        {u.username}
                        {u.blocked && <span className="admin-blocked-tag">UŽBLOKUOTA</span>}
                      </div>
                      <div className="admin-member-meta">registruota {new Date(u.created_at).toLocaleDateString('lt-LT')}</div>
                    </div>
                    <div className="admin-member-actions">
                      <button type="button" className="overlay-btn ghost" onClick={() => setSelectedUserId(u.id)}>Peržiūrėti</button>
                      <button type="button" className="overlay-btn ghost" onClick={() => handleToggleBlock(u.id, u.blocked)}>{u.blocked ? 'Atblokuoti' : 'Blokuoti'}</button>
                      {confirmDeleteUser === u.id ? (
                        <React.Fragment>
                          <button type="button" className="overlay-btn danger" onClick={() => handleDeleteMember(u.id)}>Taip, trinti</button>
                          <button type="button" className="overlay-btn ghost" onClick={() => setConfirmDeleteUser(null)}>Atšaukti</button>
                        </React.Fragment>
                      ) : (
                        <button type="button" className="overlay-btn danger" onClick={() => setConfirmDeleteUser(u.id)}>Trinti</button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {selectedUserId && !selectedDetail && (
              <p className="inv-empty-note">Kraunama...</p>
            )}

            {selectedUserId && selectedHero && (
              <div className="admin-member-detail">
                <div className="admin-member-detail-header">
                  <h3>{selectedDetail.user.username}{selectedDetail.user.blocked && <span className="admin-blocked-tag">UŽBLOKUOTA</span>}</h3>
                  <button type="button" className="overlay-btn ghost" onClick={() => setSelectedUserId(null)}>Uždaryti</button>
                </div>
                <div className="admin-stat-grid">
                  <div><span>Lygis</span><b>{selectedHero.level}</b></div>
                  <div><span>Patirtis</span><b>{selectedHero.xp} / {xpForLevel(selectedHero.level)}</b></div>
                  <div><span>Gyvybė</span><b>{Math.round(selectedHero.hp)} / {selectedHero.maxHp}</b></div>
                  <div><span>Alkis</span><b>{Math.round(selectedHero.hunger)}%</b></div>
                  <div><span>Troškulys</span><b>{Math.round(selectedHero.thirst)}%</b></div>
                  <div><span>Nužudymai</span><b>{selectedHero.kills}</b></div>
                  <div><span>Pozicija</span><b>{Math.round(selectedHero.x)}, {Math.round(selectedHero.y)}</b></div>
                  <div><span>Gyvas</span><b>{formatSurvivalTime(Date.now() - selectedHero.aliveSince)}</b></div>
                  <div><span>Laužai</span><b>{selectedHero.campfires.length}</b></div>
                  <div><span>Grobis žemėje</span><b>{selectedHero.lootDrops.length}</b></div>
                  <div><span>Užduotis</span><b>{selectedHero.questClaimed ? 'atsiimta' : selectedHero.questAccepted ? selectedHero.questChopped + '/' + QUEST_CHOP_TARGET : 'nepriimta'}</b></div>
                </div>
                <h4 className="admin-inv-heading">Kuprinė</h4>
                {(selectedHero.wood > 0 || selectedHero.matches > 0 || selectedHero.coins > 0 || selectedHero.meat > 0 || selectedHero.chocolate > 0 || selectedHero.bandage > 0 || selectedHero.medicine > 0 || selectedHero.gira > 0 || selectedHero.arrows > 0 || selectedHero.fish > 0 || selectedHero.ownedWeapons.some((w) => w !== 'fists') || selectedHero.helmetCount > 0 || selectedHero.helmetOn) ? (
                  <div className="inv-grid">
                    {selectedHero.wood > 0 && <div className="inv-slot"><span className="inv-slot-icon">🪵</span><span className="inv-slot-label">Mediena</span><span className="inv-slot-count">{selectedHero.wood}</span></div>}
                    {selectedHero.matches > 0 && <div className="inv-slot"><span className="inv-slot-icon">🔥</span><span className="inv-slot-label">Degtukai</span><span className="inv-slot-count">{selectedHero.matches}</span></div>}
                    {selectedHero.coins > 0 && <div className="inv-slot"><span className="inv-slot-icon">🪙</span><span className="inv-slot-label">Valiuta</span><span className="inv-slot-count">{selectedHero.coins}</span></div>}
                    {selectedHero.meat > 0 && <div className="inv-slot"><span className="inv-slot-icon">🥫</span><span className="inv-slot-label">{FOOD_ITEMS.meat.label}</span><span className="inv-slot-count">{selectedHero.meat}</span></div>}
                    {selectedHero.chocolate > 0 && <div className="inv-slot"><span className="inv-slot-icon">🍫</span><span className="inv-slot-label">{FOOD_ITEMS.chocolate.label}</span><span className="inv-slot-count">{selectedHero.chocolate}</span></div>}
                    {selectedHero.bandage > 0 && <div className="inv-slot"><span className="inv-slot-icon">🩹</span><span className="inv-slot-label">{MED_ITEMS.bandage.label}</span><span className="inv-slot-count">{selectedHero.bandage}</span></div>}
                    {selectedHero.medicine > 0 && <div className="inv-slot"><span className="inv-slot-icon">💊</span><span className="inv-slot-label">{MED_ITEMS.medicine.label}</span><span className="inv-slot-count">{selectedHero.medicine}</span></div>}
                    {selectedHero.gira > 0 && <div className="inv-slot"><span className="inv-slot-icon">🍯</span><span className="inv-slot-label">{DRINK_ITEMS.gira.label}</span><span className="inv-slot-count">{selectedHero.gira}</span></div>}
                    {selectedHero.arrows > 0 && <div className="inv-slot"><span className="inv-slot-icon">➶</span><span className="inv-slot-label">Strėlės</span><span className="inv-slot-count">{selectedHero.arrows}</span></div>}
                    {selectedHero.fish > 0 && <div className="inv-slot"><span className="inv-slot-icon">🐟</span><span className="inv-slot-label">{FOOD_ITEMS.fish.label}</span><span className="inv-slot-count">{selectedHero.fish}</span></div>}
                    {selectedHero.ownedWeapons.filter((w) => w !== 'fists').map((w) => (
                      <div className={'inv-slot weapon-slot' + (w === selectedHero.weapon ? ' equipped' : '')} key={w}>
                        {w === selectedHero.weapon && <span className="inv-slot-tag">Naudojama</span>}
                        <span className="inv-slot-icon">{WEAPONS[w].icon}</span>
                        <span className="inv-slot-label">{WEAPONS[w].label}</span>
                        <span className="inv-slot-count">{selectedHero.weaponCounts[w] || 1}</span>
                      </div>
                    ))}
                    {(selectedHero.helmetCount > 0 || selectedHero.helmetOn) && (
                      <div className={'inv-slot weapon-slot' + (selectedHero.helmetOn ? ' equipped' : '')}>
                        {selectedHero.helmetOn && <span className="inv-slot-tag">Užsidėta</span>}
                        <span className="inv-slot-icon">🪖</span>
                        <span className="inv-slot-label">Šalmas</span>
                        <span className="inv-slot-count">{selectedHero.helmetCount + (selectedHero.helmetOn ? 1 : 0)}</span>
                      </div>
                    )}
                  </div>
                ) : (
                  <p className="inv-empty-note">Kuprinė tuščia.</p>
                )}
              </div>
            )}
          </React.Fragment>
        )}

        <div className="admin-actions">
          <button type="button" className="overlay-btn ghost" onClick={onExit}>Atgal į prisijungimą</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const [auth, setAuth] = useState(null);
  // Kol tikrinamas išsaugotas tokenas (žr. useEffect žemiau), rodomas minimalus "Jungiamasi..."
  // ekranas - be šito, akimirksniu prieš patvirtinimą matytųsi AuthForge, o po to "šoktelėtų"
  // į Sandbox, jei tokenas galiojantis.
  const [checkingSession, setCheckingSession] = useState(true);
  const [entered, setEntered] = useState(false);
  const [adminMode, setAdminMode] = useState(false);
  // Admin tokenas laikomas ATSKIRAI nuo įprasto žaidėjo (getToken()/setToken()) - admin
  // prisijungimas neina per handleEnter, tad neperrašo žaidėjo sesijos localStorage.
  const [adminToken, setAdminToken] = useState(null);

  // Sesijos atkūrimas puslapį perkrovus - jei localStorage turi tokeną, patvirtiname jį (ir kartu
  // gauname šviežią herojų) per GET /api/hero. Negaliojantis/pasibaigęs tokenas (401) - tiesiog
  // išvalomas, žaidėjas grąžinamas į AuthForge.
  useEffect(() => {
    let cancelled = false;
    const token = getToken();
    if (!token) { setCheckingSession(false); return; }
    apiFetch('/api/hero')
      .then((data) => {
        if (cancelled) return;
        setAuth({ username: getStoredUsername(), hero: hydrateNetworkHero(data.hero), token });
      })
      .catch(() => {
        if (cancelled) return;
        setToken(null);
        setStoredUsername(null);
      })
      .finally(() => { if (!cancelled) setCheckingSession(false); });
    return () => { cancelled = true; };
  }, []);

  function handleEnter(token, username, hero) {
    setToken(token);
    setStoredUsername(username);
    setAuth({ username, hero, token });
    setEntered(false);
  }
  function handleLogout() {
    setToken(null);
    setStoredUsername(null);
    setAuth(null);
    setEntered(false);
  }
  function handleUpdateHero(patch) {
    setAuth((prev) => {
      if (!prev) return prev;
      const hero = { ...prev.hero, ...patch };
      autosaveHero(hero);
      return { ...prev, hero };
    });
  }
  function handleAdminEnter(token) { setAdminToken(token); setAdminMode(true); }
  function handleAdminExit() { setAdminMode(false); setAdminToken(null); }

  if (checkingSession) {
    return (
      <div className="forge">
        <p className="forge-sub">Jungiamasi...</p>
      </div>
    );
  }
  if (adminMode) return <AdminScreen onExit={handleAdminExit} token={adminToken} />;
  if (!auth) return <AuthForge onEnter={handleEnter} onAdminEnter={handleAdminEnter} />;
  if (!entered) {
    return (
      <CharacterScreen
        hero={auth.hero}
        onStart={() => setEntered(true)}
        onLogout={handleLogout}
        onUpdateHero={handleUpdateHero}
      />
    );
  }
  return <Sandbox key={auth.username} hero={auth.hero} username={auth.username} token={auth.token} onLogout={handleLogout} />;
}

// Prieš pirmą kartą atvaizduojant React'o medį, VIENĄ kartą pabandome gauti serveryje išsaugotus
// žemėlapio override'us (žr. applyServerMapOverrides aukščiau) - taip visi žaidėjai (ne tik
// adminas) nuo pat pirmo kadro mato TĄ PATĮ (admino redaguotą, jei toks yra) žemėlapį. Jei
// užklausa nepavyksta (serveris dar nepasiekiamas ir pan.), tiesiog liekame prie numatytųjų
// reikšmių - žaidimas vis tiek veikia, tik be admino pakeitimų, kol puslapis bus perkrautas.
async function bootstrap() {
  try {
    const res = await fetch('/api/map-overrides');
    if (res.ok) {
      const data = await res.json();
      applyServerMapOverrides(data && data.overrides);
    }
  } catch { /* liekame prie numatytųjų reikšmių */ }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
bootstrap();
</script>
