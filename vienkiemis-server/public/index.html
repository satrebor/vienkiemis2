function drawDiamond(ctx, cx, cy, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - h / 2); ctx.lineTo(cx + w / 2, cy); ctx.lineTo(cx, cy + h / 2); ctx.lineTo(cx - w / 2, cy);
  ctx.closePath();
}

function drawTree(ctx, sx, sy, gx, gy) {
  const jitter = hash2(gx * 3 + 5, gy * 5 + 11);
  const lean = (jitter - 0.5) * 3;
  const trunkH = 24 + jitter * 8;
  const baseY = sy - 3;
  const trunkTopY = baseY - trunkH;

  // žemės šešėlis, kad medis "stovėtų" ant žemės
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 2, 13, 4.6, 0, 0, Math.PI * 2); ctx.fill();

  // kamienas - konusinis, su žievės atspalviu
  ctx.fillStyle = '#3c2a1a';
  ctx.beginPath();
  ctx.moveTo(sx - 4, baseY);
  ctx.lineTo(sx - 1.4 + lean, trunkTopY);
  ctx.lineTo(sx + 1.4 + lean, trunkTopY);
  ctx.lineTo(sx + 4, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#2a1c10';
  ctx.beginPath();
  ctx.moveTo(sx + 0.5, baseY);
  ctx.lineTo(sx + 1.4 + lean, trunkTopY);
  ctx.lineTo(sx + 4, baseY);
  ctx.closePath();
  ctx.fill();

  // lajos "kekės" - kelios persidengiančios elipsės, kad atrodytų apvalesnė ir gyvesnė
  const cx0 = sx + lean, cy0 = trunkTopY + 4;
  const blobs = [
    { dx: 0, dy: -30, r: 15.5 },
    { dx: -13, dy: -19, r: 12.5 },
    { dx: 13, dy: -19, r: 12.5 },
    { dx: -7, dy: -8, r: 12 },
    { dx: 8, dy: -9, r: 12.5 },
    { dx: 0, dy: -17, r: 13.5 },
  ];
  ctx.fillStyle = '#152a17';
  for (const b of blobs) {
    ctx.beginPath();
    ctx.ellipse(cx0 + b.dx, cy0 + b.dy, b.r, b.r * 0.82, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // šviesesnis viršutinis sluoksnis - suteikia apimties/šviesos kritimo pojūtį
  ctx.fillStyle = '#234328';
  const hi = [
    { dx: -4, dy: -34, r: 9.5 },
    { dx: 9, dy: -24, r: 8 },
    { dx: -10, dy: -14, r: 7.5 },
  ];
  for (const b of hi) {
    ctx.beginPath();
    ctx.ellipse(cx0 + b.dx, cy0 + b.dy, b.r, b.r * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Akmenys/uolos - danga "pavojaus" zonai už miško (vietoje medžių).
function drawRock(ctx, sx, sy, gx, gy) {
  const jitter = hash2(gx * 9 + 3, gy * 11 + 7);
  const s = 0.8 + jitter * 0.6;
  const baseY = sy - 1;

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(sx, baseY + 4, 12 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#453e37';
  ctx.beginPath();
  ctx.moveTo(sx - 11 * s, baseY);
  ctx.lineTo(sx - 6 * s, baseY - 14 * s);
  ctx.lineTo(sx + 4 * s, baseY - 16 * s);
  ctx.lineTo(sx + 12 * s, baseY - 4 * s);
  ctx.lineTo(sx + 8 * s, baseY + 2 * s);
  ctx.lineTo(sx - 4 * s, baseY + 3 * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = '#5c5248';
  ctx.beginPath();
  ctx.moveTo(sx - 6 * s, baseY - 14 * s);
  ctx.lineTo(sx + 4 * s, baseY - 16 * s);
  ctx.lineTo(sx, baseY - 6 * s);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#332c26';
  ctx.beginPath(); ctx.ellipse(sx + 10 * s, baseY - 1, 5 * s, 3.6 * s, 0.3, 0, Math.PI * 2); ctx.fill();
}

// Grynai dekoratyvi plaukiojanti žuvis ežere (žr. LAKE_FISH) - be jokio "hitbox'o", tik
// paįvairina vandenį; kryptis/uodegos mostas keičiasi pagal sin/cos, kad plaukimas atrodytų gyvas.
function drawSwimmingFish(ctx, sx, sy, t, phase) {
  const swimAngle = Math.sin(t * 0.9 + phase) * 0.4;
  const flip = Math.cos(t * 0.9 + phase) >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(flip, 1);
  ctx.rotate(swimAngle * 0.3);
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#6fa8c9';
  ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a7c9c';
  ctx.beginPath();
  const tailWag = Math.sin(t * 6 + phase) * 2.2;
  ctx.moveTo(-6, 0); ctx.lineTo(-10, -3 + tailWag); ctx.lineTo(-10, 3 + tailWag); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(230,240,245,0.7)';
  ctx.beginPath(); ctx.arc(3, -0.6, 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Irklinė valtis prie ežero kranto (žr. BOAT_DOCK_WEST/EAST) - pusė ant žolės, pusė vandenyje,
// su irklu; lengvas siūbavimas (bob) suteikia gyvumo net stovint vietoje.
function drawBoat(ctx, sx, sy, t, facingRight) {
  const bob = Math.sin(t * 1.3) * 1.4;
  const flip = facingRight ? 1 : -1;
  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.scale(flip, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 5, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b4a2a';
  ctx.beginPath();
  ctx.moveTo(-16, 0); ctx.lineTo(-11, 7); ctx.lineTo(11, 7); ctx.lineTo(16, 0); ctx.lineTo(11, -3); ctx.lineTo(-11, -3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3f2a18'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = '#8a6238';
  ctx.beginPath(); ctx.moveTo(-13, -1.5); ctx.lineTo(13, -1.5); ctx.lineTo(10, 1.5); ctx.lineTo(-10, 1.5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4a3220'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4, -3); ctx.lineTo(15, -14); ctx.stroke();
  ctx.fillStyle = '#4a3220';
  ctx.beginPath(); ctx.ellipse(15.5, -15, 3, 1.6, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawTile(ctx, gx, gy, sx, sy, stump, t) {
  const type = tileType(gx, gy);
  const parity = (gx + gy) % 2;
  const [c1, c2] = TILE_COLORS[type];
  drawDiamond(ctx, sx, sy, TILE_W, TILE_H);
  ctx.fillStyle = parity === 0 ? c1 : c2;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.16)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (type === 'water') {
    const shimmer = Math.sin(t * 1.6 + gx * 0.7 + gy * 0.4) * 0.05;
    ctx.fillStyle = `rgba(180,220,235,${0.06 + shimmer})`;
    drawDiamond(ctx, sx, sy - 2, TILE_W * 0.6, TILE_H * 0.5);
    ctx.fill();
  } else if (type === 'forest' && !stump) {
    drawTree(ctx, sx, sy, gx, gy);
  } else if (type === 'forest' && stump) {
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.ellipse(sx, sy - 2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#241a10'; ctx.lineWidth = 1; ctx.stroke();
  } else if (type === 'danger') {
    if (hash2(gx * 13 + 2, gy * 17 + 9) > 0.5 * (1 - DANGER_ROCK_DENSITY)) drawRock(ctx, sx, sy, gx, gy);
  } else if (type === 'grass' && nearLakeShore(gx, gy)) {
    // Akmenys, išbarstyti aplink ežero krantą (žr. LAKE) - ta pati drawRock() funkcija, kuri
    // dengia pavojaus zoną, tik gerokai retesnė (0.22), kad krantas neatrodytų kaip akmenynas.
    if (hash2(gx * 19 + 4, gy * 23 + 8) > 0.5 * (1 - 0.22)) drawRock(ctx, sx, sy, gx, gy);
  }
}

// Daugiabučio vidaus langelio piešimas - lx/ly vietinės koordinatės (žr. interiorTileType).
function drawInteriorTile(ctx, lx, ly, sx, sy) {
  const type = interiorTileType(lx, ly);
  const parity = (lx + ly) % 2;
  drawDiamond(ctx, sx, sy, TILE_W, TILE_H);
  if (type === 'wall') {
    ctx.fillStyle = parity === 0 ? '#3a3a3e' : '#333336';
  } else if (type === 'door') {
    ctx.fillStyle = '#5c5240';
  } else {
    ctx.fillStyle = parity === 0 ? '#57544c' : '#4d4a43';
  }
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (type === 'wall') {
    // paprasta vertikali "siena" virš langelio, kad atrodytų kaip mūras, ne vien grindys
    ctx.fillStyle = '#26262a';
    ctx.fillRect(sx - TILE_W / 2, sy - 22, TILE_W, 22);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
    ctx.strokeRect(sx - TILE_W / 2, sy - 22, TILE_W, 22);
  } else if (type === 'door') {
    ctx.strokeStyle = 'rgba(143,209,92,0.55)'; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
    drawDiamond(ctx, sx, sy, TILE_W - 6, TILE_H - 3); ctx.stroke(); ctx.setLineDash([]);
  } else if (type === 'pillar') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b675e'; ctx.fillRect(sx - 6, sy - 16, 12, 18);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(sx - 6, sy - 16, 12, 18);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(sx - 6, sy - 16, 4, 18);
  }
}

function drawHomeMarker(ctx, sx, sy) {
  const baseY = sy + 2;
  ctx.fillStyle = '#7a5228'; ctx.fillRect(sx - 12, baseY - 12, 24, 14);
  ctx.beginPath(); ctx.moveTo(sx - 16, baseY - 12); ctx.lineTo(sx, baseY - 25); ctx.lineTo(sx + 16, baseY - 12); ctx.closePath();
  ctx.fillStyle = '#a85a36'; ctx.fill();
  ctx.fillStyle = '#2c1f12'; ctx.fillRect(sx - 3, baseY - 7, 6, 7);
}

// variant keičia sienų/stogo spalvą, kad skirtingi kaimeliai (žr. VILLAGE_HUTS) atrodytų kaip
// skirtingi namukų tipai: 0 - numatytasis rąstinis (taip pat naudojamas admin HUT_POSITIONS),
// 1 - balintas mūrinis, 2 - tamsus, šiaudiniu stogu dengtas.
const HUT_VARIANTS = {
  0: { wall: '#7d6144', wallShade: 'rgba(0,0,0,0.17)', logEnd: '#5f4a34', roof: '#463c2c', roofShade: 'rgba(0,0,0,0.24)' },
  1: { wall: '#b7ac93', wallShade: 'rgba(0,0,0,0.14)', logEnd: '#8f8266', roof: '#6b4a3a', roofShade: 'rgba(0,0,0,0.22)' },
  2: { wall: '#5a4632', wallShade: 'rgba(0,0,0,0.2)', logEnd: '#3f3020', roof: '#7a6a34', roofShade: 'rgba(0,0,0,0.26)' },
};

function drawHut(ctx, sx, sy, variant) {
  // S - bendras dydžio daugiklis: namukai padidinti maždaug per 6 langelius (senasis namas
  // buvo tik apie 1 langelio pločio, dabar - solidus, gerokai už jį didesnis trobesys).
  const S = 2.3;
  const clr = HUT_VARIANTS[variant] || HUT_VARIANTS[0];
  const baseY = sy + 5;
  const hw = 20 * S, wallH = 21 * S;
  const wallTop = baseY - wallH;
  const roofPeakY = wallTop - 21 * S;

  // žemės šešėlis - didesnis, nes namas dabar solidesnis
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(sx, baseY + 5 * S, hw + 9 * S, 7.5 * S, 0, 0, Math.PI * 2); ctx.fill();

  // akmenų pamatas
  ctx.fillStyle = '#68645a';
  ctx.fillRect(sx - hw - 2 * S, baseY - 5 * S, hw * 2 + 4 * S, 6 * S);
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1.3;
  for (let i = 0; i < 5; i++) { ctx.strokeRect(sx - hw - 1 * S + i * ((hw * 2 + 2 * S) / 5), baseY - 5 * S, (hw * 2 + 2 * S) / 5, 6 * S); }

  // rąstinės sienos - pagrindinis blokas + šešėlinė (dešinė) pusė tūriui
  ctx.fillStyle = clr.wall; ctx.fillRect(sx - hw, wallTop, hw * 2, wallH);
  ctx.fillStyle = clr.wallShade; ctx.fillRect(sx + hw * 0.42, wallTop, hw * 0.58, wallH);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.3;
  for (let ly = wallTop + 4 * S; ly < baseY - 5 * S; ly += 4.2 * S) {
    ctx.beginPath(); ctx.moveTo(sx - hw, ly); ctx.lineTo(sx + hw, ly); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 1.8; ctx.strokeRect(sx - hw, wallTop, hw * 2, wallH);
  // rąstų galų kampai - suteikia rąstinio namo įspūdį
  ctx.fillStyle = clr.logEnd;
  for (const cx of [sx - hw, sx + hw]) {
    for (const cy of [wallTop + 3 * S, baseY - 6 * S]) {
      ctx.beginPath(); ctx.ellipse(cx, cy, 2.6 * S, 2 * S, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // stogas - status dvišlaitis su iškyša ir šiaudų/čerpių juostomis
  const eaveL = { x: sx - hw - 7 * S, y: wallTop + 3 * S }, eaveR = { x: sx + hw + 7 * S, y: wallTop + 3 * S };
  const peak = { x: sx, y: roofPeakY };
  const thick = 8 * S;
  ctx.fillStyle = clr.roof;
  ctx.beginPath();
  ctx.moveTo(eaveL.x, eaveL.y); ctx.lineTo(peak.x, peak.y); ctx.lineTo(eaveR.x, eaveR.y);
  ctx.lineTo(eaveR.x - thick * 0.4, eaveR.y + thick); ctx.lineTo(peak.x, peak.y + thick); ctx.lineTo(eaveL.x + thick * 0.4, eaveL.y + thick);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = clr.roofShade;
  ctx.beginPath();
  ctx.moveTo(peak.x, peak.y); ctx.lineTo(eaveR.x, eaveR.y);
  ctx.lineTo(eaveR.x - thick * 0.4, eaveR.y + thick); ctx.lineTo(peak.x, peak.y + thick);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.3;
  for (const off of [thick * 0.375, thick * 0.75]) {
    ctx.beginPath(); ctx.moveTo(eaveL.x + thick * 0.4 * (off / thick), eaveL.y + off); ctx.lineTo(peak.x, peak.y + off); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(peak.x, peak.y + off); ctx.lineTo(eaveR.x - thick * 0.4 * (off / thick), eaveR.y + off); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(20,15,10,0.4)'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(peak.x, peak.y); ctx.lineTo(peak.x, peak.y + thick); ctx.stroke();

  // kaminas - be dūmų, namas apleistas, niekas jo nekūrena
  ctx.fillStyle = '#5c584f';
  ctx.fillRect(sx + hw * 0.35, roofPeakY + 2 * S, 6 * S, 12 * S);
  ctx.fillStyle = '#4a4740';
  ctx.fillRect(sx + hw * 0.35 - 1 * S, roofPeakY, 8 * S, 3 * S);

  // langas su rėmu ir langinėmis - tamsus, apdulkėjęs stiklas (apleistas namas), su įtrūkiu
  const winX = sx - hw * 0.55, winY = wallTop + wallH * 0.4;
  ctx.fillStyle = '#3c3226'; ctx.fillRect(winX - 5 * S, winY - 5 * S, 10 * S, 10 * S);
  ctx.fillStyle = 'rgba(30,34,30,0.7)'; ctx.fillRect(winX - 3.5 * S, winY - 3.5 * S, 7 * S, 7 * S);
  ctx.strokeStyle = 'rgba(20,15,10,0.5)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(winX, winY - 3.5 * S); ctx.lineTo(winX, winY + 3.5 * S); ctx.moveTo(winX - 3.5 * S, winY); ctx.lineTo(winX + 3.5 * S, winY); ctx.stroke();
  ctx.strokeStyle = 'rgba(180,190,190,0.35)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(winX - 2.6 * S, winY - 2.8 * S); ctx.lineTo(winX + 0.6 * S, winY + 1.2 * S); ctx.lineTo(winX - 0.8 * S, winY + 3 * S); ctx.stroke();
  ctx.fillStyle = '#4a3a26';
  ctx.fillRect(winX - 7.5 * S, winY - 5 * S, 2 * S, 10 * S); ctx.fillRect(winX + 5.5 * S, winY - 5 * S, 2 * S, 10 * S);

  // durys su lentų linijomis ir rankena
  const doorX = sx + hw * 0.15, doorW = 9 * S, doorH = 15 * S;
  ctx.fillStyle = '#2c2015'; ctx.fillRect(doorX - doorW / 2, baseY - 5 * S - doorH, doorW, doorH);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.3;
  for (const dx of [-2 * S, 0, 2 * S]) { ctx.beginPath(); ctx.moveTo(doorX + dx, baseY - 5 * S - doorH + 1 * S); ctx.lineTo(doorX + dx, baseY - 6 * S); ctx.stroke(); }
  ctx.fillStyle = '#c9903f';
  ctx.beginPath(); ctx.arc(doorX + doorW / 2 - 2 * S, baseY - 5 * S - doorH / 2, 1.2 * S, 0, Math.PI * 2); ctx.fill();
}

// Bažnyčia - vienkartinis dekoratyvus pastatas (žr. CHURCH_POS): aukštesnis nei namukas, su
// bokšteliu ir kryžiumi viršuje, langu-rozete fasade.
function drawChurch(ctx, sx, sy) {
  const S = 2.5;
  const baseY = sy + 5;
  const hw = 17 * S, wallH = 26 * S;
  const wallTop = baseY - wallH;

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(sx, baseY + 5 * S, hw + 8 * S, 7 * S, 0, 0, Math.PI * 2); ctx.fill();

  // akmeninis pamatas ir sienos
  ctx.fillStyle = '#7a7468'; ctx.fillRect(sx - hw - 2 * S, baseY - 5 * S, hw * 2 + 4 * S, 6 * S);
  ctx.fillStyle = '#c9c2b0'; ctx.fillRect(sx - hw, wallTop, hw * 2, wallH);
  ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fillRect(sx + hw * 0.45, wallTop, hw * 0.55, wallH);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.4; ctx.strokeRect(sx - hw, wallTop, hw * 2, wallH);

  // status dvišlaitis stogas
  const eaveL = { x: sx - hw - 6 * S, y: wallTop + 2 * S }, eaveR = { x: sx + hw + 6 * S, y: wallTop + 2 * S };
  const peak = { x: sx, y: wallTop - 20 * S };
  const thick = 7 * S;
  ctx.fillStyle = '#6b3a34';
  ctx.beginPath();
  ctx.moveTo(eaveL.x, eaveL.y); ctx.lineTo(peak.x, peak.y); ctx.lineTo(eaveR.x, eaveR.y);
  ctx.lineTo(eaveR.x - thick * 0.4, eaveR.y + thick); ctx.lineTo(peak.x, peak.y + thick); ctx.lineTo(eaveL.x + thick * 0.4, eaveL.y + thick);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.moveTo(peak.x, peak.y); ctx.lineTo(eaveR.x, eaveR.y);
  ctx.lineTo(eaveR.x - thick * 0.4, eaveR.y + thick); ctx.lineTo(peak.x, peak.y + thick);
  ctx.closePath(); ctx.fill();

  // bokštelis su smailia stogele ir kryžiumi
  const towerW = 8 * S, towerH = 22 * S, towerBase = peak.y + 4 * S;
  ctx.fillStyle = '#b0a894'; ctx.fillRect(sx - towerW / 2, towerBase - towerH, towerW, towerH);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.2; ctx.strokeRect(sx - towerW / 2, towerBase - towerH, towerW, towerH);
  const spirePeak = { x: sx, y: towerBase - towerH - 16 * S };
  ctx.fillStyle = '#4a3230';
  ctx.beginPath();
  ctx.moveTo(sx - towerW / 2 - 2 * S, towerBase - towerH); ctx.lineTo(spirePeak.x, spirePeak.y); ctx.lineTo(sx + towerW / 2 + 2 * S, towerBase - towerH);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2c1f12'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx, spirePeak.y); ctx.lineTo(sx, spirePeak.y - 10 * S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx - 4 * S, spirePeak.y - 6 * S); ctx.lineTo(sx + 4 * S, spirePeak.y - 6 * S); ctx.stroke();

  // rozetė (apvalus langas) fasade
  ctx.fillStyle = '#3c3226'; ctx.beginPath(); ctx.arc(sx, wallTop + wallH * 0.4, 5 * S, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(140,190,220,0.55)'; ctx.beginPath(); ctx.arc(sx, wallTop + wallH * 0.4, 3.4 * S, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20,15,10,0.5)'; ctx.lineWidth = 1;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
    ctx.beginPath(); ctx.moveTo(sx, wallTop + wallH * 0.4); ctx.lineTo(sx + Math.cos(a) * 3.4 * S, wallTop + wallH * 0.4 + Math.sin(a) * 3.4 * S); ctx.stroke();
  }

  // durys
  const doorW = 8 * S, doorH = 13 * S;
  ctx.fillStyle = '#2c2015'; ctx.fillRect(sx - doorW / 2, baseY - 5 * S - doorH, doorW, doorH);
}

// Daugiabutis - didelis blokinis pastatas su langų eilėmis ir durimis, į kurias galima įeiti
// (žr. APARTMENT_POSITIONS/APARTMENT_RANGE ir enterBuilding/exitBuilding logiką frame() cikle).
function drawApartment(ctx, sx, sy, glow) {
  const S = 2.6;
  const baseY = sy + 6;
  const hw = 30 * S, wallH = 44 * S;
  const wallTop = baseY - wallH;

  ctx.fillStyle = 'rgba(0,0,0,0.36)';
  ctx.beginPath(); ctx.ellipse(sx, baseY + 5 * S, hw + 10 * S, 8 * S, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#6b6a63'; ctx.fillRect(sx - hw - 2 * S, baseY - 5 * S, hw * 2 + 4 * S, 6 * S);
  ctx.fillStyle = '#9a9488'; ctx.fillRect(sx - hw, wallTop, hw * 2, wallH);
  ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(sx + hw * 0.5, wallTop, hw * 0.5, wallH);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.6; ctx.strokeRect(sx - hw, wallTop, hw * 2, wallH);

  // plokščias stogas su nedideliu parapetu
  ctx.fillStyle = '#524f47'; ctx.fillRect(sx - hw - 3 * S, wallTop - 5 * S, hw * 2 + 6 * S, 5 * S);

  // langų eilės (4 aukštai x kelios kolonos), keli apšviesti (langai su gira/loot viduje laukia)
  const cols = 5, rows = 4;
  const winW = (hw * 2) / (cols * 1.8), winH = wallH / (rows * 1.9);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const wx = sx - hw + (c + 0.7) * (hw * 2 / cols);
      const wy = wallTop + (r + 0.65) * (wallH / rows);
      const lit = hash2(r * 11 + c * 7 + 3, c * 5 + r * 9 + 1) > 0.6;
      ctx.fillStyle = lit ? 'rgba(230,190,90,0.5)' : 'rgba(20,25,30,0.55)';
      ctx.fillRect(wx - winW / 2, wy - winH / 2, winW, winH);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(wx - winW / 2, wy - winH / 2, winW, winH);
    }
  }

  // durys - šviečia švelniai, kad matytųsi, jog jas galima atidaryti
  const doorW = 10 * S, doorH = 15 * S;
  const doorX = sx, doorY = baseY - 5 * S;
  ctx.fillStyle = glow ? 'rgba(240,196,25,0.85)' : '#2c2c26';
  ctx.fillRect(doorX - doorW / 2, doorY - doorH, doorW, doorH);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.4; ctx.strokeRect(doorX - doorW / 2, doorY - doorH, doorW, doorH);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(doorX, doorY - doorH); ctx.lineTo(doorX, doorY); ctx.stroke();
}

function drawShopkeeper(ctx, sx, sy, ts, facing) {
  const baseY = sy + 8;
  // prekystalis
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(sx, baseY + 4, 24, 6.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5c4326'; ctx.fillRect(sx - 20, baseY - 8, 40, 8);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(sx - 20, baseY - 8, 40, 8);
  ctx.fillStyle = '#3d2c18';
  ctx.fillRect(sx - 17, baseY, 3, 7);
  ctx.fillRect(sx + 14, baseY, 3, 7);
  ctx.fillStyle = '#7a5228'; ctx.fillRect(sx - 11, baseY - 16, 8, 8);
  ctx.fillStyle = '#8a6030'; ctx.fillRect(sx + 2, baseY - 14, 8, 6);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.8;
  ctx.strokeRect(sx - 11, baseY - 16, 8, 8);
  ctx.strokeRect(sx + 2, baseY - 14, 8, 6);

  // benamis - žmogus už prekystalio
  drawHumanoid(ctx, sx, baseY - 12, { body: '#564a3a', head: '#c9a074', accent: '#6b5638' }, {
    moving: false, phase: 0, idlePhase: ts * 2.1, facing, eyes: true,
  });
  const hx = sx, hy = baseY - 12 - 45;
  ctx.fillStyle = '#3a332a';
  ctx.beginPath(); ctx.ellipse(hx, hy + 3, 5.6, 3.4, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#3f4a3a';
  ctx.beginPath(); ctx.arc(hx, hy - 8, 9.6, Math.PI, 0); ctx.fill();
}

// Miškininkas - antras NPC, duodantis medžių kirtimo užduotį. questState: 'available' | 'active' | 'ready' | 'done'.
function drawLumberjackNpc(ctx, sx, sy, ts, facing, questState) {
  const baseY = sy + 8;
  // rąstų krūva vietoje prekystalio
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(sx, baseY + 4, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = -1; i <= 1; i++) {
    const lx = sx + i * 13;
    ctx.fillStyle = '#5c4326';
    ctx.beginPath(); ctx.ellipse(lx, baseY - 1, 9, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#8a6a44';
    ctx.beginPath(); ctx.ellipse(lx, baseY - 1, 3.2, 1.9, 0, 0, Math.PI * 2); ctx.fill();
  }

  // miškininkas - žmogus prie rąstų
  drawHumanoid(ctx, sx, baseY - 12, { body: '#3f5a3a', head: '#c9a074', accent: '#6b4a2c' }, {
    moving: false, phase: 0, idlePhase: ts * 2.1, facing, eyes: true,
  });

  // kirvis, atremtas į rąstus
  ctx.save();
  ctx.translate(sx + 17, baseY - 4);
  ctx.rotate(-0.32);
  ctx.fillStyle = '#5c4326'; ctx.fillRect(-1.6, -20, 3.2, 22);
  ctx.fillStyle = '#9a9a94';
  ctx.beginPath(); ctx.moveTo(-1.6, -20); ctx.lineTo(7.5, -15.5); ctx.lineTo(-1.6, -11); ctx.closePath(); ctx.fill();
  ctx.restore();

  // kepurė
  const hx = sx, hy = baseY - 12 - 45;
  ctx.fillStyle = '#3a4a30';
  ctx.beginPath(); ctx.ellipse(hx, hy + 3, 5.6, 3.4, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#2f3d27';
  ctx.beginPath(); ctx.arc(hx, hy - 8, 9.6, Math.PI, 0); ctx.fill();

  // užduoties būsenos ženkliukas virš galvos
  if (questState === 'available' || questState === 'ready') {
    const bob = Math.sin(ts * 3) * 2;
    const by = hy - 20 + bob;
    ctx.fillStyle = questState === 'ready' ? '#8fd15c' : '#e6a13c';
    ctx.beginPath(); ctx.arc(hx, by, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#1a1712';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(questState === 'ready' ? '✓' : '!', hx, by + 1);
  }
}

function drawCampfire(ctx, sx, sy, t, lifeFrac) {
  const flick = 0.7 + Math.sin(t * 11) * 0.12 + Math.sin(t * 23 + 1) * 0.06;
  const glowR = 46 * flick;
  const grad = ctx.createRadialGradient(sx, sy - 6, 2, sx, sy - 6, glowR);
  grad.addColorStop(0, 'rgba(230,161,60,0.30)');
  grad.addColorStop(1, 'rgba(230,161,60,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(sx, sy - 6, glowR, 0, Math.PI * 2); ctx.fill();

  // apsauginis spindulys (rodo, kad zombiai negali artėti)
  ctx.beginPath();
  ctx.arc(sx, sy, 3.2 * (TILE_W / 2), 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(230,161,60,0.10)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#241a10';
  ctx.beginPath(); ctx.ellipse(sx - 7, sy, 5, 2.6, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sx + 7, sy, 5, 2.6, -0.3, 0, Math.PI * 2); ctx.fill();

  const h = 15 * flick;
  ctx.beginPath();
  ctx.moveTo(sx, sy - h - 4);
  ctx.quadraticCurveTo(sx + 6, sy - h * 0.4, sx + 3, sy - 2);
  ctx.quadraticCurveTo(sx + 8, sy - 5, sx, sy + 1);
  ctx.quadraticCurveTo(sx - 8, sy - 5, sx - 3, sy - 2);
  ctx.quadraticCurveTo(sx - 6, sy - h * 0.4, sx, sy - h - 4);
  ctx.closePath();
  ctx.fillStyle = '#e6a13c'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx, sy - h * 0.6 - 2);
  ctx.quadraticCurveTo(sx + 3, sy - h * 0.25, sx, sy - 1);
  ctx.quadraticCurveTo(sx - 3, sy - h * 0.25, sx, sy - h * 0.6 - 2);
  ctx.fillStyle = '#f6d98a'; ctx.fill();

  // degimo laiko žiedas
  ctx.beginPath();
  ctx.arc(sx, sy - 34, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lifeFrac);
  ctx.strokeStyle = lifeFrac < 0.25 ? '#c1503f' : '#e6a13c';
  ctx.lineWidth = 2.4;
  ctx.stroke();
}

function drawPickup(ctx, sx, sy, type, t) {
  const bob = Math.sin(t * 2.4 + sx * 0.05) * 3;
  const y = sy - 10 + bob;
  const sparkle = 0.5 + Math.sin(t * 5 + sx) * 0.5;
  ctx.save();
  ctx.translate(sx, y);
  ctx.beginPath(); ctx.arc(0, 8, 9, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,${0.08 + sparkle * 0.10})`; ctx.fill();

  if (type === 'matches') {
    ctx.fillStyle = '#d94f3a'; ctx.fillRect(-2, -6, 4, 10);
    ctx.beginPath(); ctx.arc(0, -7, 2.6, 0, Math.PI * 2); ctx.fillStyle = '#f2c14e'; ctx.fill();
  } else if (type === 'knife') {
    ctx.strokeStyle = '#c9cdd4'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, 6); ctx.lineTo(6, -6); ctx.stroke();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-6, 6); ctx.lineTo(-9, 9); ctx.stroke();
  } else if (type === 'axe') {
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, -8); ctx.stroke();
    ctx.fillStyle = '#c9cdd4';
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(8, -6); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawLoot(ctx, sx, sy, type, t) {
  const bob = Math.sin(t * 2.4 + sx * 0.05) * 3;
  const y = sy - 8 + bob;
  ctx.save();
  ctx.translate(sx, y);
  ctx.fillStyle = '#4a3521';
  roundRectPath(ctx, -8, 3, 16, 9, 2);
  ctx.fill();
  ctx.strokeStyle = '#2c1f12'; ctx.lineWidth = 1; ctx.stroke();

  if (type === 'coins') {
    ctx.beginPath(); ctx.arc(0, -3, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#f0c419'; ctx.fill();
    ctx.strokeStyle = '#a8830f'; ctx.lineWidth = 1.4; ctx.stroke();
  } else if (type === 'matches') {
    ctx.fillStyle = '#d94f3a'; ctx.fillRect(-2, -9, 4, 10);
    ctx.beginPath(); ctx.arc(0, -10, 2.6, 0, Math.PI * 2); ctx.fillStyle = '#f2c14e'; ctx.fill();
  } else if (type === 'knife') {
    ctx.strokeStyle = '#c9cdd4'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(6, -11); ctx.stroke();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(-9, 4); ctx.stroke();
  } else if (type === 'axe') {
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, -13); ctx.stroke();
    ctx.fillStyle = '#c9cdd4';
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(8, -11); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill();
  } else if (type === 'helmet') {
    ctx.beginPath(); ctx.arc(0, -3, 8, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = '#7d8792'; ctx.fill();
    ctx.strokeStyle = '#4a5058'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -3, 8.2, 2.1, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#5f6870'; ctx.fill();
  } else if (type === 'meat') {
    // skardinė - cilindras su etikete
    ctx.fillStyle = '#c9cdd4'; ctx.fillRect(-6, -11, 12, 10);
    ctx.strokeStyle = '#7d8792'; ctx.lineWidth = 1; ctx.strokeRect(-6, -11, 12, 10);
    ctx.beginPath(); ctx.ellipse(0, -11, 6, 1.8, 0, 0, Math.PI * 2); ctx.fillStyle = '#a8adb5'; ctx.fill();
    ctx.fillStyle = '#c1503f'; ctx.fillRect(-6, -8, 12, 4.5);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 0.8; ctx.strokeRect(-6, -8, 12, 4.5);
  } else if (type === 'chocolate') {
    // šokolado plytelė su segmentais
    ctx.fillStyle = '#5a3a24'; ctx.fillRect(-7, -9, 14, 8);
    ctx.strokeStyle = '#3a2414'; ctx.lineWidth = 1; ctx.strokeRect(-7, -9, 14, 8);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-2.3, -9); ctx.lineTo(-2.3, -1); ctx.moveTo(2.3, -9); ctx.lineTo(2.3, -1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7, -5); ctx.lineTo(7, -5); ctx.stroke();
  } else if (type === 'bandage') {
    // suvyniotas bintas su raudonu kryžiumi
    ctx.fillStyle = '#e4ddc9'; ctx.beginPath(); ctx.ellipse(0, -6, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b8ae94'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#c1503f';
    ctx.fillRect(-1.2, -9.5, 2.4, 7); ctx.fillRect(-3.5, -7.3, 7, 2.4);
  } else if (type === 'medicine') {
    // vaistų buteliukas su kryžiaus etikete
    ctx.fillStyle = '#7fa89c'; ctx.fillRect(-5, -12, 10, 11);
    ctx.strokeStyle = '#3f5750'; ctx.lineWidth = 1; ctx.strokeRect(-5, -12, 10, 11);
    ctx.fillStyle = '#4a5f58'; ctx.fillRect(-2.4, -14.5, 4.8, 3);
    ctx.fillStyle = '#ece7d6';
    ctx.fillRect(-0.8, -9.5, 1.6, 5); ctx.fillRect(-2.8, -7.5, 5.6, 1.6);
  } else if (type === 'gira') {
    // molinis ąsotis su gira - apvalus korpusas, kaklelis ir ąselė
    ctx.fillStyle = '#8a6a3f';
    ctx.beginPath(); ctx.ellipse(0, -6, 6.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5c452a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#6b4e2c'; ctx.fillRect(-2.2, -14, 4.4, 5);
    ctx.strokeStyle = '#5c452a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(4.5, -8); ctx.quadraticCurveTo(9, -8, 8.5, -3); ctx.quadraticCurveTo(8, -1, 5, -2); ctx.stroke();
    ctx.fillStyle = 'rgba(230,201,60,0.5)'; ctx.beginPath(); ctx.ellipse(-1.5, -8, 2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'bow') {
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-1, -6, 8, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke();
    ctx.strokeStyle = 'rgba(230,225,210,0.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(5.4, -12.3); ctx.lineTo(1, -6); ctx.lineTo(5.4, 0.3); ctx.stroke();
  } else if (type === 'arrows') {
    // strėlių pluoštas - kelios lygiagrečios linijos su antgaliais ir plunksnelėmis
    ctx.strokeStyle = '#8a6a3f'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (const ox of [-3, 0, 3]) {
      ctx.beginPath(); ctx.moveTo(ox, -2); ctx.lineTo(ox + 1.5, -13); ctx.stroke();
      ctx.fillStyle = '#c9cdd4';
      ctx.beginPath(); ctx.moveTo(ox + 1.5, -13); ctx.lineTo(ox + 0.2, -10.4); ctx.lineTo(ox + 2.8, -10.4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c1503f'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(ox, -2); ctx.lineTo(ox - 1.4, 0.6); ctx.stroke();
      ctx.strokeStyle = '#8a6a3f';
    }
  } else if (type === 'fishingRod') {
    // meškerė - ilgas lenktas strypas su valu, plūde ir kabliuku, gulinti ant dėžutės
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-7, 2); ctx.quadraticCurveTo(2, -14, 9, -16); ctx.stroke();
    ctx.strokeStyle = 'rgba(230,225,210,0.7)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(9, -16); ctx.lineTo(3, -1); ctx.stroke();
    ctx.fillStyle = '#e6a13c';
    ctx.beginPath(); ctx.ellipse(3, -1, 1.6, 1.2, 0, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'fish') {
    ctx.save();
    ctx.translate(0, -6);
    ctx.fillStyle = '#6fa8c9';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a7c9c';
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-11, -3); ctx.lineTo(-11, 3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a5c74'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawHeldWeapon(ctx, hx, hy, angle, type) {
  if (!type || type === 'fists') return;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(angle * 0.5);
  if (type === 'knife') {
    ctx.strokeStyle = '#c9cdd4'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, -8); ctx.stroke();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, 7); ctx.stroke();
  } else if (type === 'axe') {
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 7); ctx.lineTo(0, -9); ctx.stroke();
    ctx.fillStyle = '#c9cdd4';
    ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(8, -6); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8; ctx.stroke();
  } else if (type === 'bow') {
    // Lenktas lankas su templiu - piešiamas kaip arka su tempta stygos linija.
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-3, -1, 8, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke();
    ctx.strokeStyle = 'rgba(230,225,210,0.75)'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(2.4, -7.3); ctx.lineTo(-1, -1); ctx.lineTo(2.4, 5.3); ctx.stroke();
  } else if (type === 'fishingRod') {
    // ilgas, švelniai lenktas meškerės strypas su nukarusiu valu - laikomas beveik vertikaliai.
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.quadraticCurveTo(1, -8, 6, -14); ctx.stroke();
    ctx.strokeStyle = 'rgba(230,225,210,0.6)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(6, -14); ctx.lineTo(4, 2); ctx.stroke();
  }
  ctx.restore();
}

function drawLimb(ctx, x0, y0, angle, len, color, width) {
  const x1 = x0 + Math.sin(angle) * len * 0.55;
  const y1 = y0 + Math.cos(angle) * len;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.stroke();
}

function drawHelmet(ctx, hx, hy) {
  ctx.save();
  ctx.translate(hx, hy);
  ctx.beginPath(); ctx.arc(0, 0.5, 10.2, Math.PI, 0);
  ctx.closePath();
  ctx.fillStyle = '#7d8792'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0.5, 10.4, 2.6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#5f6870'; ctx.fill();
  ctx.beginPath(); ctx.arc(-3.4, -4, 2.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.32)'; ctx.fill();
  ctx.restore();
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function limbTip(x0, y0, angle, len) {
  return [x0 + Math.sin(angle) * len * 0.55, y0 + Math.cos(angle) * len];
}

function drawHumanoid(ctx, sx, sy, palette, anim) {
  const scale = anim.scale || 1;
  const flip = anim.facing === 'left' ? -1 : 1;
  const legSwing = anim.moving && !anim.chopping ? Math.sin(anim.phase) * 0.62 : Math.sin(anim.idlePhase * 0.6) * 0.045;
  const armSwing = anim.chopping
    ? Math.max(0, Math.sin(anim.phase)) * 1.05 - 0.2
    : anim.moving ? Math.sin(anim.phase + Math.PI) * 0.55 : -legSwing * 0.5;
  const bob = anim.moving && !anim.chopping ? Math.abs(Math.sin(anim.phase)) * 3.2 : Math.sin(anim.idlePhase) * 1.1;

  ctx.beginPath();
  ctx.ellipse(sx, sy + 3, 12 * scale, 4.5 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fill();

  ctx.save();
  ctx.translate(sx, sy - bob * scale);
  ctx.scale(flip * scale, scale);

  const hipY = -20, shoulderY = -35, legLen = 15, armLen = 13;
  drawLimb(ctx, 5, hipY, -legSwing, legLen, '#241d15', 6.5);
  if (anim.detailed) {
    const [bx, by] = limbTip(5, hipY, -legSwing, legLen);
    ctx.fillStyle = '#1a140d';
    ctx.beginPath(); ctx.ellipse(bx, by + 1.5, 4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  drawLimb(ctx, 6, shoulderY, -armSwing, armLen, palette.body, 5);

  roundRectPath(ctx, -9, shoulderY, 18, hipY - shoulderY + 5, 6);
  ctx.fillStyle = anim.hurt ? '#f2e6e6' : palette.body; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1; ctx.stroke();

  if (anim.detailed) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(-9, hipY - 2, 18, 2.6);
    ctx.strokeStyle = 'rgba(30,22,14,0.55)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-8, shoulderY - 11); ctx.lineTo(7, hipY - 1); ctx.stroke();
  }

  ctx.beginPath(); ctx.arc(0, shoulderY - 10, 9.5, 0, Math.PI * 2);
  ctx.fillStyle = anim.hurt ? '#fbe9e9' : palette.head; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();

  if (palette.accent) {
    ctx.fillStyle = palette.accent;
    roundRectPath(ctx, -9.5, shoulderY - 13.5, 19, 5, 2.5);
    ctx.fill();
  }

  if (anim.eyes !== false) {
    ctx.fillStyle = anim.eyeColor || 'rgba(20,15,10,0.75)';
    ctx.beginPath(); ctx.arc(3.5, shoulderY - 10, 1.3, 0, Math.PI * 2); ctx.fill();
    if (anim.eyeColor) { ctx.beginPath(); ctx.arc(-2, shoulderY - 11, 1, 0, Math.PI * 2); ctx.fill(); }
  }

  if (anim.detailed && !anim.helmetOn) {
    ctx.fillStyle = anim.hairColor || '#2b1f16';
    ctx.beginPath();
    ctx.arc(0, shoulderY - 13, 9.6, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fill();
  }

  if (anim.helmetOn) drawHelmet(ctx, 0, shoulderY - 10);

  drawLimb(ctx, -5, hipY, legSwing, legLen, '#2c2419', 6.5);
  if (anim.detailed) {
    const [bx2, by2] = limbTip(-5, hipY, legSwing, legLen);
    ctx.fillStyle = '#1a140d';
    ctx.beginPath(); ctx.ellipse(bx2, by2 + 1.5, 4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  drawLimb(ctx, -6, shoulderY, armSwing, armLen, palette.body, 5);
  if (anim.weapon && anim.weapon !== 'fists') {
    const hx = -6 + Math.sin(armSwing) * armLen * 0.55;
    const hy = shoulderY + Math.cos(armSwing) * armLen;
    drawHeldWeapon(ctx, hx, hy, armSwing, anim.weapon);
  }
  ctx.restore();
}

function drawHpBar(ctx, sx, sy, frac, w, fillColor) {
  const h = 4;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(sx - w / 2, sy, w, h);
  ctx.fillStyle = fillColor || (frac > 0.4 ? '#7fbf5f' : '#c1503f'); ctx.fillRect(sx - w / 2, sy, w * Math.max(0, frac), h);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(sx - w / 2 + 0.5, sy + 0.5, w - 1, h - 1);
}

const ZOMBIE_PALETTE = { body: '#465a3c', head: '#7c9068', accent: '#5c2b28' };
const ZOMBIE_DOG_PALETTE = { body: '#4a4238', fur: '#5c5246', eye: '#c1503f' };
const ZOMBIE_BOSS_PALETTE = { body: '#3d4a2e', head: '#6b7a52', accent: '#2b1f16' };
// Raudonasis zombis - gyvena tik tolimoje, tamsioje/uolėtoje zonoje už miško; ryškiai raudona
// oda iškart išskiria jį nuo įprasto (žalio) zombio, kad būtų aišku, jog jis pavojingesnis.
const ZOMBIE_RED_PALETTE = { body: '#7a2620', head: '#a4372c', accent: '#2b1310' };

// Zombis šuo - mažas, greitas, silpnas priešas keturiomis kojomis (ne humanoidas).
function drawZombieDog(ctx, sx, sy, anim) {
  const flip = anim.facing === 'left' ? -1 : 1;
  const legSwing = anim.moving ? Math.sin(anim.phase) * 0.7 : Math.sin(anim.idlePhase * 0.6) * 0.05;
  const bob = anim.moving ? Math.abs(Math.sin(anim.phase)) * 1.8 : Math.sin(anim.idlePhase) * 0.6;
  const pal = ZOMBIE_DOG_PALETTE;

  ctx.beginPath();
  ctx.ellipse(sx, sy + 2, 9, 3.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();

  ctx.save();
  ctx.translate(sx, sy - bob);
  ctx.scale(flip, 1);

  // kojos (4x, priekinės ir galinės, priešingos fazės)
  ctx.strokeStyle = '#221c15'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  for (const [lx, phase] of [[-7, 0], [-3, Math.PI], [3, Math.PI], [7, 0]]) {
    const sw = Math.sin(anim.phase + phase) * (anim.moving ? 5 : 1);
    ctx.beginPath(); ctx.moveTo(lx, -6); ctx.lineTo(lx + sw * 0.3, -1 + Math.abs(sw) * 0.15); ctx.stroke();
  }

  // kūnas - pailgas, žemas
  ctx.fillStyle = anim.hurt ? '#e8dcd4' : pal.body;
  roundRectPath(ctx, -10, -13, 20, 9, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  // dryžiai / kailio detalės
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
  for (const dx of [-5, 0, 5]) { ctx.beginPath(); ctx.moveTo(dx, -13); ctx.lineTo(dx - 2, -4); ctx.stroke(); }

  // uodega
  ctx.strokeStyle = pal.body; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-15, -13 + Math.sin(anim.idlePhase * 2) * 2); ctx.stroke();

  // galva - žemai priekyje, snukis
  ctx.fillStyle = anim.hurt ? '#f2e6e0' : pal.fur;
  ctx.beginPath(); ctx.ellipse(12, -10, 5.2, 4.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#2c2419';
  ctx.beginPath(); ctx.ellipse(16.5, -9, 2.2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  // akys - degančios raudonos
  ctx.fillStyle = pal.eye;
  ctx.beginPath(); ctx.arc(13.5, -11.5, 1.1, 0, Math.PI * 2); ctx.fill();
  // ausys
  ctx.fillStyle = pal.body;
  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(8, -18); ctx.lineTo(11.5, -14.5); ctx.closePath(); ctx.fill();

  ctx.restore();
}

// Bosas - didelis, storas, sulėtėjęs zombis su daug HP. Naudoja tą patį humanoido karkasą
// (padidintas scale), bet su papildomu "pilvo" tūriu ir visada matomu (net pilnos sveikatos) HP baru.
function drawZombieBoss(ctx, sx, sy, anim) {
  const scale = anim.scale || 1.9;
  // papildomas šešėlis po kūnu, didesnis nei įprasto zombio
  ctx.beginPath();
  ctx.ellipse(sx, sy + 5, 20 * (scale / 1.9) + 6, 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();

  drawHumanoid(ctx, sx, sy, ZOMBIE_BOSS_PALETTE, { ...anim, scale, eyes: true, eyeColor: '#f0c419' });

  // storas pilvas priekyje - papildomas apvalus tūris
  ctx.save();
  ctx.translate(sx, sy - 22 * scale);
  ctx.beginPath();
  ctx.ellipse(0, 0, 12 * scale * 0.5, 10 * scale * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(61,74,46,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}

const CHICKEN_PALETTE = { body: '#e8ded0', comb: '#c1503f', beak: '#e6a13c', leg: '#c9a94a' };
const MOOSE_PALETTE = { body: '#5c4a36', belly: '#7a6650', antler: '#3a2e20' };

// Višta - maža, taiki, sparnai plazdena vaikštant. Nepuola, tik pabaidoma.
function drawChicken(ctx, sx, sy, anim) {
  const flip = anim.facing === 'left' ? -1 : 1;
  const bob = anim.moving ? Math.abs(Math.sin(anim.phase * 1.6)) * 2.2 : Math.sin(anim.idlePhase) * 0.5;
  const pal = CHICKEN_PALETTE;

  ctx.beginPath();
  ctx.ellipse(sx, sy + 1, 6, 2.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();

  ctx.save();
  ctx.translate(sx, sy - bob);
  ctx.scale(flip, 1);

  // kojos
  ctx.strokeStyle = pal.leg; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  const legSwing = anim.moving ? Math.sin(anim.phase * 1.6) * 2.4 : 0;
  ctx.beginPath(); ctx.moveTo(-2, -5); ctx.lineTo(-2 + legSwing * 0.4, -1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, -5); ctx.lineTo(2 - legSwing * 0.4, -1); ctx.stroke();

  // kūnas - apvalus, pūkuotas
  ctx.fillStyle = anim.hurt ? '#f7e8d8' : pal.body;
  ctx.beginPath(); ctx.ellipse(0, -9, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.8; ctx.stroke();

  // sparnas - plazda einant
  const wingFlap = anim.moving ? Math.sin(anim.phase * 2) * 1.5 : 0;
  ctx.fillStyle = '#d8cbb8';
  ctx.beginPath(); ctx.ellipse(-1, -8 + wingFlap * 0.3, 3.2, 2.4, 0.3, 0, Math.PI * 2); ctx.fill();

  // galva ir snapas
  ctx.fillStyle = anim.hurt ? '#f7e8d8' : pal.body;
  ctx.beginPath(); ctx.ellipse(6, -13, 3, 2.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pal.beak;
  ctx.beginPath(); ctx.moveTo(8.5, -13); ctx.lineTo(11, -12.3); ctx.lineTo(8.5, -11.7); ctx.closePath(); ctx.fill();
  // skiauterė
  ctx.fillStyle = pal.comb;
  ctx.beginPath(); ctx.ellipse(5.5, -16, 1.6, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  // akis
  ctx.fillStyle = '#2c2419';
  ctx.beginPath(); ctx.arc(7, -13.5, 0.7, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// Briedis - didelis, taikus, su ragais. Nepuola, pabaidomas priartėjus arba gavęs smūgį.
function drawMoose(ctx, sx, sy, anim) {
  const scale = anim.scale || 1.7;
  const flip = anim.facing === 'left' ? -1 : 1;
  const legSwing = anim.moving ? Math.sin(anim.phase) * 0.6 : Math.sin(anim.idlePhase * 0.5) * 0.05;
  const bob = anim.moving ? Math.abs(Math.sin(anim.phase)) * 1.6 : Math.sin(anim.idlePhase) * 0.4;
  const pal = MOOSE_PALETTE;

  ctx.beginPath();
  ctx.ellipse(sx, sy + 4, 16 * scale * 0.6, 5.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fill();

  ctx.save();
  ctx.translate(sx, sy - bob);
  ctx.scale(flip * scale, scale);

  // kojos - ilgos
  ctx.strokeStyle = '#2e2418'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const [lx, phase] of [[-8, 0], [-4, Math.PI], [4, Math.PI], [8, 0]]) {
    const sw = Math.sin(anim.phase + phase) * (anim.moving ? 4.5 : 1);
    ctx.beginPath(); ctx.moveTo(lx, -9); ctx.lineTo(lx + sw * 0.3, 0 + Math.abs(sw) * 0.1); ctx.stroke();
  }

  // kūnas - didelis, sunkus
  ctx.fillStyle = anim.hurt ? '#8a7a68' : pal.body;
  roundRectPath(ctx, -13, -20, 26, 13, 5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  // pilvas - šviesesnis
  ctx.fillStyle = pal.belly;
  ctx.beginPath(); ctx.ellipse(0, -8, 10, 3, 0, 0, Math.PI * 2); ctx.fill();

  // kaklas ir galva
  ctx.fillStyle = anim.hurt ? '#8a7a68' : pal.body;
  ctx.beginPath(); ctx.ellipse(15, -20, 5, 6.5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  // snukis
  ctx.fillStyle = '#3a2e20';
  ctx.beginPath(); ctx.ellipse(19, -17, 3, 2.2, -0.2, 0, Math.PI * 2); ctx.fill();
  // ragai - šakoti
  ctx.strokeStyle = pal.antler; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(14, -25); ctx.lineTo(11, -33); ctx.moveTo(11, -33); ctx.lineTo(8, -35); ctx.moveTo(11, -33); ctx.lineTo(13, -36);
  ctx.moveTo(17, -25); ctx.lineTo(20, -33); ctx.moveTo(20, -33); ctx.lineTo(23, -35); ctx.moveTo(20, -33); ctx.lineTo(18, -36);
  ctx.stroke();
  // akis
  ctx.fillStyle = '#1c1610';
  ctx.beginPath(); ctx.arc(17, -21, 0.9, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

const BODY_COLORS = ['#3c6e83', '#8a4b32', '#5c7a3a', '#7a3b52', '#b0752f', '#4a5a7a', '#6b3f6b', '#6f7a3a'];
const ACCENT_COLORS = ['#e6a13c', '#c1503f', '#6fae5a', '#ece7d6', '#4a4a4a', '#3c6e83'];

/* ============================================================
   Prisijungimo / registracijos ekranas
   ============================================================ */
function AuthForge({ onEnter, onAdminEnter }) {
  const [mode, setMode] = useState('register');
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [bodyIdx, setBodyIdx] = useState(0);
  const [accentIdx, setAccentIdx] = useState(0);
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 200;
    canvas.width = size * dpr; canvas.height = size * dpr;
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let idlePhase = 0, last = performance.now(), raf = null;
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      idlePhase += dt * 1.6;
      ctx.clearRect(0, 0, size, size);
      const palette = { body: BODY_COLORS[bodyIdx], head: '#d9ad82', accent: ACCENT_COLORS[accentIdx] };
      drawHumanoid(ctx, size / 2, size / 2 + 42, palette, { moving: false, phase: 0, idlePhase, facing: 'down', detailed: true });
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [bodyIdx, accentIdx]);

  // Turi atitikti serverio USERNAME_RE (žr. src/authRoutes.js) - tikrinama IR čia, kad dažniausi
  // klaidingi įvedimai nesukeltų nereikalingo tinklo pasikeitimo, IR serveryje (autoritetingai).
  const USERNAME_RE = /^[a-zA-Z0-9_ąčęėįšųūžĄČĘĖĮŠŲŪŽ-]{3,20}$/;

  async function submit(e) {
    e.preventDefault();
    setError('');
    const uname = username.trim();
    if (!USERNAME_RE.test(uname)) { setError('Vardas turi būti 3-20 simbolių (raidės, skaičiai, _ arba -).'); return; }
    if (password.length < 6) { setError('Slaptažodis turi būti bent 6 simbolių.'); return; }

    setSubmitting(true);
    try {
      const path = mode === 'register' ? '/api/register' : '/api/login';
      const body = mode === 'register'
        ? { username: uname, password, bodyColor: BODY_COLORS[bodyIdx], accentColor: ACCENT_COLORS[accentIdx] }
        : { username: uname, password };
      const data = await apiFetch(path, { method: 'POST', body: JSON.stringify(body) });
      setToken(data.token);
      setStoredUsername(data.username);
      // Admin paskyra (isAdmin=true grąžintas serverio) veda į žemėlapio redaktorių, o ne
      // įprastą žaidėjo pasaulį - žr. onAdminEnter naudojimą App komponente.
      if (data.isAdmin) onAdminEnter(data.token);
      else onEnter(data.token, data.username, hydrateNetworkHero(data.hero));
    } catch (err) {
      if (err.status === 409) setError('Toks vardas jau užimtas. Pasirinkite kitą arba prisijunkite.');
      else if (err.status === 401) setError('Neteisingas vardas arba slaptažodis.');
      else if (err.status === 403) setError('Ši paskyra užblokuota administratoriaus.');
      else setError(err.message || 'Nepavyko prisijungti prie serverio - bandykite dar kartą.');
    } finally {
      setSubmitting(false);
    }
  }

  const isRegister = mode === 'register';

  return (
    <div className="forge">
      <div className={'forge-inner' + (isRegister ? '' : ' login-only')}>
        {isRegister && (
          <div className="forge-stage">
            <div className="forge-stage-ring"><canvas ref={canvasRef} className="forge-canvas" /></div>
            <div className="forge-name-preview">{username.trim() || 'Bevardis klajūnas'}</div>
            <div className="forge-tag">gyva peržiūra</div>
          </div>
        )}

        <form className="forge-panel" onSubmit={submit}>
          <div>
            <div className="forge-kicker">Vienkiemis · sandbox</div>
            <h1 className="forge-title">{isRegister ? <>Nukalk savo <span>herojų</span></> : <>Sveikas sugrįžęs, <span>klajūne</span></>}</h1>
            <p className="forge-sub">
              Bendras online pasaulis — paskyra saugoma serveryje, žaisti gali kartu su kitais.
              Saugokitės zombių, rinkite išteklius ir išgyvenkite.
            </p>
          </div>

          <div className="auth-tabs">
            <button type="button" className={isRegister ? 'active' : ''} onClick={() => { setMode('register'); setError(''); }}>Registruotis</button>
            <button type="button" className={!isRegister ? 'active' : ''} onClick={() => { setMode('login'); setError(''); }}>Prisijungti</button>
          </div>

          <div>
            <label className="field-label" htmlFor="auth-username">Vartotojo vardas</label>
            <input id="auth-username" className="name-input" value={username}
              onChange={(e) => setUsername(e.target.value.slice(0, 20))}
              placeholder="pvz. Vilkas" autoComplete="username" maxLength={20} />
          </div>

          <div>
            <label className="field-label" htmlFor="auth-password">Slaptažodis</label>
            <input id="auth-password" className="name-input" type="password" value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••" autoComplete={isRegister ? 'new-password' : 'current-password'} />
          </div>

          {isRegister && (
            <React.Fragment>
              <div>
                <span className="field-label">Rūbų spalva</span>
                <div className="swatch-row">
                  {BODY_COLORS.map((c, i) => (
                    <button type="button" key={c} className={'swatch' + (i === bodyIdx ? ' selected' : '')}
                      style={{ background: c }} onClick={() => setBodyIdx(i)} aria-label={'Rūbų spalva ' + (i + 1)} />
                  ))}
                </div>
              </div>
              <div>
                <span className="field-label">Skarelės spalva</span>
                <div className="swatch-row">
                  {ACCENT_COLORS.map((c, i) => (
                    <button type="button" key={c} className={'swatch' + (i === accentIdx ? ' selected' : '')}
                      style={{ background: c }} onClick={() => setAccentIdx(i)} aria-label={'Skarelės spalva ' + (i + 1)} />
                  ))}
                </div>
              </div>
            </React.Fragment>
          )}

          {error && <div className="forge-error">{error}</div>}

          <div>
            <button type="submit" className="forge-submit" disabled={submitting || username.trim().length < 3 || password.length < 6}>
              {submitting ? 'Jungiamasi...' : (isRegister ? 'Sukurti paskyrą ir pradėti' : 'Prisijungti')}
            </button>
            <p className="forge-hint">Paskyra ir progresas saugomi serveryje — gali prisijungti iš bet kurio įrenginio.</p>
          </div>

          {isRegister && (
            <div className="forge-mechanics">
              <span>🪓 rask kirvį medienai kirsti</span>
              <span>💧 gerk iš tvenkinio</span>
              <span>🔥 sujunk degtukus su mediena kuprinėje</span>
              <span>📦 nužudę zombį gaunate grobį</span>
            </div>
          )}
        </form>
      </div>
    </div>
  );
}

/* ============================================================
   Charakterio ekranas (peržiūra prieš įžengiant į pasaulį)
   ============================================================ */
function CharacterScreen({ hero, onStart, onLogout, onUpdateHero }) {
  const canvasRef = useRef(null);

  // "Kiek laiko jau esi gyvas" - nuo hero.aliveSince (nulinamas mirus, žr. Sandbox mirties bloką);
  // laikrodukas atsinaujina kas 30s, kol žaidėjas mato šį ekraną.
  const [nowTick, setNowTick] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNowTick(Date.now()), 30000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = 200;
    canvas.width = size * dpr; canvas.height = size * dpr;
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let idlePhase = 0, last = performance.now(), raf = null;
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      idlePhase += dt * 1.6;
      ctx.clearRect(0, 0, size, size);
      const palette = { body: hero.bodyColor, head: '#d9ad82', accent: hero.accentColor };
      drawHumanoid(ctx, size / 2, size / 2 + 42, palette, {
        moving: false, phase: 0, idlePhase, facing: 'down',
        weapon: hero.weapon, helmetOn: hero.helmetOn, detailed: true,
      });
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [hero.bodyColor, hero.accentColor, hero.weapon, hero.helmetOn]);

  function equipWeapon(w) {
    if (!hero.ownedWeapons.includes(w) || hero.weapon === w) return;
    onUpdateHero({ weapon: w });
  }

    if (hero.helmetOn) {
      onUpdateHero({ helmetOn: false, helmetCount: hero.helmetCount + 1 });
    } else {
      if (!hero.helmetCount) return;
      onUpdateHero({ helmetOn: true, helmetCount: hero.helmetCount - 1 });
    }
  }

  const xpNeed = xpForLevel(hero.level);

  return (

// Priešo smūgio garsas - sintetinamas per Web Audio API (jokių išorinių audio failų
// šiame artefakte krauti negalima), tad "hit" garsas sukuriamas iš trumpo tono + triukšmo pliūpsnio.
let sharedAudioCtx = null;
function getAudioCtx() {
  if (sharedAudioCtx) return sharedAudioCtx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) sharedAudioCtx = new Ctx();
  } catch (e) { sharedAudioCtx = null; }
  return sharedAudioCtx;
}
function playHitSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
  const now = ctx.currentTime;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(65, now + 0.09);
  gain.gain.setValueAtTime(0.24, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.14);

  const bufLen = Math.floor(ctx.sampleRate * 0.06);
  const noiseBuffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.2, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  noise.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(now);
}

function playChopSound() {
  // Kirvio smūgio į medį garsas - duslesnis/žemesnis tonas nei kovos smūgio (playHitSound), plius
  // filtruotas triukšmo pliūpsnis, imituojantis medžio "traškesį".
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
  const now = ctx.currentTime;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(210, now);
  osc.frequency.exponentialRampToValueAtTime(85, now + 0.08);
  gain.gain.setValueAtTime(0.22, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.12);

  const bufLen = Math.floor(ctx.sampleRate * 0.05);
  const noiseBuffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 900;
  filter.Q.value = 0.9;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(now);
}

  const lastInteractAtRef = useRef(0);
  const lastLockedNoticeRef = useRef(0);
  const lastZombieSpawnRef = useRef(performance.now());
  const lastWorldLootSpawnRef = useRef(performance.now());
  const lastCritterSpawnRef = useRef(performance.now());
  const lastBossSpawnRef = useRef(performance.now());
  const lastHitAtRef = useRef(0);
  const shakeRef = useRef(0);
  const lastSaveRef = useRef(0);
  const lastHudRef = useRef(0);
  const pausedRef = useRef(false);
  const deadRef = useRef(false);
  const sessionStartRef = useRef(Date.now());
  const shopOpenRef = useRef(false);
  const questOpenRef = useRef(false);

  // Daugiabučio scenos perjungimas ("world" <-> "building") - žr. INTERIOR_* konstantas
  // aukščiau. h.x/h.y toliau naudojami kaip "dabartinės scenos" pozicija, o zombiesRef.current
  // ir h.lootDrops tiesiog SUKEIČIAMI su vidaus sąrašais įėjus/išėjus (žr. interact bloką frame()
  // viduje) - taip visas esamas kovos/grobio kodas veikia nepakitęs abiejose scenose.
  const sceneRef = useRef('world');
  const interiorZombiesRef = useRef([]);
  const interiorLootDropsRef = useRef([]);
  const worldZombiesBackupRef = useRef([]);
  const worldLootDropsBackupRef = useRef([]);
  const outdoorPosRef = useRef({ x: HOME_POS.x, y: HOME_POS.y });

  /* ============================================================
     Socket.IO - bendras lauko pasaulis (žr. src/gameServer.js protokolo
     dokumentaciją). Prisijungiama VIENĄ kartą (mount metu) su JWT tokenu;
     otherPlayersRef/networkZombiesRef/networkLootRef/networkCampfiresRef
     tiesiog laiko PASKUTINĘ serverio siųstą būseną - render/kovos/grobio
     kodas juos skaito TIK lauko scenoje (žr. currentLootDrops/currentCampfires
     žemiau ir "scene === 'world'" šakas frame() cikle), interjerai lieka
     100% privatūs/lokalūs (žr. Scope decisions #1 užduoties apraše).
     ============================================================ */
  const socketRef = useRef(null);
  const otherPlayersRef = useRef(new Map());
  const networkZombiesRef = useRef([]);
  const networkLootRef = useRef([]);
  const networkCampfiresRef = useRef([]);
  // Tinklu ateinančių lauko zombių GLOTNINTA (interpoliuota) vaizdavimo pozicija, id -> {x,y} -
  // 'world:zombies' ateina tik kas ~180ms (žr. gameServer.js TICK_MS), o kiekvienas naujas
  // pranešimas atkeičia VISĄ networkZombiesRef.current masyvą naujais objektais (senos z.x/z.y
  // reikšmės dingsta), tad be šito Map'o piešimas "šoktų" tarp taškų kas kadrą - žr. naudojimą
  // frame() cikle (atnaujinama) ir zombių piešimo bloke (naudojama vietoj z.x/z.y). Tik lauko
  // scenai - vidaus (building) zombiai jau simuliuojami kas kadrą, jiems glotninimo nereikia.
  const zombieRenderPosRef = useRef(new Map());
  const NET_SMOOTH_RATE = 14; // kuo didesnis, tuo greičiau vaizdas "pasiveja" tikrą tinklo poziciją
  const lastMoveEmitRef = useRef(0);
  // Kurie lauko grobio id jau siunčiami serveriui (laukiama ack'o) - apsaugo nuo to paties
  // grobio "loot:collect" spam'inimo kas kadrą, kol žaidėjas stovi ant jo.
  const pendingLootCollectRef = useRef(new Set());

  useEffect(() => {
    const socket = io({ auth: { token } });
    socketRef.current = socket;
    socket.on('connect_error', (err) => { console.warn('Socket prisijungimo klaida:', err.message); });
    // Kiekvienam žaidėjui šalia serverio siunčiamų (autoritetingų) x/y saugome IR renderX/renderY -
    // glotnintą vaizdavimo poziciją, kuri kiekvieną kadrą lėtai "pasiveja" x/y (žr. frame() ciklą
    // žemiau) - be to kiti žaidėjai "šoktų" tarp taškų kas ~130ms (žr. player:move throttle
    // gameServer.js/šio failo), o ne judėtų sklandžiai. Naują reikšmę gavus, SENAS renderX/renderY
    // paliekamas (jei jau buvo) - tik x/y (tikslas) atnaujinamas; pirmą kartą pasirodžius žaidėjui,
    // renderX/renderY nustatomas iš karto lygus x/y (be jokio "atšokimo" iš (0,0)).
    function upsertOtherPlayer(p) {
      const prev = otherPlayersRef.current.get(p.id);
      otherPlayersRef.current.set(p.id, {
        ...p,
        renderX: prev ? prev.renderX : p.x,
        renderY: prev ? prev.renderY : p.y,
      });
    }
    socket.on('players:snapshot', (list) => {
      const next = new Map();
      for (const p of list) {
        if (p.username === username) continue;
        const prev = otherPlayersRef.current.get(p.id);
        next.set(p.id, { ...p, renderX: prev ? prev.renderX : p.x, renderY: prev ? prev.renderY : p.y });
      }
      otherPlayersRef.current = next;
    });
    socket.on('player:joined', ({ player }) => { if (player.username !== username) upsertOtherPlayer(player); });
    socket.on('player:moved', (player) => { upsertOtherPlayer(player); });
    socket.on('player:left', ({ id }) => { otherPlayersRef.current.delete(id); });
    socket.on('world:zombies', (list) => { networkZombiesRef.current = list; });
    socket.on('world:lootDrops', (list) => { networkLootRef.current = list; });
    socket.on('world:campfires', (list) => { networkCampfiresRef.current = list; });
    // Serveris vienintelis kelias PADIDINTI HP (bintas/vaistai/lygis) NEsiunčia šio įvykio -
    // jis skirtas TIK sumažinimui (zombio kontaktinei žalai lauko scenoje), žr. gameServer.js.
    socket.on('player:hpSync', ({ hp }) => {
      heroRef.current.hp = hp;
      lastHitAtRef.current = performance.now();
      shakeRef.current = 6;
    });
    // Admino išsaugoti žemėlapio pakeitimai (žr. AdminScreen/adminRoutes.js) - pritaikomi IŠKART
    // jau prisijungusiems žaidėjams, ne tik kitą kartą prisijungus (žr. applyServerMapOverrides
    // aukščiau ir bootstrap() failo pabaigoje, kur TAS PATS override objektas naudojamas pirmam
    // puslapio užkrovimui).
    socket.on('mapOverrides:updated', (ov) => {
      applyServerMapOverrides(ov);
      pushPopup(heroRef.current.x, heroRef.current.y, 'Žemėlapis atnaujintas', '#ece7d6');
    });
    return () => { socket.disconnect(); };
  }, []);

  // Grobio/laužų šaltinis priklauso nuo scenos - lauko scenoje viskas ateina iš tinklo
  // (networkLootRef/networkCampfiresRef), viduje - lieka h.lootDrops/h.campfires kaip anksčiau
  // (žr. Part 4 užduoties apraše). Naudojama piešimo ir artumo tikrinimo vietose, KUR operacija
  // scenai bendra (skaitymas) - vietos, kur reikia MUTUOTI sąrašą, turi savo scene branch'us.
  function currentLootDrops() { return sceneRef.current === 'world' ? networkLootRef.current : heroRef.current.lootDrops; }
  function currentCampfires() { return sceneRef.current === 'world' ? networkCampfiresRef.current : heroRef.current.campfires; }

  // Bendra grobio atlygio pritaikymo logika - naudojama TIEK automatinio pasiėmimo daugiabutyje
  // (vietinis h.lootDrops splice), TIEK serverio patvirtinto pasiėmimo lauko scenoje ('loot:collect'
  // ack), kad abi šakos elgtųsi TIKSLIAI vienodai (žr. Part 4/5 užduoties apraše).
  function applyLootReward(l) {
    const h = heroRef.current;
    if (l.type === 'coins') {
      h.coins += l.amount;
      pushPopup(h.x, h.y, '+' + l.amount + ' 🪙', '#f0c419');
    } else if (l.type === 'matches') {
      h.matches += 1;
      pushPopup(h.x, h.y, '+1 degtukai', '#e6a13c');
    } else if (l.type === 'helmet') {
      // Šalmas iš karto neužsidedamas - jis atsiranda kuprinėje (Inventorius),
      // o "užsidėti" reikia paspausti patį šalmo langelį (I arba C meniu).
      h.helmetCount += 1;
      pushPopup(h.x, h.y, 'Rasta: Šalmas (x' + h.helmetCount + ')', '#ece7d6');
    } else if (l.type === 'meat' || l.type === 'chocolate') {
      const amt = l.amount || 1;
      h[l.type] += amt;
      pushPopup(h.x, h.y, 'Rasta: ' + FOOD_ITEMS[l.type].label + (amt > 1 ? ' (x' + amt + ')' : ''), '#8fd15c');
    } else if (l.type === 'bandage' || l.type === 'medicine') {
      h[l.type] += (l.amount || 1);
      pushPopup(h.x, h.y, 'Rasta: ' + MED_ITEMS[l.type].label, '#c1503f');
    } else if (l.type === 'gira') {
      h.gira += (l.amount || 1);
      pushPopup(h.x, h.y, 'Rasta: ' + DRINK_ITEMS.gira.label, '#5ea8d1');
    } else if (l.type === 'arrows') {
      const amt = l.amount || 1;
      h.arrows += amt;
      pushPopup(h.x, h.y, 'Rasta: Strėlės (x' + amt + ')', '#ece7d6');
    } else {
      if (!h.ownedWeapons.includes(l.type)) h.ownedWeapons.push(l.type);
      h.weaponCounts[l.type] = (h.weaponCounts[l.type] || 0) + 1;
      if (WEAPON_RANK[l.type] > WEAPON_RANK[h.weapon]) h.weapon = l.type;
      pushPopup(h.x, h.y, 'Rasta: ' + WEAPONS[l.type].label + ' (x' + h.weaponCounts[l.type] + ')', '#ece7d6');
    }
  }

  function spawnInteriorZombies(ts) {
    const count = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      let ix, iy, tries = 0;
      do {
        ix = INTERIOR_ORIGIN + 1.5 + Math.random() * (INTERIOR_SIZE - 3);
        iy = INTERIOR_ORIGIN + 1.5 + Math.random() * (INTERIOR_SIZE - 3);
        tries += 1;
      } while (Math.hypot(ix - INTERIOR_DOOR.x, iy - INTERIOR_DOOR.y) < 3 && tries < 10);
      const type = Math.random() < 0.75 ? 'zombie' : 'dog';
      const base = ENEMY_TYPES[type];
      interiorZombiesRef.current.push({
        id: zombieIdSeq++, type, x: ix, y: iy, hp: base.hp, maxHp: base.hp,
        dmg: base.dmg, speed: base.speed, contactRadius: base.contactRadius,
        atkCd: base.atkCd, aggro: base.aggro, xpReward: base.xp, scale: base.scale,
        facing: 'down', phase: Math.random() * 6, idlePhase: 0,
        lastAttackAt: 0, wanderAngle: Math.random() * Math.PI * 2, wanderAt: ts, hitFlashAt: 0,
      });
    }
  }

  // Daugiabučio viduje paliktas grobis - kambaryje išbarstytos dėžės su atsitiktiniais
  // parduotuvės prekių tipais (žr. SHOP_ITEMS), kad viduje visada būtų ką parinkti, o ne tik
  // kovoti su zombiais. Sugeneruojama vieną kartą pirmą kartą įėjus (kol interiorLootDropsRef
  // tuščias) - kaip ir su interiorZombiesRef, likutis išlieka tarp įėjimų/išėjimų per tą pačią
  // sesiją, kol atsiranda naujo, jei viskas surinkta.
  function spawnInteriorLoot(ts) {
    const count = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      let ix, iy, tries = 0;
      do {
        ix = INTERIOR_ORIGIN + 1 + Math.random() * (INTERIOR_SIZE - 2);
        iy = INTERIOR_ORIGIN + 1 + Math.random() * (INTERIOR_SIZE - 2);
        tries += 1;
      } while (Math.hypot(ix - INTERIOR_DOOR.x, iy - INTERIOR_DOOR.y) < 2 && tries < 10);
      const item = SHOP_ITEMS[Math.floor(Math.random() * SHOP_ITEMS.length)];
      interiorLootDropsRef.current.push({ id: 'iloot' + (lootIdSeq++), type: item.type, amount: worldLootAmountFor(item.type), x: ix, y: iy, createdAt: ts, source: 'interior' });
    }
  }

  useEffect(() => { pausedRef.current = menuOpen || inventoryOpen || armorOpen || shopOpen || questOpen; }, [menuOpen, inventoryOpen, armorOpen, shopOpen, questOpen]);
  useEffect(() => { shopOpenRef.current = shopOpen; }, [shopOpen]);
  useEffect(() => { questOpenRef.current = questOpen; }, [questOpen]);

  function pushPopup(x, y, text, color) {
    popupsRef.current.push({ id: popupIdSeq++, x, y, text, color, born: performance.now() });
    if (popupsRef.current.length > 24) popupsRef.current.shift();
  }

  const doLogout = useCallback(() => {
    const h = heroRef.current;
    // Jei atsijungiama būnant daugiabutyje, prieš išsaugant grąžiname tikrąją lauko poziciją bei
    // grobio sąrašą - kitaip būtų išsaugotos vidaus koordinatės kaip herojaus "tikroji" vieta
    // (žr. tą patį pataisymą ties mirties ir periodinio autosave'o blokais frame() viduje).
    if (sceneRef.current === 'building') {
      h.lootDrops = worldLootDropsBackupRef.current;
      h.x = outdoorPosRef.current.x; h.y = outdoorPosRef.current.y;
      sceneRef.current = 'world';
    }
    autosaveHero(h);
    if (socketRef.current) socketRef.current.disconnect();
    onLogout();
  }, [onLogout]);

  const respawn = useCallback(() => {
    const h = heroRef.current;
    h.hp = h.maxHp;
    h.hunger = Math.max(40, h.hunger);
    h.thirst = Math.max(40, h.thirst);
    h.x = h.homeX; h.y = h.homeY;
    deadRef.current = false;
    sessionStartRef.current = Date.now();
    autosaveHero(h);
    setDeathStats(null);
  }, []);

  useEffect(() => {
    function down(e) {
      // I/C/Escape must always be able to toggle their own overlay, even while paused —
      // otherwise opening one traps the player with no keyboard way to close it again.
      if (e.key === 'i' || e.key === 'I') {
        if (deadRef.current) return;
        setInventoryOpen((v) => !v);
        return;
      }
      if (e.key === 'c' || e.key === 'C') {
        if (deadRef.current) return;
        setArmorOpen((v) => !v);
        return;
      }
      if (e.key === 'Escape') {
        if (deadRef.current) return;
        setMenuOpen((v) => !v);
        return;
      }
      if ((e.key === 'e' || e.key === 'E') && !deadRef.current) {
        if (shopOpenRef.current) { setShopOpen(false); return; }
        const hh = heroRef.current;
        const nearShop = Math.hypot(hh.x - NPC_POS.x, hh.y - NPC_POS.y) < SHOP_RANGE;
        if (nearShop && !pausedRef.current) { setShopOpen(true); return; }
      }
      if ((e.key === 'q' || e.key === 'Q') && !deadRef.current) {
        if (questOpenRef.current) { setQuestOpen(false); return; }
        const hh = heroRef.current;
        const nearQuestNpc = Math.hypot(hh.x - NPC2_POS.x, hh.y - NPC2_POS.y) < QUEST_RANGE;
        if (nearQuestNpc && !pausedRef.current) { setQuestOpen(true); return; }
      }
      if (pausedRef.current || deadRef.current) return;
      if (KEY_VECTORS[e.key]) { keysRef.current.add(e.key); e.preventDefault(); }
      if (e.key === ' ') { attackHeldRef.current = true; e.preventDefault(); }
      if (e.key === 'e' || e.key === 'E') { interactHeldRef.current = true; }
    }
    function up(e) {
      keysRef.current.delete(e.key);
      if (e.key === ' ') attackHeldRef.current = false;
      if (e.key === 'e' || e.key === 'E') interactHeldRef.current = false;
    }
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, []);

  useEffect(() => {
    const stage = stageRef.current;
    const minimap = minimapRef.current;
    const stageCtx = stage.getContext('2d');
    const miniCtx = minimap.getContext('2d');

    function resizeStage() {
      const dpr = window.devicePixelRatio || 1;
      const w = stage.parentElement.clientWidth, h = stage.parentElement.clientHeight;
      stage.width = w * dpr; stage.height = h * dpr;
      stage.style.width = w + 'px'; stage.style.height = h + 'px';
      stageCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeStage();
    const ro = new ResizeObserver(resizeStage);
    ro.observe(stage.parentElement);

    function screenToGrid(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const px = clientX - rect.left, py = clientY - rect.top;
      const w = stage.clientWidth, hh = stage.clientHeight;
      const h = heroRef.current;
      const camScreen = gridToScreen(h.x, h.y);
      const originX = w / 2 - camScreen.x;
      const originY = hh / 2 - camScreen.y + 34;
      const sx = px - originX, sy = py - originY;
      const A = 2 * sx / TILE_W, B = 2 * sy / TILE_H;
      return { gx: (A + B) / 2, gy: (B - A) / 2 };
    }

    function onStageClick(e) {
      if (pausedRef.current || deadRef.current) return;
      const { gx, gy } = screenToGrid(e.clientX, e.clientY);
      const boundLo = sceneRef.current === 'building' ? INTERIOR_ORIGIN + 0.3 : 0.3;
      const boundHi = sceneRef.current === 'building' ? INTERIOR_ORIGIN + INTERIOR_SIZE - 1.3 : WORLD_SIZE - 1.3;
      const cgx = Math.max(boundLo, Math.min(boundHi, gx));
      const cgy = Math.max(boundLo, Math.min(boundHi, gy));
      moveTargetRef.current = { x: cgx, y: cgy };
      moveTargetMarkerRef.current = { x: cgx, y: cgy, born: performance.now() };
    }
    stage.addEventListener('pointerup', onStageClick);

    const MINI = 140;
    const mdpr = window.devicePixelRatio || 1;
    minimap.width = MINI * mdpr; minimap.height = MINI * mdpr;
    minimap.style.width = MINI + 'px'; minimap.style.height = MINI + 'px';
    miniCtx.setTransform(mdpr, 0, 0, mdpr, 0, 0);

    let raf = null, last = performance.now();

    function findNearestTree(px, py) {
      let best = null, bestD = INTERACT_RANGE;
      const cx = Math.round(px), cy = Math.round(py);
      for (let gx = cx - 2; gx <= cx + 2; gx++) {
        for (let gy = cy - 2; gy <= cy + 2; gy++) {
          if (tileType(gx, gy) !== 'forest') continue;
          const key = gx + ',' + gy;
          const regrowAt = choppedRef.current.get(key);
          if (regrowAt && regrowAt > performance.now()) continue;
          const d = Math.hypot(gx - px, gy - py);
          if (d < bestD) { bestD = d; best = { gx, gy, key }; }
        }
      }
      return best;
    }

    function nearWater(px, py) {
      const cx = Math.round(px), cy = Math.round(py);
      for (let gx = cx - 2; gx <= cx + 2; gx++) {
        for (let gy = cy - 2; gy <= cy + 2; gy++) {
          if (tileType(gx, gy) === 'water' && Math.hypot(gx - px, gy - py) < INTERACT_RANGE + 0.6) return true;
        }
      }
      return false;
    }

    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      const h = heroRef.current;
      const paused = pausedRef.current || deadRef.current;
      const scene = sceneRef.current;
      const boundLo = scene === 'building' ? INTERIOR_ORIGIN : 0;
      const boundHi = scene === 'building' ? INTERIOR_ORIGIN + INTERIOR_SIZE - 1 : WORLD_SIZE - 1;
      // Nustatome, ar E buvo TIK KĄ paspausta šiame kadre (o ne tiesiog laikoma) - naudojama
      // durims (enterBuilding/exitBuilding), kad ilgas laikymas neperjunginėtų scenos pirmyn-atgal.
      const interactJustPressed = interactHeldRef.current && !wasInteractHeldRef.current;
      wasInteractHeldRef.current = interactHeldRef.current;

      // Lauko (world) scenoje zombiesRef.current kiekvieną kadrą tiesiog perrašomas naujausia
      // tinklo (serverio) būsena - lauko zombių AI/judėjimas/kontaktinė žala VISIŠKAI serverio
      // pusėje (žr. Scope decisions #1); vidaus (building) zombiai lieka nepakitę - simuliuojami
      // toliau žemiau esančiame cikle, apsaugotame scene === 'building' patikra.
      if (scene === 'world') {
        zombiesRef.current = networkZombiesRef.current;
        // Glotniname lauko zombių IR kitų žaidėjų vaizdavimo poziciją link naujausios tinklu
        // gautos (autoritetingos) x/y - žr. zombieRenderPosRef/upsertOtherPlayer komentarus
        // aukščiau. Naudojame eksponentinį "lerp" (kiek liko atstumo * dt * NET_SMOOTH_RATE),
        // tad greitis nepriklauso nuo kadrų dažnio (frame rate) - veiks vienodai sklandžiai tiek
        // 30, tiek 144 Hz ekrane.
        const seenZombieIds = new Set();
        for (const z of zombiesRef.current) {
          seenZombieIds.add(z.id);
          let rp = zombieRenderPosRef.current.get(z.id);
          if (!rp) { rp = { x: z.x, y: z.y }; zombieRenderPosRef.current.set(z.id, rp); }
          else {
            rp.x += (z.x - rp.x) * Math.min(1, dt * NET_SMOOTH_RATE);
            rp.y += (z.y - rp.y) * Math.min(1, dt * NET_SMOOTH_RATE);
          }
        }
        // pašaliname pozicijas zombių, kurių nebėra naujausiame snapshot'e (nužudyti/dingę) - kitaip
        // Map augtų be ribų per visą sesiją.
        for (const id of zombieRenderPosRef.current.keys()) {
          if (!seenZombieIds.has(id)) zombieRenderPosRef.current.delete(id);
        }
        for (const op of otherPlayersRef.current.values()) {
          op.renderX += (op.x - op.renderX) * Math.min(1, dt * NET_SMOOTH_RATE);
          op.renderY += (op.y - op.renderY) * Math.min(1, dt * NET_SMOOTH_RATE);
        }
      }

      // laužų/grobio gyvavimo laikas - pašaliname pasibaigusius; tai aktualu TIK vidaus
      // (h.campfires/h.lootDrops) sąrašams - lauko laužai/grobis nyksta serverio pusėje
      // (žr. currentCampfires()/currentLootDrops() naudojimą piešimo/artumo tikrinimo vietose).
      if (scene === 'building') {
        if (h.campfires.length) {
          h.campfires = h.campfires.filter((f) => ts - f.createdAt < FIRE_LIFETIME_MS);
        }
        if (h.lootDrops.length) {
          h.lootDrops = h.lootDrops.filter((l) => ts - l.createdAt < LOOT_LIFETIME_MS);
        }
      }

      if (!paused) {
        let vx = 0, vy = 0;
        for (const k of keysRef.current) { const v = KEY_VECTORS[k]; if (v) { vx += v[0]; vy += v[1]; } }
        for (const dir of padRef.current) {
          if (dir === 'up') vy -= 1; if (dir === 'down') vy += 1;
          if (dir === 'left') vx -= 1; if (dir === 'right') vx += 1;
        }
        let len = Math.hypot(vx, vy);
        let moving = len > 0.001;
        if (moving) {
          // Rankinis valdymas (WASD/pad) visada atšaukia paspaudimu nustatytą tikslą.
          moveTargetRef.current = null;
        } else if (moveTargetRef.current) {
          const tdx = moveTargetRef.current.x - h.x, tdy = moveTargetRef.current.y - h.y;
          const tdist = Math.hypot(tdx, tdy);
          if (tdist > 0.12) {
