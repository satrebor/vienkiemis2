            vx = tdx; vy = tdy; len = tdist; moving = true;
          } else {
            h.x = moveTargetRef.current.x; h.y = moveTargetRef.current.y;
            moveTargetRef.current = null;
          }
        }
        if (moving) {
          vx /= len; vy /= len;
          h.x = Math.max(boundLo + 0.3, Math.min(boundHi - 0.3, h.x + vx * MOVE_SPEED * dt));
          h.y = Math.max(boundLo + 0.3, Math.min(boundHi - 0.3, h.y + vy * MOVE_SPEED * dt));
          if (Math.abs(vx) > 0.15) facingRef.current = vx < 0 ? 'left' : 'right';
          else facingRef.current = vy < 0 ? 'up' : 'down';
          phaseRef.current += dt * 9;
        } else {
          idlePhaseRef.current += dt * 2.1;
        }

        h.hunger = Math.max(0, h.hunger - HUNGER_RATE * dt);
        h.thirst = Math.max(0, h.thirst - THIRST_RATE * dt);
        let dmg = 0;
        if (h.hunger <= 0) dmg += STARVE_DMG;
        if (h.thirst <= 0) dmg += STARVE_DMG;

        let nearFire = false;
        for (const f of currentCampfires()) {
          if (Math.hypot(f.x - h.x, f.y - h.y) < FIRE_HEAL_RADIUS) { nearFire = true; break; }
        }
        if (nearFire && h.hp < h.maxHp) h.hp = Math.min(h.maxHp, h.hp + FIRE_REGEN * dt);
        if (dmg > 0) h.hp -= dmg * dt;

        for (const p of PICKUPS) {
          if (h.collectedPickups.includes(p.id)) continue;
          if (Math.hypot(p.x - h.x, p.y - h.y) < 0.85) {
            h.collectedPickups.push(p.id);
            if (p.type === 'matches') {
              h.matches += 1;
              pushPopup(h.x, h.y, '+1 degtukai', '#e6a13c');
            } else {
              if (!h.ownedWeapons.includes(p.type)) h.ownedWeapons.push(p.type);
              h.weaponCounts[p.type] = (h.weaponCounts[p.type] || 0) + 1;
              if (WEAPON_RANK[p.type] > WEAPON_RANK[h.weapon]) h.weapon = p.type;
              pushPopup(h.x, h.y, 'Rasta: ' + WEAPONS[p.type].label + ' (x' + h.weaponCounts[p.type] + ')', '#ece7d6');
            }
          }
        }

        if (scene === 'building') {
          for (let li = h.lootDrops.length - 1; li >= 0; li--) {
            const l = h.lootDrops[li];
            if (Math.hypot(l.x - h.x, l.y - h.y) < LOOT_COLLECT_RADIUS) {
              h.lootDrops.splice(li, 1);
              applyLootReward(l);
            }
          }
        } else {
          // Lauko grobis - serveris autoritetingas; klientas tik PRAŠO paimti (su throttle per
          // pendingLootCollectRef, kad stovint ant grobio nebūtų spamo tuo pačiu emit'u kas kadrą).
          for (const l of networkLootRef.current) {
            if (pendingLootCollectRef.current.has(l.id)) continue;
            if (Math.hypot(l.x - h.x, l.y - h.y) < LOOT_COLLECT_RADIUS) {
              pendingLootCollectRef.current.add(l.id);
              socketRef.current && socketRef.current.emit('loot:collect', { lootId: l.id }, (loot) => {
                pendingLootCollectRef.current.delete(l.id);
                if (!loot) return; // kažkas kitas jau paėmė arba per toli
                applyLootReward(loot);
              });
            }
          }
        }

        const tree = findNearestTree(h.x, h.y);
        const water = nearWater(h.x, h.y);
        const hasAxe = h.weapon === 'axe';
        const hasRod = h.weapon === 'fishingRod';
        const nearShop = Math.hypot(h.x - NPC_POS.x, h.y - NPC_POS.y) < SHOP_RANGE;
        const nearApartmentDoor = scene === 'world' && APARTMENT_POSITIONS.some((ap) => Math.hypot(h.x - ap.x, h.y - ap.y) < APARTMENT_RANGE);
        const nearExitDoor = scene === 'building' && Math.hypot(h.x - INTERIOR_DOOR.x, h.y - INTERIOR_DOOR.y) < APARTMENT_RANGE;
        // Prieplaukos abipus ežero - žr. LAKE/BOAT_DOCK_WEST/EAST aukščiau. Netikrinama, kai
        // jau plaukiama (boatRideRef.current), kad rodyklė "Irtis valtimi" neatsirastų vidury
        // kelionės (h.x/h.y tuomet vis tiek yra toli nuo abiejų krantų, bet aiškumo dėlei).
        const nearBoatDock = scene === 'world' && !boatRideRef.current && (
          Math.hypot(h.x - BOAT_DOCK_WEST.x, h.y - BOAT_DOCK_WEST.y) < BOAT_RANGE ||
          Math.hypot(h.x - BOAT_DOCK_EAST.x, h.y - BOAT_DOCK_EAST.y) < BOAT_RANGE
        );
        let context = null;
        if (nearExitDoor) context = { type: 'exitBuilding', label: 'Išeiti (E)', icon: '🚪' };
        else if (nearShop) context = { type: 'shop', label: 'Parduotuvė (E)', icon: '🛒' };
        else if (nearApartmentDoor) context = { type: 'enterBuilding', label: 'Įeiti (E)', icon: '🚪' };
        else if (nearBoatDock) context = { type: 'boat', label: 'Irtis valtimi (E)', icon: '🚣' };
        else if (water && hasRod) context = { type: 'fish', label: 'Žvejoti (laikyk E)', icon: '🎣' };
        else if (water) context = { type: 'drink', label: 'Gerti', icon: '💧' };
        else if (tree && hasAxe) context = { type: 'chop', label: 'Kirsti (laikyk ⚔)', icon: '🪓' };
        else if (tree && !hasAxe) context = { type: 'locked', label: 'Reikia kirvio', icon: '🔒' };

        if (interactHeldRef.current && ts - lastInteractAtRef.current > 400) {
          if (context && context.type === 'drink') {
            lastInteractAtRef.current = ts;
            h.thirst = Math.min(100, h.thirst + 45);
            pushPopup(h.x, h.y, '+45 troškulys', '#5ea8d1');
          }
        }

        // Žvejyba - laikant E prie vandens su meškere, po FISH_DURATION_MS (5s) nepertraukiamo
        // laikymo pagaunama +1 žuvis; laikas skaičiuojamas nuo pirmo paspaudimo (ne kas 400ms
        // kaip gėrimas), o paleidus E arba pasitraukus nuo konteksto progresas dingsta be atlygio,
        // kaip įprasta žvejybos minigame'uose. Laikant nenutrūkstamai, ciklas kartojasi (žr.
        // startedAt=ts atstatymą po kiekvieno pagavimo) - galima žvejoti be pertraukos.
        if (context && context.type === 'fish' && interactHeldRef.current) {
          if (!fishingRef.current.active) fishingRef.current = { active: true, startedAt: ts };
          if (ts - fishingRef.current.startedAt >= FISH_DURATION_MS) {
            h.fish += 1;
            pushPopup(h.x, h.y, '+1 🐟', '#5ea8d1');
            fishingRef.current = { active: true, startedAt: ts };
          }
        } else if (fishingRef.current.active) {
          fishingRef.current = { active: false, startedAt: 0 };
        }

        // Įėjimas/išėjimas per duris ir valties įlipimas suveikia TIK vieną kartą paspaudus E
        // (edge-triggered per interactJustPressed), o ne kas 400ms kol laikoma - kitaip ilgiau
        // palaikius E stovint prie durų (senasis 'drink' tipo pakartojamas veikimas), žaidėjas
        // nepastebimai "sumirktų" pirmyn-atgal per duris (išeitų, tada iškart vėl įeitų, ir t.t.),
        // o valtimi būtų bandoma plaukti pakartotinai kelis kartus iš eilės.
        if (interactJustPressed) {
          if (context && context.type === 'enterBuilding') {
            outdoorPosRef.current = { x: h.x, y: h.y };
            worldZombiesBackupRef.current = zombiesRef.current;
            worldLootDropsBackupRef.current = h.lootDrops;
            zombiesRef.current = interiorZombiesRef.current;
            h.lootDrops = interiorLootDropsRef.current;
            if (zombiesRef.current.length === 0) spawnInteriorZombies(ts);
            if (h.lootDrops.length === 0) spawnInteriorLoot(ts);
            h.x = INTERIOR_SPAWN.x; h.y = INTERIOR_SPAWN.y;
            sceneRef.current = 'building';
            pushPopup(h.x, h.y, 'Įėjai į daugiabutį', '#ece7d6');
          } else if (context && context.type === 'exitBuilding') {
            interiorZombiesRef.current = zombiesRef.current;
            interiorLootDropsRef.current = h.lootDrops;
            zombiesRef.current = worldZombiesBackupRef.current;
            h.lootDrops = worldLootDropsBackupRef.current;
            h.x = outdoorPosRef.current.x; h.y = outdoorPosRef.current.y;
            sceneRef.current = 'world';
            pushPopup(h.x, h.y, 'Išėjai į lauką', '#ece7d6');
          } else if (context && context.type === 'boat') {
            const distWest = Math.hypot(h.x - BOAT_DOCK_WEST.x, h.y - BOAT_DOCK_WEST.y);
            const distEast = Math.hypot(h.x - BOAT_DOCK_EAST.x, h.y - BOAT_DOCK_EAST.y);
            const toDock = distWest < distEast ? BOAT_DOCK_EAST : BOAT_DOCK_WEST;
            boatRideRef.current = { fromX: h.x, fromY: h.y, toX: toDock.x, toY: toDock.y, startedAt: ts };
            pushPopup(h.x, h.y, 'Irsi per ežerą...', '#5ea8d1');
          }
        }

        // Lauko zombiai/kritteriai/bosas/grobis nebe spawn'inami klientе - viską dabar valdo
        // serveris (žr. src/worldState.js spawnZombiesAndLoot), zombiesRef.current lauko scenoje
        // tiesiog rodo naujausią 'world:zombies' broadcast'ą (žr. aukščiau šio frame() cikle).
        // Šis ciklas TOLIAU judina/atakuoja TIK vidaus (building) zombius - lauko zombių AI
        // visiškai serverio pusėje (žr. src/worldState.js tickZombies).
        if (scene === 'building') {
        for (const z of zombiesRef.current) {
          const dx = h.x - z.x, dy = h.y - z.y;
          const dist = Math.hypot(dx, dy);
          const zAggro = z.aggro || 9, zSpeed = z.speed || 2, zContact = z.contactRadius || 1.05;
          const zAtkCd = z.atkCd || 1150, zDmg = z.dmg || 6;
          let mvx = 0, mvy = 0;
          if (z.passive) {
            // Taikūs padarai (višta/briedis) niekada nepuola - briedis "pabaidomas" tiesiog
            // priartėjus (fleeRadius), višta - tik gavusi smūgį (spooked nustatoma kovos bloke
            // žemiau). Pabaidytas padaras bėga NUO žaidėjo, o kryptis periodiškai perskaičiuojama
            // (su atsitiktiniu nuokrypiu), kad bėgimas atrodytų kaip vingiuojantis, ne tiesus.
            if (!z.spooked && z.fleeRadius && dist < z.fleeRadius) z.spooked = true;
            if (z.spooked) {
              if (ts - z.wanderAt > 750) {
                const awayAngle = Math.atan2(-dy, -dx);
                z.wanderAngle = awayAngle + (Math.random() - 0.5) * Math.PI * 0.7;
                z.wanderAt = ts;
              }
              mvx = Math.cos(z.wanderAngle); mvy = Math.sin(z.wanderAngle);
            } else {
              if (ts - z.wanderAt > 2200) { z.wanderAngle = Math.random() * Math.PI * 2; z.wanderAt = ts; }
              mvx = Math.cos(z.wanderAngle) * 0.4; mvy = Math.sin(z.wanderAngle) * 0.4;
            }
          } else if (dist < zAggro) { mvx = dx / (dist || 1); mvy = dy / (dist || 1); }
          else {
            if (ts - z.wanderAt > 2200) { z.wanderAngle = Math.random() * Math.PI * 2; z.wanderAt = ts; }
            mvx = Math.cos(z.wanderAngle) * 0.4; mvy = Math.sin(z.wanderAngle) * 0.4;
          }
          const moving = Math.hypot(mvx, mvy) > 0.05;
          const effSpeed = z.passive && z.spooked ? (z.fleeSpeed || zSpeed) : zSpeed;
          if (moving && (z.passive || dist > zContact * 0.8)) {
            z.x = Math.max(boundLo, Math.min(boundHi, z.x + mvx * effSpeed * dt));
            z.y = Math.max(boundLo, Math.min(boundHi, z.y + mvy * effSpeed * dt));
            z.facing = mvx < -0.1 ? 'left' : mvx > 0.1 ? 'right' : z.facing;
            z.phase += dt * 7;
          } else {
            z.idlePhase += dt * 2;
          }

          if (z.passive) continue; // taikūs padarai nei atbaidomi laužo/saugios zonos, nei puola

          // laužai atbaido zombius - negali priartėti prie degančio laužo
          for (const f of h.campfires) {
            const fdx = z.x - f.x, fdy = z.y - f.y;
            const fdist = Math.hypot(fdx, fdy);
            if (fdist < FIRE_REPEL_RADIUS && fdist > 0.0001) {
              const push = FIRE_REPEL_RADIUS / fdist;
              z.x = f.x + fdx * push;
              z.y = f.y + fdy * push;
            }
          }

          // saugi zona (miestelis) atbaido zombius - jie negali įeiti
          {
            const zdx = z.x - SAFE_ZONE.x, zdy = z.y - SAFE_ZONE.y;
            const zdist = Math.hypot(zdx, zdy);
            if (zdist < SAFE_ZONE.radius && zdist > 0.0001) {
              const push = SAFE_ZONE.radius / zdist;
              z.x = SAFE_ZONE.x + zdx * push;
              z.y = SAFE_ZONE.y + zdy * push;
            }
          }

          if (dist < zContact && ts - z.lastAttackAt > zAtkCd) {
            z.lastAttackAt = ts;
            const dealt = h.helmetOn ? zDmg * (1 - HELMET_DMG_REDUCTION) : zDmg;
            h.hp -= dealt;
            lastHitAtRef.current = ts;
            shakeRef.current = 6;
            pushPopup(h.x, h.y, '-' + Math.round(dealt), '#c1503f');
          }
        }
        } // if (scene === 'building') - vidaus zombių AI/judėjimo/kontaktinės žalos ciklo pabaiga

        // Lankas - vienintelis tolimo nuotolio ginklas. Kol turi bent 1 strėlę, taikinys ieškomas
        // gerokai didesniu spinduliu (RANGED_ATTACK_RANGE) nei įprastas artimo nuotolio ATTACK_RANGE -
        // taip galima "nušauti" bet kokį monstrą (įskaitant vištą/briedį) iš toli, nelaukiant, kol
        // jis prieis. Be strėlių lankas tiesiog veikia kaip silpnas artimo nuotolio ginklas.
        const isBowReady = h.weapon === 'bow' && h.arrows > 0;
        let nearestZombieInRange = null, nearestZombieD = isBowReady ? RANGED_ATTACK_RANGE : ATTACK_RANGE;
        for (const z of zombiesRef.current) {
          const d = Math.hypot(z.x - h.x, z.y - h.y);
          if (d < nearestZombieD) { nearestZombieD = d; nearestZombieInRange = z; }
        }

        if (attackHeldRef.current && nearestZombieInRange) {
          // Kova su zombiu turi pirmenybę prieš medžio kirtimą.
          chopTargetRef.current = null;
          attackSwingRef.current = true;
          chopSwingPhaseRef.current += dt * CHOP_SWING_SPEED;
          const w = WEAPONS[h.weapon];
          const nearest = nearestZombieInRange;
          if (scene === 'building') {
            // Vidaus zombiai - visiškai lokali (nekontestuojama) simuliacija, lygiai kaip anksčiau.
            if (ts - lastAttackAtRef.current > w.cooldown) {
              lastAttackAtRef.current = ts;
              if (isBowReady) {
                h.arrows -= 1;
                arrowShotsRef.current.push({ x0: h.x, y0: h.y, x1: nearest.x, y1: nearest.y, born: ts });
                if (arrowShotsRef.current.length > 8) arrowShotsRef.current.shift();
              }
              nearest.hp -= w.dmg;
              nearest.hitFlashAt = ts;
              // Gavusi smūgį višta (o briedis - jau ir vien priartėjus, žr. aukščiau) ima bėgti
              // šalin nuo žaidėjo - žr. "z.passive"/"z.spooked" logiką judėjimo bloke aukščiau.
              if (nearest.passive) nearest.spooked = true;
              playHitSound();
              pushPopup(nearest.x, nearest.y, '-' + w.dmg, '#f2c14e');
              if (nearest.hp <= 0) {
                zombiesRef.current = zombiesRef.current.filter((zz) => zz !== nearest);
                h.kills += 1;
                const xpReward = nearest.xpReward || KILL_XP;
                h.xp += xpReward;
                if (nearest.type === 'boss') {
                  // Bosas numeta gerokai daugiau grobio - garantuota didelė valiutos suma
                  // plius keli papildomi atsitiktiniai daiktai iš viso grobio sąrašo.
                  const bossCoins = 30 + Math.floor(Math.random() * 31);
                  h.lootDrops.push({ id: 'loot' + (lootIdSeq++), type: 'coins', amount: bossCoins, x: nearest.x, y: nearest.y, createdAt: ts, source: 'boss' });
                  const extraDrops = 2 + Math.floor(Math.random() * 2);
                  for (let bd = 0; bd < extraDrops; bd++) {
                    const bLootType = LOOT_TYPES[Math.floor(Math.random() * LOOT_TYPES.length)];
                    const bAmount = bLootType === 'coins' ? 10 + Math.floor(Math.random() * 16) : worldLootAmountFor(bLootType);
                    h.lootDrops.push({ id: 'loot' + (lootIdSeq++), type: bLootType, amount: bAmount, x: nearest.x, y: nearest.y, createdAt: ts, source: 'boss' });
                  }
                  pushPopup(nearest.x, nearest.y, 'BOSAS NUGALĖTAS!', '#f0c419');
                } else if (nearest.type === 'chicken' || nearest.type === 'moose') {
                  // Taikūs padarai numeta tik mėsą (jokių monetų/ginklų) - žr. vartotojo prašymą:
                  // vištą užmušus gaunama mėsos; briedis, kaip didesnis žvėris, duoda daugiau.
                  const meatAmount = nearest.type === 'chicken' ? 1 : 2 + Math.floor(Math.random() * 3);
                  h.lootDrops.push({ id: 'loot' + (lootIdSeq++), type: 'meat', amount: meatAmount, x: nearest.x, y: nearest.y, createdAt: ts, source: 'critter' });
                } else {
                  const lootType = LOOT_TYPES[Math.floor(Math.random() * LOOT_TYPES.length)];
                  const lootAmount = lootType === 'coins' ? 5 + Math.floor(Math.random() * 11) : worldLootAmountFor(lootType);
                  h.lootDrops.push({ id: 'loot' + (lootIdSeq++), type: lootType, amount: lootAmount, x: nearest.x, y: nearest.y, createdAt: ts, source: 'zombie' });
                }
                pushPopup(nearest.x, nearest.y, '+' + xpReward + ' XP', '#8a6fd1');
                const need = xpForLevel(h.level);
                if (h.xp >= need) {
                  h.xp -= need; h.level += 1; h.maxHp += 10; h.hp = h.maxHp;
                  pushPopup(h.x, h.y, 'LYGIS ' + h.level + '!', '#f0b04f');
                }
              }
            }
          } else {
            // Lauko zombiai - serveris autoritetingas (HP/mirtis/grobis, žr. worldState.resolveAttack).
            // XP/lygis/nužudymų statistika VIS TIEK lieka kliento pusėje (žr. Scope decisions #3) -
            // serveris grąžina tik xpReward, o patį skaičiavimą atliekame čia, kaip ir vidaus atveju.
            if (ts - lastAttackAtRef.current > w.cooldown) {
              lastAttackAtRef.current = ts;
              const isRanged = isBowReady;
              if (isRanged) {
                h.arrows -= 1;
                arrowShotsRef.current.push({ x0: h.x, y0: h.y, x1: nearest.x, y1: nearest.y, born: ts });
                if (arrowShotsRef.current.length > 8) arrowShotsRef.current.shift();
              }
              socketRef.current && socketRef.current.emit('player:attack', { targetId: nearest.id, weapon: h.weapon, ranged: isRanged }, (result) => {
                if (!result || !result.ok) return; // atmesta serverio (per toli / cooldown) - tiesiog nieko nevyksta, kito kadro metu bandys vėl
                nearest.hitFlashAt = Date.now();
                playHitSound();
                pushPopup(nearest.x, nearest.y, '-' + result.dmg, '#f2c14e');
                if (result.died) {
                  h.kills += 1;
                  const xpReward = result.xpReward || KILL_XP;
                  h.xp += xpReward;
                  pushPopup(nearest.x, nearest.y, '+' + xpReward + ' XP', '#8a6fd1');
                  const need = xpForLevel(h.level);
                  if (h.xp >= need) {
                    h.xp -= need; h.level += 1; h.maxHp += 10; h.hp = h.maxHp;
                    pushPopup(h.x, h.y, 'LYGIS ' + h.level + '!', '#f0b04f');
                  }
                  if (nearest.type === 'boss') pushPopup(nearest.x, nearest.y, 'BOSAS NUGALĖTAS!', '#f0c419');
                }
              });
            }
          }
        } else if (attackHeldRef.current && h.weapon === 'bow' && h.arrows <= 0 &&
                   zombiesRef.current.some((z) => Math.hypot(z.x - h.x, z.y - h.y) < RANGED_ATTACK_RANGE)) {
          // Lankas rankose, bet strėlių nėra - taikinys yra netoliese (ranged spinduliu), bet per
          // toli artimam nuotoliui, tad smūgis neįvyksta. Paaiškiname, kodėl niekas nevyksta.
          attackSwingRef.current = false;
          chopTargetRef.current = null;
          if (ts - lastNoArrowsNoticeRef.current > 1500) {
            lastNoArrowsNoticeRef.current = ts;
            pushPopup(h.x, h.y, 'Reikia strėlių!', '#c1503f');
          }
        } else if (attackHeldRef.current && tree && hasAxe) {
          // Medžio kirtimas: reikia turėti kirvį ir laikyti PULTI mygtuką - medis turi savo "gyvybes"
          // (10 smūgių), kaip ir zombiai; kiekvienas smūgis atskaitomas pagal ginklo greitį (cooldown).
          attackSwingRef.current = false;
          chopTargetRef.current = tree.key;
          if (ts - lastAttackAtRef.current > WEAPONS[h.weapon].cooldown) {
            lastAttackAtRef.current = ts;
            const curHp = treeHpRef.current.has(tree.key) ? treeHpRef.current.get(tree.key) : TREE_MAX_HITS;
            const newHp = curHp - 1;
            pushPopup(tree.gx, tree.gy, '-1', '#f2c14e');
            playChopSound();
            lastChopHitAtRef.current = ts;
            lastChopHitTreeRef.current = tree.key;
            lastChopHitHpRef.current = Math.max(0, newHp);
            if (newHp <= 0) {
              h.wood += CHOP_WOOD_YIELD;
              choppedRef.current.set(tree.key, ts + TREE_REGROW_MS);
              treeHpRef.current.delete(tree.key);
              pushPopup(tree.gx, tree.gy, '+' + CHOP_WOOD_YIELD + ' mediena', '#c9903f');
              chopTargetRef.current = null;
              // Miškininko užduotis - skaičiuojame nukirstus medžius, kol užduotis priimta ir dar neužbaigta.
              if (h.questAccepted && !h.questClaimed && h.questChopped < QUEST_CHOP_TARGET) {
                h.questChopped += 1;
                if (h.questChopped >= QUEST_CHOP_TARGET) {
                  pushPopup(h.x, h.y, 'Užduotis atlikta! Grįžk pas miškininką.', '#8fd15c');
                } else {
                  pushPopup(h.x, h.y, 'Užduotis: ' + h.questChopped + '/' + QUEST_CHOP_TARGET, '#8fd15c');
                }
              }
            } else {
              treeHpRef.current.set(tree.key, newHp);
            }
          }
          chopSwingPhaseRef.current += dt * CHOP_SWING_SPEED;
        } else if (attackHeldRef.current && tree && !hasAxe) {
          attackSwingRef.current = false;
          chopTargetRef.current = null;
          if (ts - lastLockedNoticeRef.current > 1500) {
            lastLockedNoticeRef.current = ts;
            const msg = h.ownedWeapons.includes('axe') ? 'Pasiimk kirvį į rankas!' : 'Reikia rasti kirvį!';
            pushPopup(h.x, h.y, msg, '#c1503f');
          }
        } else {
          attackSwingRef.current = false;
          chopTargetRef.current = null;
        }

        if (h.hp <= 0 && !deadRef.current) {
          deadRef.current = true;
          h.hp = 0;
          // Jei mirtis ištiko viduje (daugiabutyje), grąžiname lauko zombių/grobio sąrašus prieš
          // atgimimą (žr. respawn(), kuris nukelia h.x/h.y į namus) - kitaip scena liktų "building",
          // bet pozicija jau būtų pasaulyje, ir žemėlapis piešiamas neteisingai.
          if (sceneRef.current === 'building') {
            zombiesRef.current = worldZombiesBackupRef.current;
            h.lootDrops = worldLootDropsBackupRef.current;
            sceneRef.current = 'world';
          }
          // Mirtis - prarandama visa kuprinė (ginklai, mediena, degtukai, valiuta, šalmas),
          // bet lygis, patirtis ir nužudymų skaičius (statai) išsaugomi.
          h.wood = 0;
          h.matches = 0;
          h.coins = 0;
          h.meat = 0;
          h.chocolate = 0;
          h.bandage = 0;
          h.medicine = 0;
          h.gira = 0;
          // arrows/fish - tas pats kuprinės praradimas, kaip ir kitiems resursams aukščiau (šie
          // du buvo pridėti vėliau nei pati mirties logika, tad be jų mirtis palikdavo strėles/
          // žuvį "užburtinai" išsaugotas, kas prieštarautų aukščiau aprašytam "prarandama visa
          // kuprinė" elgesiui).
          h.arrows = 0;
          h.fish = 0;
          h.aliveSince = Date.now();
          h.ownedWeapons = ['fists'];
          h.weapon = 'fists';
          h.weaponCounts = {};
          h.helmetCount = 0;
          h.helmetOn = false;
          setHud((prev) => ({
            ...prev, wood: 0, matches: 0, coins: 0, meat: 0, chocolate: 0, bandage: 0, medicine: 0, gira: 0, arrows: 0, fish: 0, weapon: 'fists',
            ownedWeapons: ['fists'], weaponCounts: {}, helmetCount: 0, helmetOn: false,
          }));
          setDeathStats({
            level: h.level, kills: h.kills, xp: h.xp,
            survived: Math.max(1, Math.round((Date.now() - sessionStartRef.current) / 1000)),
          });
        }

        // Autosave'as veikia tik lauko scenoje - kitaip būtų išsaugotos VIDAUS koordinatės
        // (INTERIOR_ORIGIN+) kaip herojaus "tikroji" pozicija, ir kitą kartą prisijungus žaidėjas
        // atsirastų su tomis pačiomis skaičių reikšmėmis, bet jau lauko žemėlapyje - klaidingoje
        // vietoje. Kitas autosave'as po išėjimo iš pastato vėl išsaugos teisingą lauko poziciją.
        if (scene === 'world' && ts - lastSaveRef.current > 900) { lastSaveRef.current = ts; autosaveHero(h); }

        // Valties kelionė per ežerą - perrašo herojaus poziciją PASKUTINĖ šiame kadre, kad
        // "laimėtų" prieš bet kokį WASD judėjimą, apskaičiuotą anksčiau šiame pačiame kadre.
        if (boatRideRef.current) {
          const ride = boatRideRef.current;
          const progress = Math.min(1, (ts - ride.startedAt) / BOAT_RIDE_MS);
          h.x = ride.fromX + (ride.toX - ride.fromX) * progress;
          h.y = ride.fromY + (ride.toY - ride.fromY) * progress;
          if (Math.abs(ride.toX - ride.fromX) > 0.15) facingRef.current = ride.toX < ride.fromX ? 'left' : 'right';
          if (progress >= 1) {
            h.x = ride.toX; h.y = ride.toY;
            boatRideRef.current = null;
            pushPopup(h.x, h.y, 'Perplaukei ežerą!', '#5ea8d1');
          }
        }
      }

      /* ================= PIEŠIMAS ================= */
      const w = stage.clientWidth, hh = stage.clientHeight;
      stageCtx.clearRect(0, 0, w, hh);
      stageCtx.fillStyle = '#0b0f08';
      stageCtx.fillRect(0, 0, w, hh);

      shakeRef.current *= 0.86;
      const shx = (Math.random() - 0.5) * shakeRef.current;
      const shy = (Math.random() - 0.5) * shakeRef.current;

      const camScreen = gridToScreen(h.x, h.y);
      const originX = w / 2 - camScreen.x + shx;
      const originY = hh / 2 - camScreen.y + 34 + shy;

      // saugios zonos (miestelio) riba - žymima punktyrine elipse po viskuo, kad būtų aišku, kur zombiai neįeina
      {
        const szScreen = gridToScreen(SAFE_ZONE.x, SAFE_ZONE.y);
        stageCtx.save();
        stageCtx.setLineDash([7, 7]);
        stageCtx.strokeStyle = 'rgba(111,174,90,0.4)';
        stageCtx.lineWidth = 2;
        stageCtx.beginPath();
        stageCtx.ellipse(originX + szScreen.x, originY + szScreen.y, SAFE_ZONE.radius * (TILE_W / 2), SAFE_ZONE.radius * (TILE_H / 2), 0, 0, Math.PI * 2);
        stageCtx.stroke();
        stageCtx.restore();
      }

      const cx = Math.round(h.x), cy = Math.round(h.y);
      const R = 12;
      const minX = Math.max(0, cx - R), maxX = Math.min(WORLD_SIZE - 1, cx + R);
      const minY = Math.max(0, cy - R), maxY = Math.min(WORLD_SIZE - 1, cy + R);

      const nowMs = ts;
      const items = [];
      if (scene === 'building') {
        // Vidaus scenoje pasaulio langelių ciklas aukščiau savaime nieko neduoda (minX/maxX
        // apskaičiuoti nuo h.x, kuris viduje yra toli už WORLD_SIZE, todėl minX>maxX) - čia
        // piešiame patį kambarį, visada tą patį INTERIOR_SIZE x INTERIOR_SIZE tinklelį.
        for (let lx = 0; lx < INTERIOR_SIZE; lx++) {
          for (let ly = 0; ly < INTERIOR_SIZE; ly++) {
            const gx = INTERIOR_ORIGIN + lx, gy = INTERIOR_ORIGIN + ly;
            const s = gridToScreen(gx, gy);
            items.push({ depth: gx + gy - 0.01, draw: () => drawInteriorTile(stageCtx, lx, ly, originX + s.x, originY + s.y) });
          }
        }
      } else {
        for (let gx = minX; gx <= maxX; gx++) {
          for (let gy = minY; gy <= maxY; gy++) {
            const s = gridToScreen(gx, gy);
            const key = gx + ',' + gy;
            const regrowAt = choppedRef.current.get(key);
            const stump = regrowAt && regrowAt > nowMs;
            items.push({ depth: gx + gy - 0.01, draw: () => drawTile(stageCtx, gx, gy, originX + s.x, originY + s.y, stump, ts / 1000) });
          }
        }
      }
      if (h.homeX >= minX - 2 && h.homeX <= maxX + 2 && h.homeY >= minY - 2 && h.homeY <= maxY + 2) {
        const s = gridToScreen(h.homeX, h.homeY);
        items.push({ depth: h.homeX + h.homeY + 0.2, draw: () => drawHomeMarker(stageCtx, originX + s.x, originY + s.y) });
      }
      for (const hut of HUT_POSITIONS) {
        if (hut.x < minX - 2 || hut.x > maxX + 2 || hut.y < minY - 2 || hut.y > maxY + 2) continue;
        const s = gridToScreen(hut.x, hut.y);
        items.push({ depth: hut.x + hut.y + 0.2, draw: () => drawHut(stageCtx, originX + s.x, originY + s.y, 0) });
      }
      for (const vh of VILLAGE_HUTS) {
        if (vh.x < minX - 2 || vh.x > maxX + 2 || vh.y < minY - 2 || vh.y > maxY + 2) continue;
        const s = gridToScreen(vh.x, vh.y);
        items.push({ depth: vh.x + vh.y + 0.2, draw: () => drawHut(stageCtx, originX + s.x, originY + s.y, vh.variant) });
      }
      if (CHURCH_POS.x >= minX - 3 && CHURCH_POS.x <= maxX + 3 && CHURCH_POS.y >= minY - 3 && CHURCH_POS.y <= maxY + 3) {
        const s = gridToScreen(CHURCH_POS.x, CHURCH_POS.y);
        items.push({ depth: CHURCH_POS.x + CHURCH_POS.y + 0.2, draw: () => drawChurch(stageCtx, originX + s.x, originY + s.y) });
      }
      for (const ap of APARTMENT_POSITIONS) {
        if (ap.x >= minX - 4 && ap.x <= maxX + 4 && ap.y >= minY - 4 && ap.y <= maxY + 4) {
          const s = gridToScreen(ap.x, ap.y);
          const doorGlow = Math.hypot(h.x - ap.x, h.y - ap.y) < APARTMENT_RANGE + 1;
          items.push({ depth: ap.x + ap.y + 0.2, draw: () => drawApartment(stageCtx, originX + s.x, originY + s.y, doorGlow) });
        }
      }
      if (NPC_POS.x >= minX - 3 && NPC_POS.x <= maxX + 3 && NPC_POS.y >= minY - 3 && NPC_POS.y <= maxY + 3) {
        const s = gridToScreen(NPC_POS.x, NPC_POS.y);
        const npcFacing = h.x < NPC_POS.x ? 'left' : 'right';
        items.push({ depth: NPC_POS.x + NPC_POS.y + 0.6, draw: () => drawShopkeeper(stageCtx, originX + s.x, originY + s.y, ts / 1000, npcFacing) });
      }
      if (NPC2_POS.x >= minX - 3 && NPC2_POS.x <= maxX + 3 && NPC2_POS.y >= minY - 3 && NPC2_POS.y <= maxY + 3) {
        const s = gridToScreen(NPC2_POS.x, NPC2_POS.y);
        const npc2Facing = h.x < NPC2_POS.x ? 'left' : 'right';
        const questState = h.questClaimed ? 'done' : (!h.questAccepted ? 'available' : (h.questChopped >= QUEST_CHOP_TARGET ? 'ready' : 'active'));
        items.push({ depth: NPC2_POS.x + NPC2_POS.y + 0.6, draw: () => drawLumberjackNpc(stageCtx, originX + s.x, originY + s.y, ts / 1000, npc2Facing, questState) });
      }
      for (const f of currentCampfires()) {
        if (f.x < minX - 2 || f.x > maxX + 2 || f.y < minY - 2 || f.y > maxY + 2) continue;
        const s = gridToScreen(f.x, f.y);
        const lifeFrac = Math.max(0, 1 - (nowMs - f.createdAt) / FIRE_LIFETIME_MS);
        items.push({ depth: f.x + f.y + 0.25, draw: () => drawCampfire(stageCtx, originX + s.x, originY + s.y, ts / 1000, lifeFrac) });
      }
      // Ežero žuvys ir valtis - piešiamos tik pasaulio scenoje (viduje h.x/h.y toli už WORLD_SIZE,
      // todėl bounds patikra žemiau jas savaime atmeta, kaip ir kitiems statiniams objektams aukščiau).
      for (const lf of LAKE_FISH) {
        if (lf.x < minX - 2 || lf.x > maxX + 2 || lf.y < minY - 2 || lf.y > maxY + 2) continue;
        const s = gridToScreen(lf.x, lf.y);
        items.push({ depth: lf.x + lf.y + 0.1, draw: () => drawSwimmingFish(stageCtx, originX + s.x, originY + s.y, ts / 1000, lf.phase) });
      }
      if (!boatRideRef.current) {
        if (BOAT_DOCK_WEST.x >= minX - 3 && BOAT_DOCK_WEST.x <= maxX + 3 && BOAT_DOCK_WEST.y >= minY - 3 && BOAT_DOCK_WEST.y <= maxY + 3) {
          const s = gridToScreen(BOAT_DOCK_WEST.x, BOAT_DOCK_WEST.y);
          items.push({ depth: BOAT_DOCK_WEST.x + BOAT_DOCK_WEST.y + 0.15, draw: () => drawBoat(stageCtx, originX + s.x, originY + s.y, ts / 1000, true) });
        }
        if (BOAT_DOCK_EAST.x >= minX - 3 && BOAT_DOCK_EAST.x <= maxX + 3 && BOAT_DOCK_EAST.y >= minY - 3 && BOAT_DOCK_EAST.y <= maxY + 3) {
          const s = gridToScreen(BOAT_DOCK_EAST.x, BOAT_DOCK_EAST.y);
          items.push({ depth: BOAT_DOCK_EAST.x + BOAT_DOCK_EAST.y + 0.15, draw: () => drawBoat(stageCtx, originX + s.x, originY + s.y, ts / 1000, false) });
        }
      } else {
        const ride = boatRideRef.current;
        const bs = gridToScreen(h.x, h.y);
        const facingRight = ride.toX >= ride.fromX;
        items.push({ depth: h.x + h.y + 0.45, draw: () => drawBoat(stageCtx, originX + bs.x, originY + bs.y, ts / 1000, facingRight) });
      }
      if (fishingRef.current.active) {
        const fs = gridToScreen(h.x, h.y);
        const fishProgress = Math.min(1, (nowMs - fishingRef.current.startedAt) / FISH_DURATION_MS);
        items.push({
          depth: h.x + h.y + 0.65,
          draw: () => {
            const bx = originX + fs.x, by = originY + fs.y - 46;
            stageCtx.fillStyle = 'rgba(0,0,0,0.45)';
            stageCtx.fillRect(bx - 16, by, 32, 5);
            stageCtx.fillStyle = '#5ea8d1';
            stageCtx.fillRect(bx - 16, by, 32 * fishProgress, 5);
            stageCtx.strokeStyle = 'rgba(255,255,255,0.5)'; stageCtx.lineWidth = 1;
            stageCtx.strokeRect(bx - 16, by, 32, 5);
          },
        });
      }
      for (const p of PICKUPS) {
        if (h.collectedPickups.includes(p.id)) continue;
        if (p.x < minX - 2 || p.x > maxX + 2 || p.y < minY - 2 || p.y > maxY + 2) continue;
        const s = gridToScreen(p.x, p.y);
        items.push({ depth: p.x + p.y + 0.35, draw: () => drawPickup(stageCtx, originX + s.x, originY + s.y, p.type, ts / 1000) });
      }
      for (const l of currentLootDrops()) {
        if (l.x < minX - 2 || l.x > maxX + 2 || l.y < minY - 2 || l.y > maxY + 2) continue;
        const s = gridToScreen(l.x, l.y);
        items.push({ depth: l.x + l.y + 0.35, draw: () => drawLoot(stageCtx, originX + s.x, originY + s.y, l.type, ts / 1000) });
      }
      for (const z of zombiesRef.current) {
        // Lauko scenoje piešiame GLOTNINTĄ (zombieRenderPosRef) poziciją, ne tiesiogiai z.x/z.y -
        // pastaroji šokinėja kas ~180ms (žr. frame() ciklo pradžią, kur šis Map'as atnaujinamas).
        // Vidaus (building) scenoje zombieRenderPosRef nepildomas, tad tiesiog naudojame z.x/z.y
        // (jau ir taip sklandu, nes simuliuojama kas kadrą).
        const dz = (scene === 'world' && zombieRenderPosRef.current.get(z.id)) || z;
        const s = gridToScreen(dz.x, dz.y);
        items.push({
          depth: dz.x + dz.y + 0.5 + (z.type === 'boss' ? 0.05 : 0),
          draw: () => {
            const anim = {
              moving: true, phase: z.phase, idlePhase: z.idlePhase, facing: z.facing,
              hurt: nowMs - z.hitFlashAt < 140, eyes: true, eyeColor: '#c1503f', scale: z.scale || 1,
            };
            if (z.type === 'dog') {
              drawZombieDog(stageCtx, originX + s.x, originY + s.y, anim);
              if (z.hp < z.maxHp) drawHpBar(stageCtx, originX + s.x, originY + s.y - 26, z.hp / z.maxHp, 20);
            } else if (z.type === 'chicken') {
              drawChicken(stageCtx, originX + s.x, originY + s.y, anim);
              if (z.hp < z.maxHp) drawHpBar(stageCtx, originX + s.x, originY + s.y - 22, z.hp / z.maxHp, 16, '#8fd15c');
            } else if (z.type === 'moose') {
              drawMoose(stageCtx, originX + s.x, originY + s.y, anim);
              if (z.hp < z.maxHp) drawHpBar(stageCtx, originX + s.x, originY + s.y - 56, z.hp / z.maxHp, 30, '#8fd15c');
            } else if (z.type === 'boss') {
              drawZombieBoss(stageCtx, originX + s.x, originY + s.y, anim);
              // bosui HP baras rodomas visada (net pilnos sveikatos), kad iškart matytųsi, jog tai bosas
              drawHpBar(stageCtx, originX + s.x, originY + s.y - 92, z.hp / z.maxHp, 46, z.hp / z.maxHp > 0.4 ? '#e6a13c' : '#c1503f');
            } else if (z.type === 'zombieRed') {
              drawHumanoid(stageCtx, originX + s.x, originY + s.y, ZOMBIE_RED_PALETTE, { ...anim, eyeColor: '#ffcf3c' });
              if (z.hp < z.maxHp) drawHpBar(stageCtx, originX + s.x, originY + s.y - 54, z.hp / z.maxHp, 28, '#ff6a4a');
            } else {
              drawHumanoid(stageCtx, originX + s.x, originY + s.y, ZOMBIE_PALETTE, anim);
              if (z.hp < z.maxHp) drawHpBar(stageCtx, originX + s.x, originY + s.y - 52, z.hp / z.maxHp, 26);
            }
          },
        });
      }
      {
        const s = gridToScreen(h.x, h.y);
        const moving = Math.hypot(
          [...keysRef.current].reduce((a, k) => a + ((KEY_VECTORS[k] || [0, 0])[0]), 0),
          [...keysRef.current].reduce((a, k) => a + ((KEY_VECTORS[k] || [0, 0])[1]), 0)
        ) > 0 || padRef.current.size > 0 || !!moveTargetRef.current;
        const chopping = !!chopTargetRef.current;
        const attacking = attackSwingRef.current;

        // Periodiškas pozicijos/būsenos siuntimas serveriui - TIK lauko scenoje (interjerai lieka
        // privatūs, žr. Scope decisions #1); throttlinama ~130ms, kad netriaukštume tinklo (žr.
        // gameServer.js protokolo komentarą - 'player:move' apibrėžtas kaip periodinis, ne edge-triggered).
        if (scene === 'world' && ts - lastMoveEmitRef.current > 130 && socketRef.current) {
          lastMoveEmitRef.current = ts;
          socketRef.current.emit('player:move', {
            x: h.x, y: h.y, facing: facingRef.current, moving, chopping: chopping || attacking, attacking,
            weapon: h.weapon, helmetOn: h.helmetOn, hpDisplay: Math.max(0, h.hp), maxHpDisplay: h.maxHp,
            level: h.level, name: h.name, bodyColor: h.bodyColor, accentColor: h.accentColor,
          });
        }

        items.push({
          depth: h.x + h.y + 0.6,
          draw: () => drawHumanoid(stageCtx, originX + s.x, originY + s.y, { body: h.bodyColor, head: '#d9ad82', accent: h.accentColor }, {
            moving: (chopping || attacking) ? true : moving, phase: (chopping || attacking) ? chopSwingPhaseRef.current : phaseRef.current,
            idlePhase: idlePhaseRef.current, facing: facingRef.current,
            hurt: nowMs - lastHitAtRef.current < 160, weapon: h.weapon, helmetOn: h.helmetOn, chopping: chopping || attacking, detailed: true,
          }),
        });

        // Kiti žaidėjai - piešiami TIK lauko scenoje (privačiuose interjeruose kitų nematyti, žr.
        // Scope decisions #1); kiekvienam naudojama bendra, laiku pagrįsta animacijos fazė
        // (performance.now()) vietoj individualaus stebėjimo kiekvienam - paprasčiausias sprendimas,
        // kuris vis tiek atrodo gyvai mažame multiplayer žaidime (žr. Part 5 užduoties apraše).
        if (scene === 'world') {
          const animT = performance.now() / 1000;
          for (const op of otherPlayersRef.current.values()) {
            // renderX/renderY - glotninta pozicija (žr. frame() ciklo pradžią), NE op.x/op.y
            // tiesiogiai - pastaroji atnaujinama tik kas ~130ms (žr. player:moved).
            const os = gridToScreen(op.renderX, op.renderY);
            items.push({
              depth: op.renderX + op.renderY + 0.55,
              draw: () => {
                drawHumanoid(stageCtx, originX + os.x, originY + os.y, { body: op.bodyColor || '#4a6fa5', head: '#d9ad82', accent: op.accentColor || '#e6a13c' }, {
                  moving: !!op.moving, phase: animT * 9, idlePhase: animT * 2.1,
                  facing: op.facing || 'down', weapon: op.weapon, helmetOn: !!op.helmetOn, chopping: !!(op.chopping || op.attacking), detailed: true,
                });
                if (typeof op.hpDisplay === 'number' && typeof op.maxHpDisplay === 'number' && op.hpDisplay < op.maxHpDisplay) {
                  drawHpBar(stageCtx, originX + os.x, originY + os.y - 52, Math.max(0, op.hpDisplay) / op.maxHpDisplay, 26);
                }
                stageCtx.save();
                stageCtx.font = '600 11px "Work Sans", sans-serif';
                stageCtx.fillStyle = 'rgba(236,231,214,0.85)';
                stageCtx.textAlign = 'center';
                stageCtx.fillText(op.name || op.username || '', originX + os.x, originY + os.y - 62);
                stageCtx.restore();
              },
            });
          }
        }

        if (moveTargetMarkerRef.current && nowMs - moveTargetMarkerRef.current.born < 650) {
          const mk = moveTargetMarkerRef.current;
          const ms = gridToScreen(mk.x, mk.y);
          const mAge = (nowMs - mk.born) / 650;
          items.push({
            depth: mk.x + mk.y - 0.05,
            draw: () => {
              stageCtx.save();
              stageCtx.globalAlpha = Math.max(0, 1 - mAge);
              stageCtx.strokeStyle = '#e6a13c';
              stageCtx.lineWidth = 2;
              stageCtx.beginPath();
              stageCtx.ellipse(originX + ms.x, originY + ms.y + 4, 10 - mAge * 4, 4.5 - mAge * 2, 0, 0, Math.PI * 2);
              stageCtx.stroke();
              stageCtx.restore();
            },
          });
        }
        for (let ai = arrowShotsRef.current.length - 1; ai >= 0; ai--) {
          const shot = arrowShotsRef.current[ai];
          const shotAge = nowMs - shot.born;
          if (shotAge > 220) { arrowShotsRef.current.splice(ai, 1); continue; }
          const s0 = gridToScreen(shot.x0, shot.y0);
          const s1 = gridToScreen(shot.x1, shot.y1);
          const frac = Math.min(1, shotAge / 130); // strėlė "atskrenda" per ~130ms, tada trumpai lieka matoma
          const curX = s0.x + (s1.x - s0.x) * frac;
          const curY = (s0.y - 14) + ((s1.y - 14) - (s0.y - 14)) * frac;
          items.push({
            depth: shot.x1 + shot.y1 + 0.58,
            draw: () => {
              stageCtx.save();
              stageCtx.globalAlpha = Math.max(0, 1 - shotAge / 220);
              stageCtx.strokeStyle = '#e6dcc4';
              stageCtx.lineWidth = 2;
              stageCtx.lineCap = 'round';
              const ang = Math.atan2(curY - (originY + s0.y - 14), curX - (originX + s0.x));
              const tailX = curX - Math.cos(ang) * 9, tailY = curY - Math.sin(ang) * 9;
              stageCtx.beginPath();
              stageCtx.moveTo(originX + tailX, originY + tailY);
              stageCtx.lineTo(originX + curX, originY + curY);
              stageCtx.stroke();
              stageCtx.fillStyle = '#c9cdd4';
              stageCtx.beginPath();
              stageCtx.moveTo(originX + curX + Math.cos(ang) * 3, originY + curY + Math.sin(ang) * 3);
              stageCtx.lineTo(originX + curX - Math.sin(ang) * 2, originY + curY + Math.cos(ang) * 2);
              stageCtx.lineTo(originX + curX + Math.sin(ang) * 2, originY + curY - Math.cos(ang) * 2);
              stageCtx.closePath();
              stageCtx.fill();
              stageCtx.restore();
            },
          });
        }
        if (lastChopHitTreeRef.current && nowMs - lastChopHitAtRef.current < TREE_HP_BAR_LINGER_MS) {
          const [tgx, tgy] = lastChopHitTreeRef.current.split(',').map(Number);
          const ts2 = gridToScreen(tgx, tgy);
          const barHp = lastChopHitHpRef.current;
          items.push({
            depth: tgx + tgy + 0.55,
            draw: () => drawHpBar(stageCtx, originX + ts2.x, originY + ts2.y - 30, barHp / TREE_MAX_HITS, 24),
          });
        }
      }
      items.sort((a, b) => a.depth - b.depth);
      for (const it of items) it.draw();

      for (let i = popupsRef.current.length - 1; i >= 0; i--) {
        const p = popupsRef.current[i];
        const age = nowMs - p.born;
        if (age > 900) { popupsRef.current.splice(i, 1); continue; }
        const s = gridToScreen(p.x, p.y);
        const alpha = 1 - age / 900;
        stageCtx.save();
        stageCtx.globalAlpha = Math.max(0, alpha);
        stageCtx.font = '700 12px "Work Sans", sans-serif';
        stageCtx.textAlign = 'center';
        stageCtx.fillStyle = p.color;
        stageCtx.fillText(p.text, originX + s.x, originY + s.y - 46 - age / 22);
        stageCtx.restore();
      }

      if (nowMs - lastHitAtRef.current < 220) {
        const a = 1 - (nowMs - lastHitAtRef.current) / 220;
        const grad = stageCtx.createRadialGradient(w / 2, hh / 2, hh / 3, w / 2, hh / 2, hh * 0.75);
        grad.addColorStop(0, 'rgba(193,80,63,0)');
        grad.addColorStop(1, `rgba(193,80,63,${0.35 * a})`);
        stageCtx.fillStyle = grad;
        stageCtx.fillRect(0, 0, w, hh);
      }

      miniCtx.clearRect(0, 0, MINI, MINI);
      if (scene === 'building') {
        // Viduje pasaulio minimap neturi prasmės (koordinatės toli už WORLD_SIZE) - rodome
        // paprastą vidaus indikatorių vietoje jo.
        miniCtx.fillStyle = '#1a1a1c';
        miniCtx.fillRect(0, 0, MINI, MINI);
        miniCtx.fillStyle = 'rgba(230,196,60,0.7)';
        miniCtx.font = '700 28px "Work Sans", sans-serif';
        miniCtx.textAlign = 'center';
        miniCtx.textBaseline = 'middle';
        miniCtx.fillText('🏢', MINI / 2, MINI / 2 - 6);
        miniCtx.fillStyle = 'rgba(230,225,214,0.7)';
        miniCtx.font = '600 11px "Work Sans", sans-serif';
        miniCtx.fillText('viduje', MINI / 2, MINI / 2 + 24);
        miniCtx.strokeStyle = 'rgba(255,255,255,0.12)';
        miniCtx.strokeRect(0.5, 0.5, MINI - 1, MINI - 1);
      } else {
      miniCtx.fillStyle = '#101a0c';
      miniCtx.fillRect(0, 0, MINI, MINI);
      const scale = MINI / WORLD_SIZE;
      // Koncentrinės zonos nuo namų/saugios zonos centro: tamsi uolėta pavojaus zona (bazė per
      // visą žemėlapį) -> tankaus miško diskas -> šviesesnis pramiškis arčiau namų.
      miniCtx.fillStyle = '#241c1a';
      miniCtx.fillRect(0, 0, MINI, MINI);
      miniCtx.fillStyle = '#16240f';
      miniCtx.beginPath(); miniCtx.arc(SAFE_ZONE.x * scale, SAFE_ZONE.y * scale, DANGER_START * scale, 0, Math.PI * 2); miniCtx.fill();
      miniCtx.fillStyle = '#1c2c14';
      miniCtx.beginPath(); miniCtx.arc(SAFE_ZONE.x * scale, SAFE_ZONE.y * scale, FOREST_FULL_AT * scale, 0, Math.PI * 2); miniCtx.fill();
      miniCtx.fillStyle = 'rgba(94,168,209,0.5)';
      miniCtx.fillRect(POND.x0 * scale, POND.y0 * scale, (POND.x1 - POND.x0 + 1) * scale, (POND.y1 - POND.y0 + 1) * scale);
      miniCtx.fillRect(LAKE.x0 * scale, LAKE.y0 * scale, (LAKE.x1 - LAKE.x0 + 1) * scale, (LAKE.y1 - LAKE.y0 + 1) * scale);
      miniCtx.fillStyle = 'rgba(111,174,90,0.28)';
      miniCtx.beginPath(); miniCtx.arc(SAFE_ZONE.x * scale, SAFE_ZONE.y * scale, SAFE_ZONE.radius * scale, 0, Math.PI * 2); miniCtx.fill();
      for (const f of currentCampfires()) {
        miniCtx.fillStyle = '#e6a13c';
        miniCtx.beginPath(); miniCtx.arc(f.x * scale, f.y * scale, 2.4, 0, Math.PI * 2); miniCtx.fill();
      }
      for (const z of zombiesRef.current) {
        if (z.type === 'boss') {
          miniCtx.fillStyle = '#f0c419';
          miniCtx.beginPath(); miniCtx.arc(z.x * scale, z.y * scale, 3.4, 0, Math.PI * 2); miniCtx.fill();
          miniCtx.strokeStyle = 'rgba(0,0,0,0.4)'; miniCtx.lineWidth = 1; miniCtx.stroke();
        } else if (z.type === 'zombieRed') {
          miniCtx.fillStyle = '#ff6a4a';
          miniCtx.beginPath(); miniCtx.arc(z.x * scale, z.y * scale, 2.2, 0, Math.PI * 2); miniCtx.fill();
        } else if (z.type === 'chicken' || z.type === 'moose') {
          miniCtx.fillStyle = '#8fd15c';
          miniCtx.beginPath(); miniCtx.arc(z.x * scale, z.y * scale, z.type === 'moose' ? 2.2 : 1.2, 0, Math.PI * 2); miniCtx.fill();
        } else {
          miniCtx.fillStyle = z.type === 'dog' ? 'rgba(193,80,63,0.65)' : '#c1503f';
          miniCtx.beginPath(); miniCtx.arc(z.x * scale, z.y * scale, z.type === 'dog' ? 1.4 : 2, 0, Math.PI * 2); miniCtx.fill();
        }
      }
      miniCtx.fillStyle = '#e6a13c';
      miniCtx.beginPath(); miniCtx.arc(h.homeX * scale, h.homeY * scale, 3, 0, Math.PI * 2); miniCtx.fill();
      miniCtx.fillStyle = '#8fd15c';
      miniCtx.beginPath(); miniCtx.arc(NPC_POS.x * scale, NPC_POS.y * scale, 3, 0, Math.PI * 2); miniCtx.fill();
      miniCtx.fillStyle = '#e6c93c';
      miniCtx.beginPath(); miniCtx.arc(NPC2_POS.x * scale, NPC2_POS.y * scale, 3, 0, Math.PI * 2); miniCtx.fill();
      miniCtx.fillStyle = '#ece7d6';
      miniCtx.beginPath(); miniCtx.arc(h.x * scale, h.y * scale, 3.2, 0, Math.PI * 2); miniCtx.fill();
      miniCtx.strokeStyle = 'rgba(255,255,255,0.12)';
      miniCtx.strokeRect(0.5, 0.5, MINI - 1, MINI - 1);
      }

      if (ts - lastHudRef.current > 130) {
        lastHudRef.current = ts;
        const tree2 = findNearestTree(h.x, h.y);
        const water2 = nearWater(h.x, h.y);
        const hasAxe2 = h.weapon === 'axe';
        const hasRod2 = h.weapon === 'fishingRod';
        const nearShop2 = Math.hypot(h.x - NPC_POS.x, h.y - NPC_POS.y) < SHOP_RANGE;
        const nearQuestNpc2 = Math.hypot(h.x - NPC2_POS.x, h.y - NPC2_POS.y) < QUEST_RANGE;
        const nearApartmentDoor2 = sceneRef.current === 'world' && APARTMENT_POSITIONS.some((ap) => Math.hypot(h.x - ap.x, h.y - ap.y) < APARTMENT_RANGE);
        const nearExitDoor2 = sceneRef.current === 'building' && Math.hypot(h.x - INTERIOR_DOOR.x, h.y - INTERIOR_DOOR.y) < APARTMENT_RANGE;
        const nearBoatDock2 = sceneRef.current === 'world' && !boatRideRef.current && (
          Math.hypot(h.x - BOAT_DOCK_WEST.x, h.y - BOAT_DOCK_WEST.y) < BOAT_RANGE ||
          Math.hypot(h.x - BOAT_DOCK_EAST.x, h.y - BOAT_DOCK_EAST.y) < BOAT_RANGE
        );
        let ctxAction = null;
        if (nearExitDoor2) ctxAction = { type: 'exitBuilding', label: 'Išeiti (E)', icon: '🚪' };
        else if (nearShop2) ctxAction = { type: 'shop', label: 'Parduotuvė (E)', icon: '🛒' };
        else if (nearQuestNpc2) ctxAction = { type: 'quest', label: 'Užduotis (Q)', icon: '📜' };
        else if (nearApartmentDoor2) ctxAction = { type: 'enterBuilding', label: 'Įeiti (E)', icon: '🚪' };
        else if (nearBoatDock2) ctxAction = { type: 'boat', label: 'Irtis valtimi (E)', icon: '🚣' };
        else if (water2 && hasRod2) ctxAction = { type: 'fish', label: 'Žvejoti (laikyk E)', icon: '🎣' };
        else if (water2) ctxAction = { type: 'drink', label: 'Gerti', icon: '💧' };
        else if (tree2 && hasAxe2) ctxAction = { type: 'chop', label: 'Kirsti (laikyk ⚔)', icon: '🪓' };
        else if (tree2 && !hasAxe2) ctxAction = { type: 'locked', label: 'Reikia kirvio', icon: '🔒' };
        setHud({
          x: h.x, y: h.y, hp: Math.max(0, h.hp), maxHp: h.maxHp, hunger: h.hunger, thirst: h.thirst,
          xp: h.xp, level: h.level, wood: h.wood, matches: h.matches, coins: h.coins,
          meat: h.meat, chocolate: h.chocolate, bandage: h.bandage, medicine: h.medicine, gira: h.gira, arrows: h.arrows, fish: h.fish, weapon: h.weapon,
          ownedWeapons: h.ownedWeapons, weaponCounts: h.weaponCounts, kills: h.kills,
          helmetCount: h.helmetCount, helmetOn: h.helmetOn,
          questAccepted: h.questAccepted, questChopped: h.questChopped, questClaimed: h.questClaimed,
          contextAction: ctxAction, attackReady: zombiesRef.current.some((z) => Math.hypot(z.x - h.x, z.y - h.y) < (h.weapon === 'bow' && h.arrows > 0 ? RANGED_ATTACK_RANGE : ATTACK_RANGE)) || (tree2 && hasAxe2),
        });
      }

      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);

    return () => { cancelAnimationFrame(raf); ro.disconnect(); stage.removeEventListener('pointerup', onStageClick); };
  }, []);

  const padDown = useCallback((dir) => { padRef.current.add(dir); }, []);
  const padUp = useCallback((dir) => { padRef.current.delete(dir); }, []);
  const attackDown = useCallback(() => { attackHeldRef.current = true; }, []);
  const attackUp = useCallback(() => { attackHeldRef.current = false; }, []);
  const interactDown = useCallback(() => { interactHeldRef.current = true; }, []);
  const interactUp = useCallback(() => { interactHeldRef.current = false; }, []);

  const equipWeapon = useCallback((w) => {
    const h = heroRef.current;
    if (!h.ownedWeapons.includes(w) || h.weapon === w) return;
    h.weapon = w;
    setHud((prev) => ({ ...prev, weapon: w }));
  }, []);

  const toggleHelmet = useCallback(() => {
    // helmetCount saugo tik kuprinėje (nedėvimą) kiekį - užsidedant 1 iškeliauja iš kuprinės ant
    // galvos, nusiimant grįžta atgal, todėl likę (jei jų buvo daugiau nei 1) toliau matomi Inventoriuje.
    const h = heroRef.current;
    if (h.helmetOn) {
      h.helmetOn = false;
      h.helmetCount += 1;
    } else {
      if (!h.helmetCount) return;
      h.helmetOn = true;
      h.helmetCount -= 1;
    }
    setHud((prev) => ({ ...prev, helmetOn: h.helmetOn, helmetCount: h.helmetCount }));
  }, []);

  const buyItem = useCallback((item) => {
    const h = heroRef.current;
    if (h.coins < item.price) {
      setShopMsg('Neužtenka valiutos - reikia ' + item.price + ' 🪙.');
      return;
    }
    h.coins -= item.price;
    if (item.type === 'matches') {
      h.matches += 1;
    } else if (item.type === 'arrows') {
      // Strėlės - paprastas kraunamasis resursas kaip degtukai, bet perkamos ryšuliu (žr. bulk ant
      // SHOP_ITEMS įrašo), kad nereikėtų spausti pirkti po vieną kaskart norint papildyti kolčaną.
      h.arrows += (item.bulk || 1);
    } else if (item.type === 'helmet') {
      // Nusipirktas šalmas taip pat pirmiausia patenka į kuprinę, kaip ir rastas.
      h.helmetCount += 1;
    } else if (item.type === 'meat' || item.type === 'chocolate' || item.type === 'bandage' || item.type === 'medicine' || item.type === 'gira') {
      h[item.type] += 1;
    } else {
      if (!h.ownedWeapons.includes(item.type)) h.ownedWeapons.push(item.type);
      h.weaponCounts[item.type] = (h.weaponCounts[item.type] || 0) + 1;
      if (WEAPON_RANK[item.type] > WEAPON_RANK[h.weapon]) h.weapon = item.type;
    }
    pushPopup(h.x, h.y, 'Nupirkta: ' + item.label, '#e6a13c');
    setHud((prev) => ({
      ...prev, coins: h.coins, matches: h.matches, arrows: h.arrows, weapon: h.weapon,
      ownedWeapons: h.ownedWeapons, weaponCounts: h.weaponCounts,
      helmetCount: h.helmetCount, helmetOn: h.helmetOn,
      meat: h.meat, chocolate: h.chocolate, bandage: h.bandage, medicine: h.medicine, gira: h.gira,
    }));
  }, []);

  const sellItem = useCallback((type) => {
    const h = heroRef.current;
    const price = SELL_PRICES[type];
    if (!price) return;
    let label = type;
    if (type === 'wood') {
      if (h.wood < 1) return;
      h.wood -= 1; label = 'Mediena';
    } else if (type === 'matches') {
      if (h.matches < 1) return;
      h.matches -= 1; label = 'Degtukai';
    } else if (type === 'helmet') {
      // helmetCount dabar reiškia tik kuprinėje esantį kiekį (be dėvimo) - žr. toggleHelmet;
      // parduoti galima tik iš kuprinės, dėvimas šalmas lieka ant galvos.
      if (h.helmetCount < 1) return;
      h.helmetCount -= 1;
      label = 'Šalmas';
    } else if (type === 'meat' || type === 'chocolate' || type === 'fish') {
      if (h[type] < 1) return;
      h[type] -= 1; label = FOOD_ITEMS[type].label;
    } else if (type === 'bandage' || type === 'medicine') {
      if (h[type] < 1) return;
      h[type] -= 1; label = MED_ITEMS[type].label;
    } else if (type === 'gira') {
      if (h.gira < 1) return;
      h.gira -= 1; label = DRINK_ITEMS.gira.label;
    } else if (type === 'arrows') {
      if (h.arrows < 1) return;
      h.arrows -= 1; label = 'Strėlės';
    } else {
      if (!h.ownedWeapons.includes(type) || (h.weaponCounts[type] || 0) < 1) return;
      h.weaponCounts[type] -= 1;
      if (h.weaponCounts[type] <= 0) {
        delete h.weaponCounts[type];
        h.ownedWeapons = h.ownedWeapons.filter((w) => w !== type);
        if (h.weapon === type) h.weapon = 'fists';
      }
      label = WEAPONS[type].label;
    }
    h.coins += price;
    pushPopup(h.x, h.y, 'Parduota: ' + label + ' (+' + price + ' 🪙)', '#e6a13c');
    setHud((prev) => ({
      ...prev, coins: h.coins, wood: h.wood, matches: h.matches, arrows: h.arrows, weapon: h.weapon,
      ownedWeapons: h.ownedWeapons, weaponCounts: h.weaponCounts,
      helmetCount: h.helmetCount, helmetOn: h.helmetOn,
      meat: h.meat, chocolate: h.chocolate, bandage: h.bandage, medicine: h.medicine, gira: h.gira, fish: h.fish,
    }));
  }, []);

  const eatFood = useCallback((type) => {
    const h = heroRef.current;
    const food = FOOD_ITEMS[type];
    if (!food || h[type] < 1) return;
    h[type] -= 1;
    h.hunger = Math.min(100, h.hunger + food.hunger);
    pushPopup(h.x, h.y, '+' + food.hunger + ' 🍖', '#c9903f');
    setHud((prev) => ({ ...prev, [type]: h[type], hunger: h.hunger }));
  }, []);

  const useMedItem = useCallback((type) => {
    const h = heroRef.current;
    const med = MED_ITEMS[type];
    if (!med || h[type] < 1) return;
    h[type] -= 1;
    const healed = Math.min(med.heal, h.maxHp - h.hp);
    h.hp = Math.min(h.maxHp, h.hp + med.heal);
    pushPopup(h.x, h.y, '+' + Math.round(healed) + ' ❤', '#c1503f');
    setHud((prev) => ({ ...prev, [type]: h[type], hp: h.hp }));
  }, []);

  // Gira - atstato troškulį, naudojama TIK iš kuprinės (Inventorius langas), lygiai kaip
  // bintas/vaistai atstato gyvybę - žr. DRINK_ITEMS aukščiau.
  const useDrinkItem = useCallback((type) => {
    const h = heroRef.current;
    const drink = DRINK_ITEMS[type];
    if (!drink || h[type] < 1) return;
    h[type] -= 1;
    const restored = Math.min(drink.thirst, 100 - h.thirst);
    h.thirst = Math.min(100, h.thirst + drink.thirst);
    pushPopup(h.x, h.y, '+' + Math.round(restored) + ' 💧', '#5ea8d1');
    setHud((prev) => ({ ...prev, [type]: h[type], thirst: h.thirst }));
  }, []);

  const acceptQuest = useCallback(() => {
    const h = heroRef.current;
    if (h.questAccepted || h.questClaimed) return;
    // Užduotį priimti (ir vėliau atsiimti apdovanojimą) galima tik stovint prie miškininko -
    // "Užduotys" mygtukas HUD'e atidaro langą iš bet kur, todėl tikrinama čia, o ne tik ties Q raide.
    if (Math.hypot(h.x - NPC2_POS.x, h.y - NPC2_POS.y) >= QUEST_RANGE) {
      pushPopup(h.x, h.y, 'Eik pas miškininką!', '#c1503f');
      return;
    }
    h.questAccepted = true;
    pushPopup(h.x, h.y, 'Užduotis priimta: nukirsk ' + QUEST_CHOP_TARGET + ' medžių!', '#e6c93c');
    setHud((prev) => ({ ...prev, questAccepted: true }));
  }, []);

  const claimQuest = useCallback(() => {
    const h = heroRef.current;
    if (!h.questAccepted || h.questClaimed || h.questChopped < QUEST_CHOP_TARGET) return;
    // Apdovanojimą galima atsiimti tik pas tą patį NPC, iš kurio užduotis buvo gauta - žr. pastabą aukščiau.
    if (Math.hypot(h.x - NPC2_POS.x, h.y - NPC2_POS.y) >= QUEST_RANGE) {
      pushPopup(h.x, h.y, 'Eik pas miškininką, kad atsiimtum apdovanojimą!', '#c1503f');
      return;
    }
    h.questClaimed = true;
    h.coins += QUEST_REWARD_COINS;
    pushPopup(h.x, h.y, '+' + QUEST_REWARD_COINS + ' 🪙 (užduotis baigta)', '#8fd15c');
    setHud((prev) => ({ ...prev, questClaimed: true, coins: h.coins }));
  }, []);

  const [dragging, setDragging] = useState(false);
  const [dragType, setDragType] = useState(null); // 'wood' | 'matches'
  const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
  const [overDropSlot, setOverDropSlot] = useState(false);
  const [craftMsg, setCraftMsg] = useState('');

  const startCraftDrag = useCallback((type) => (e) => {
    const h = heroRef.current;
    if (type === 'wood' && h.wood < 1) return;
    if (type === 'matches' && h.matches < 1) return;
    e.preventDefault();
    setDragType(type);
    setDragPos({ x: e.clientX, y: e.clientY });
    setDragging(true);
  }, []);

  useEffect(() => {
    if (!dragging) return;
    const targetSlot = dragType === 'wood' ? 'matches' : 'wood';
    function move(e) {
      setDragPos({ x: e.clientX, y: e.clientY });
      const el = document.elementFromPoint(e.clientX, e.clientY);
      setOverDropSlot(!!(el && el.closest('[data-slot="' + targetSlot + '"]')));
    }
    function finish(e) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const overTarget = !!(el && el.closest('[data-slot="' + targetSlot + '"]'));
      setDragging(false);
      setOverDropSlot(false);
      setDragType(null);
      if (overTarget) {
        const h = heroRef.current;
        if (h.wood >= FIRE_WOOD_COST && h.matches >= FIRE_MATCH_COST) {
          h.wood -= FIRE_WOOD_COST;
          h.matches -= FIRE_MATCH_COST;
          if (sceneRef.current === 'building') {
            h.campfires.push({ x: Math.round(h.x), y: Math.round(h.y), createdAt: performance.now() });
          } else {
            // Lauko laužas - siunčiamas serveriui, pasirodys visiems žaidėjams per kitą
            // 'world:campfires' broadcast'ą (~180ms vėlavimas, žr. Scope decisions #6); lokaliai
            // NIEKO nededame į sąrašą, kad neatsirastų "vaiduoklio" kopijos vien šiam žaidėjui.
            socketRef.current && socketRef.current.emit('campfire:place', { x: Math.round(h.x), y: Math.round(h.y) });
          }
          pushPopup(h.x, h.y, 'Laužas įkurtas!', '#e6a13c');
          setHud((prev) => ({ ...prev, wood: h.wood, matches: h.matches }));
          setInventoryOpen(false);
        } else {
          setCraftMsg('Reikia bent ' + FIRE_WOOD_COST + ' medienos ir ' + FIRE_MATCH_COST + ' degtuko.');
        }
      }
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', finish);
    window.addEventListener('pointercancel', finish);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', finish);
      window.removeEventListener('pointercancel', finish);
    };
  }, [dragging, dragType]);

  useEffect(() => {
    if (!craftMsg) return;
    const t = setTimeout(() => setCraftMsg(''), 2400);
    return () => clearTimeout(t);
  }, [craftMsg]);

  useEffect(() => {
    if (!shopMsg) return;
    const t = setTimeout(() => setShopMsg(''), 2400);
    return () => clearTimeout(t);
  }, [shopMsg]);

  const weaponInfo = WEAPONS[hud.weapon];
  const xpNeed = xpForLevel(hud.level);

  // Kiekvienas "Parduoti" langelis rodo turimą kiekį (qty) šalia kainos, kad matytum, kiek
  // dar liko parduoti - šis sąrašas perskaičiuojamas kiekvieną kartą iš hud, tad kiekis visada
  // atsinaujina iš karto po pirkimo/pardavimo (be papildomo veiksmo ar meniu perkrovimo).
  const sellables = [];
  if (hud.wood > 0) sellables.push({ type: 'wood', icon: '🪵', label: 'Mediena', price: SELL_PRICES.wood, qty: hud.wood });
  if (hud.matches > 0) sellables.push({ type: 'matches', icon: '🔥', label: 'Degtukai', price: SELL_PRICES.matches, qty: hud.matches });
  if (hud.meat > 0) sellables.push({ type: 'meat', icon: '🥫', label: FOOD_ITEMS.meat.label, price: SELL_PRICES.meat, qty: hud.meat });
  if (hud.chocolate > 0) sellables.push({ type: 'chocolate', icon: '🍫', label: FOOD_ITEMS.chocolate.label, price: SELL_PRICES.chocolate, qty: hud.chocolate });
  if (hud.bandage > 0) sellables.push({ type: 'bandage', icon: '🩹', label: MED_ITEMS.bandage.label, price: SELL_PRICES.bandage, qty: hud.bandage });
  if (hud.medicine > 0) sellables.push({ type: 'medicine', icon: '💊', label: MED_ITEMS.medicine.label, price: SELL_PRICES.medicine, qty: hud.medicine });
  if (hud.gira > 0) sellables.push({ type: 'gira', icon: '🍯', label: DRINK_ITEMS.gira.label, price: SELL_PRICES.gira, qty: hud.gira });
  if (hud.arrows > 0) sellables.push({ type: 'arrows', icon: '➶', label: 'Strėlės', price: SELL_PRICES.arrows, qty: hud.arrows });
  if (hud.fish > 0) sellables.push({ type: 'fish', icon: '🐟', label: FOOD_ITEMS.fish.label, price: SELL_PRICES.fish, qty: hud.fish });
  for (const w of hud.ownedWeapons) {
    if (w === 'fists') continue;
    sellables.push({ type: w, icon: WEAPONS[w].icon, label: WEAPONS[w].label, price: SELL_PRICES[w], qty: hud.weaponCounts[w] || 1 });
  }
  if (hud.helmetCount > 0) sellables.push({ type: 'helmet', icon: '🪖', label: 'Šalmas', price: SELL_PRICES.helmet, qty: hud.helmetCount });

  const questState = hud.questClaimed ? 'done' : (!hud.questAccepted ? 'available' : (hud.questChopped >= QUEST_CHOP_TARGET ? 'ready' : 'active'));

  return (
    <div className="sandbox">
      <div className="stage-canvas-wrap"><canvas ref={stageRef} className="stage-canvas" /></div>

      <div className="hud-top">
        <div className="hud-identity-block">
          <div className="hud-identity">
            <span className="hud-swatch" style={{ background: initialHero.bodyColor }} />
            <span className="hud-name">{initialHero.name}</span>
            <span className="hud-level">LVL {hud.level}</span>
          </div>
          <div className="stat-bars">
            <div className="stat-row"><span className="stat-icon">❤</span>
              <div className="stat-track"><div className="stat-fill" style={{ width: (100 * hud.hp / hud.maxHp) + '%', background: 'var(--rust)' }} /></div>
            </div>
            <div className="stat-row"><span className="stat-icon">🍖</span>
              <div className="stat-track"><div className="stat-fill" style={{ width: hud.hunger + '%', background: 'var(--hunger)' }} /></div>
            </div>
            <div className="stat-row"><span className="stat-icon">💧</span>
              <div className="stat-track"><div className="stat-fill" style={{ width: hud.thirst + '%', background: 'var(--thirst)' }} /></div>
            </div>
            <div className="stat-row"><span className="stat-icon">✦</span>
              <div className="stat-track xp-track"><div className="stat-fill" style={{ width: (100 * hud.xp / xpNeed) + '%', background: 'var(--xp-color)' }} /></div>
            </div>
          </div>
        </div>
        <div className="hud-right">
          <span className="hud-coords">X {hud.x.toFixed(1)} · Y {hud.y.toFixed(1)}</span>
          <button className="hud-icon-btn" onClick={() => setInventoryOpen(true)} aria-label="Inventorius">🎒</button>
          <button className="hud-icon-btn" onClick={() => setArmorOpen(true)} aria-label="Šarvai">🛡</button>
          <button className="hud-icon-btn" onClick={() => setQuestOpen(true)} aria-label="Užduotys">📜</button>
          <button className="hud-icon-btn" onClick={() => setMenuOpen(true)} aria-label="Meniu">☰</button>
        </div>
      </div>

      <div className="inventory-strip">
        <span className="inv-chip">🪵 <span className="n">{hud.wood}</span></span>
        <span className="inv-chip">🔥 <span className="n">{hud.matches}</span></span>
        <span className="inv-chip">🪙 <span className="n">{hud.coins}</span></span>
        {hud.arrows > 0 && <span className="inv-chip">➶ <span className="n">{hud.arrows}</span></span>}
        {hud.fish > 0 && <span className="inv-chip">🐟 <span className="n">{hud.fish}</span></span>}
        <span className="inv-chip">{weaponInfo.icon} {weaponInfo.label}</span>
        {hud.helmetOn && <span className="inv-chip">🪖 apsauga</span>}
        <span className="inv-chip">💀 <span className="n">{hud.kills}</span></span>
      </div>

      <div className="hud-note">
        Bendras pasaulis — <b>kiti žaidėjai matomi lauke</b>. Butų vidus lieka privatus, tik tau.
      </div>

      <div className="minimap-dock">
        <canvas ref={minimapRef} />
        <div className="minimap-legend">
          <span><i className="dot" style={{ background: '#e6a13c' }} /> namai</span>
          <span><i className="dot" style={{ background: '#8fd15c' }} /> parduotuvė</span>
          <span><i className="dot" style={{ background: '#e6c93c' }} /> miškininkas</span>
          <span><i className="dot" style={{ background: '#c1503f' }} /> zombis</span>
          <span><i className="dot" style={{ background: '#ff6a4a' }} /> raudonasis zombis</span>
          <span><i className="dot" style={{ background: '#f0c419' }} /> bosas</span>
        </div>
      </div>

      <div className="controls-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> judėti · <kbd>E</kbd> gerti / žvejoti / valtis / parduotuvė · <kbd>SPACE</kbd> pulti / kirsti · <kbd>I</kbd> kuprinė · <kbd>C</kbd> šarvai · <kbd>Q</kbd> užduotys · <kbd>ESC</kbd> meniu
      </div>

      <div className="movepad">
        <button className="movepad-btn movepad-up" onPointerDown={() => padDown('up')} onPointerUp={() => padUp('up')} onPointerLeave={() => padUp('up')}>▲</button>
        <button className="movepad-btn movepad-left" onPointerDown={() => padDown('left')} onPointerUp={() => padUp('left')} onPointerLeave={() => padUp('left')}>◀</button>
        <button className="movepad-btn movepad-down" onPointerDown={() => padDown('down')} onPointerUp={() => padUp('down')} onPointerLeave={() => padUp('down')}>▼</button>
        <button className="movepad-btn movepad-right" onPointerDown={() => padDown('right')} onPointerUp={() => padUp('right')} onPointerLeave={() => padUp('right')}>▶</button>
      </div>

      <div className="action-cluster">
        {hud.contextAction && hud.contextAction.type === 'drink' && (
          <button className="context-btn visible"
            onPointerDown={interactDown} onPointerUp={interactUp} onPointerLeave={interactUp}>
            <span className="icon">{hud.contextAction.icon}</span>
            <span>{hud.contextAction.label}</span>
          </button>
        )}
        {hud.contextAction && hud.contextAction.type === 'shop' && (
          <button className="context-btn visible" onClick={() => setShopOpen(true)}>
            <span className="icon">{hud.contextAction.icon}</span>
            <span>{hud.contextAction.label}</span>
          </button>
        )}
        {hud.contextAction && hud.contextAction.type === 'quest' && (
          <button className="context-btn visible" onClick={() => setQuestOpen(true)}>
            <span className="icon">{hud.contextAction.icon}</span>
            <span>{hud.contextAction.label}</span>
          </button>
        )}
        {hud.contextAction && (hud.contextAction.type === 'enterBuilding' || hud.contextAction.type === 'exitBuilding') && (
          <button className="context-btn visible"
            onPointerDown={interactDown} onPointerUp={interactUp} onPointerLeave={interactUp}>
            <span className="icon">{hud.contextAction.icon}</span>
            <span>{hud.contextAction.label}</span>
          </button>
        )}
        {hud.contextAction && hud.contextAction.type === 'boat' && (
          <button className="context-btn visible"
            onPointerDown={interactDown} onPointerUp={interactUp} onPointerLeave={interactUp}>
            <span className="icon">{hud.contextAction.icon}</span>
            <span>{hud.contextAction.label}</span>
          </button>
        )}
        {hud.contextAction && hud.contextAction.type === 'fish' && (
          <button className="context-btn visible"
            onPointerDown={interactDown} onPointerUp={interactUp} onPointerLeave={interactUp}>
            <span className="icon">{hud.contextAction.icon}</span>
            <span>{hud.contextAction.label}</span>
          </button>
        )}
        <button className={'attack-btn' + (hud.attackReady ? ' ready' : '')}
          onPointerDown={attackDown} onPointerUp={attackUp} onPointerLeave={attackUp}
          aria-label="Pulti">⚔</button>
      </div>

      {menuOpen && (
        <div className="overlay-veil" onClick={(e) => { if (e.target === e.currentTarget) setMenuOpen(false); }}>
          <div className="overlay-card">
            <div className="overlay-kicker">Pauzė</div>
            <h2 className="overlay-title">{initialHero.name}</h2>
            <div className="overlay-stats">
              <div><div className="overlay-stat-label">Lygis</div><div className="overlay-stat-value">{hud.level}</div></div>
              <div><div className="overlay-stat-label">Nužudyta zombių</div><div className="overlay-stat-value">{hud.kills}</div></div>
              <div><div className="overlay-stat-label">Mediena</div><div className="overlay-stat-value">{hud.wood}</div></div>
              <div><div className="overlay-stat-label">Valiuta</div><div className="overlay-stat-value">🪙 {hud.coins}</div></div>
              <div><div className="overlay-stat-label">Ginklas</div><div className="overlay-stat-value">{weaponInfo.icon} {weaponInfo.label}</div></div>
            </div>
            <div className="overlay-actions">
              <button className="overlay-btn primary" onClick={() => setMenuOpen(false)}>Tęsti žaidimą</button>
              <button className="overlay-btn ghost" onClick={doLogout}>Atsijungti</button>
            </div>
            <div className="overlay-controls-list">
              <div><b>WASD</b> / mygtukai — judėjimas</div>
              <div><b>E</b> / kontekstinis mygtukas — gerti, arba atidaryti parduotuvę prie benamio</div>
              <div><b>SPACE</b> / ⚔ — pulti zombius, arba kirsti medį (su kirviu) — 10 smūgių, kol nukris</div>
              <div>Mirus prarandama visa kuprinė (ginklai, mediena, degtukai, šalmas, valiuta) - lygis ir patirtis išlieka</div>
              <div><b>I</b> / 🎒 — kuprinė (ginklai, laužo gamyba)</div>
              <div><b>C</b> / 🛡 — šarvų meniu (šalmas)</div>
            </div>
          </div>
        </div>
      )}

      {inventoryOpen && (
        <div className="overlay-veil" onClick={(e) => { if (e.target === e.currentTarget) setInventoryOpen(false); }}>
          <div className="overlay-card">
            <div className="overlay-kicker">Kuprinė</div>
            <h2 className="overlay-title">Inventorius</h2>
            <p className="craft-hint">Paspausk ginklą, kad jį imtum į rankas. Paspausk maistą (🥫/🍫), kad jį suvalgytum ir atstatytum alkį, bintą/vaistus (🩹/💊), kad pasigydytum, arba girą (🍯), kad atstatytum troškulį. Vilk 🔥 degtukus ant 🪵 medienos (arba atvirkščiai), kad įkurtum laužą ({FIRE_WOOD_COST} mediena + {FIRE_MATCH_COST} degtukas). Šarvus tvarkyk 🛡 arba <b>C</b> mygtuku.</p>
            {craftMsg && <div className="forge-error" style={{ marginBottom: 14 }}>{craftMsg}</div>}
            {(hud.wood > 0 || hud.matches > 0 || hud.coins > 0 || hud.meat > 0 || hud.chocolate > 0 || hud.bandage > 0 || hud.medicine > 0 || hud.gira > 0 || hud.arrows > 0 || hud.fish > 0 || hud.ownedWeapons.some((w) => w !== 'fists') || hud.helmetCount > 0) ? (
              <div className="inv-grid">
                {hud.wood > 0 && (
                  <div className={'inv-slot draggable' + (overDropSlot && dragType === 'matches' ? ' drop-target' : '')} data-slot="wood" onPointerDown={startCraftDrag('wood')}>
                    <span className="inv-slot-icon">🪵</span>
                    <span className="inv-slot-label">Mediena</span>
                    <span className="inv-slot-count">{hud.wood}</span>
                  </div>
                )}
                {hud.matches > 0 && (
                  <div className={'inv-slot draggable' + (overDropSlot && dragType === 'wood' ? ' drop-target' : '')} data-slot="matches" onPointerDown={startCraftDrag('matches')}>
                    <span className="inv-slot-icon">🔥</span>
                    <span className="inv-slot-label">Degtukai</span>
                    <span className="inv-slot-count">{hud.matches}</span>
                  </div>
                )}
                {hud.coins > 0 && (
                  <div className="inv-slot">
                    <span className="inv-slot-icon">🪙</span>
                    <span className="inv-slot-label">Valiuta</span>
                    <span className="inv-slot-count">{hud.coins}</span>
                  </div>
                )}
                {hud.meat > 0 && (
                  <div className="inv-slot weapon-slot" data-slot="meat" onClick={() => eatFood('meat')}>
                    <span className="inv-slot-icon">🥫</span>
                    <span className="inv-slot-label">{FOOD_ITEMS.meat.label}</span>
                    <span className="inv-slot-count">{hud.meat}</span>
                  </div>
                )}
                {hud.chocolate > 0 && (
                  <div className="inv-slot weapon-slot" data-slot="chocolate" onClick={() => eatFood('chocolate')}>
                    <span className="inv-slot-icon">🍫</span>
                    <span className="inv-slot-label">{FOOD_ITEMS.chocolate.label}</span>
                    <span className="inv-slot-count">{hud.chocolate}</span>
                  </div>
                )}
                {hud.bandage > 0 && (
                  <div className="inv-slot weapon-slot" data-slot="bandage" onClick={() => useMedItem('bandage')}>
                    <span className="inv-slot-icon">🩹</span>
                    <span className="inv-slot-label">{MED_ITEMS.bandage.label}</span>
                    <span className="inv-slot-count">{hud.bandage}</span>
                  </div>
                )}
                {hud.medicine > 0 && (
                  <div className="inv-slot weapon-slot" data-slot="medicine" onClick={() => useMedItem('medicine')}>
                    <span className="inv-slot-icon">💊</span>
                    <span className="inv-slot-label">{MED_ITEMS.medicine.label}</span>
                    <span className="inv-slot-count">{hud.medicine}</span>
                  </div>
                )}
                {hud.gira > 0 && (
                  <div className="inv-slot weapon-slot" data-slot="gira" onClick={() => useDrinkItem('gira')}>
                    <span className="inv-slot-icon">🍯</span>
                    <span className="inv-slot-label">{DRINK_ITEMS.gira.label}</span>
                    <span className="inv-slot-count">{hud.gira}</span>
                  </div>
                )}
                {hud.arrows > 0 && (
                  <div className="inv-slot">
                    <span className="inv-slot-icon">➶</span>
                    <span className="inv-slot-label">Strėlės</span>
                    <span className="inv-slot-count">{hud.arrows}</span>
                  </div>
                )}
                {hud.fish > 0 && (
                  <div className="inv-slot weapon-slot" data-slot="fish" onClick={() => eatFood('fish')}>
                    <span className="inv-slot-icon">🐟</span>
                    <span className="inv-slot-label">{FOOD_ITEMS.fish.label}</span>
                    <span className="inv-slot-count">{hud.fish}</span>
                  </div>
                )}
                {hud.ownedWeapons.filter((w) => w !== 'fists').map((w) => (
                  <div className={'inv-slot weapon-slot' + (w === hud.weapon ? ' equipped' : '')} key={w} onClick={() => equipWeapon(w)}>
                    {w === hud.weapon && <span className="inv-slot-tag">Naudojama</span>}
                    <span className="inv-slot-icon">{WEAPONS[w].icon}</span>
                    <span className="inv-slot-label">{WEAPONS[w].label}</span>
                    <span className="inv-slot-count">{hud.weaponCounts[w] || 1}</span>
                  </div>
                ))}
                {hud.helmetCount > 0 && (
                  <div className="inv-slot weapon-slot" onClick={toggleHelmet}>
                    <span className="inv-slot-icon">🪖</span>
                    <span className="inv-slot-label">Šalmas</span>
                    <span className="inv-slot-count">{hud.helmetCount}</span>
                  </div>
                )}
              </div>
            ) : (
              <p className="inv-empty-note">Kuprinė tuščia. Surink medienos ir degtukų, nukirsk medžių, nugalėk zombių arba nusipirk ką nors pas benamį - tada daiktai atsiras čia.</p>
            )}
            <button className="overlay-btn primary" onClick={() => setInventoryOpen(false)}>Uždaryti</button>
          </div>
