<title>Vienkiemis Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">

<style>
  :root {
    --ink: #0b0f08;
    --moss: #141b0e;
    --moss-2: #1f2a15;
    --moss-3: #283518;
    --bark: #38471f;
    --parchment: #ece7d6;
    --sage: #93a17a;
    --ember: #e6a13c;
    --ember-dim: #a8742a;
    --forest-glow: #6fae5a;
    --rust: #c1503f;
    --thirst: #5ea8d1;
    --hunger: #c9903f;
    --xp-color: #8a6fd1;
    --font-display: 'Bitter', Georgia, 'Times New Roman', serif;
    --font-body: 'Work Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--parchment);
    font-family: var(--font-body);
    overflow: hidden;
    overscroll-behavior: none;
  }

  #root { height: 100vh; height: 100dvh; width: 100vw; position: relative; }

  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .pulse, .ember-flicker, .attack-btn { animation: none !important; }
  }

  /* ---------------- Auth / Hero Forge ---------------- */

  .forge {
    height: 100%; width: 100%;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow-y: auto;
    background:
      radial-gradient(ellipse 900px 600px at 50% 38%, #24301a 0%, transparent 65%),
      linear-gradient(180deg, #0d130a 0%, #0b0f08 55%, #070a05 100%);
  }

  .forge-inner {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: minmax(240px, 380px) minmax(280px, 420px);
    gap: 56px; align-items: center;
    max-width: 920px; width: min(92vw, 920px);
    padding: 32px 24px;
  }
  .forge-inner.login-only {
    grid-template-columns: minmax(280px, 400px);
    justify-content: center;
    max-width: 460px;
  }

  .forge-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .forge-stage-ring {
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(230,161,60,0.18), transparent 68%);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .forge-stage-ring::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--bark);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), inset 0 0 40px rgba(230,161,60,0.06);
  }
  .forge-canvas { display: block; }
  .forge-name-preview { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--parchment); min-height: 26px; text-wrap: balance; text-align: center; }
  .forge-tag { font-family: var(--font-mono); font-size: 11px; color: var(--sage); letter-spacing: 0.08em; text-transform: uppercase; }

  .forge-panel { display: flex; flex-direction: column; gap: 20px; }
  .forge-kicker { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ember); }
  .forge-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1.05; margin: 6px 0 4px; text-wrap: balance; }
  .forge-title span { color: var(--ember); }
  .forge-sub { font-size: 13.5px; color: var(--sage); line-height: 1.55; max-width: 46ch; }

  .auth-tabs { display: flex; gap: 6px; background: #0e120a; border-radius: 8px; padding: 4px; }
  .auth-tabs button {
    flex: 1; padding: 9px 0; background: transparent; border: none;
    color: var(--sage); border-radius: 6px; font-size: 13px; font-weight: 600; font-family: var(--font-body);
  }
  .auth-tabs button.active { background: var(--moss-3); color: var(--ember); }

  .field-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); display: block; margin-bottom: 8px; }
  .name-input {
    width: 100%; background: var(--moss-2); border: 1px solid var(--bark); border-radius: 4px;
    padding: 12px 14px; color: var(--parchment); font-family: var(--font-display); font-size: 17px; font-weight: 600;
  }
  .name-input::placeholder { color: #5b6448; font-weight: 400; }

  .swatch-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 6px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35); position: relative; }
  .swatch.selected { border-color: var(--parchment); transform: translateY(-2px); }
  .swatch.selected::after { content: ''; position: absolute; inset: -6px; border: 1px solid var(--ember-dim); border-radius: 9px; }

  .forge-submit {
    background: linear-gradient(180deg, #f0b04f, var(--ember)); color: #241804; border: none; border-radius: 5px;
    padding: 14px 20px; font-family: var(--font-display); font-weight: 700; font-size: 15.5px;
    box-shadow: 0 6px 18px rgba(230,161,60,0.22); transition: transform 0.12s ease, box-shadow 0.12s ease; width: 100%;
  }
  .forge-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(230,161,60,0.3); }
  .forge-submit:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .forge-hint { font-size: 12px; color: #6c7658; line-height: 1.5; }
  .forge-error {
    background: rgba(193,80,63,0.14); border: 1px solid rgba(193,80,63,0.5); color: #ff9b8f;
    padding: 8px 11px; border-radius: 6px; font-size: 12.5px;
  }

  .forge-mechanics { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--sage); }
  .forge-mechanics span { white-space: nowrap; }

  @media (max-width: 720px) {
    .forge-inner { grid-template-columns: 1fr; text-align: center; padding: 20px 18px; }
    .forge-sub { max-width: none; margin: 0 auto; }
    .field-label { text-align: left; }
    .forge-mechanics { justify-content: center; }
  }

  /* ---------------- Sandbox ---------------- */

  .sandbox { height: 100%; width: 100%; position: relative; background: var(--ink); }
  .stage-canvas-wrap { position: absolute; inset: 0; touch-action: none; }
  .stage-canvas { display: block; width: 100%; height: 100%; }

  .hud-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 10px 12px;
    background: linear-gradient(180deg, rgba(7,10,5,0.9) 0%, rgba(7,10,5,0.55) 75%, transparent 100%);
    z-index: 6;
  }
  .hud-identity-block { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .hud-identity { display: flex; align-items: center; gap: 8px; }
  .hud-swatch { width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4); }
  .hud-name { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-level { font-family: var(--font-mono); font-size: 9px; color: var(--ink); background: var(--xp-color); padding: 2px 6px; border-radius: 3px; font-weight: 700; flex-shrink: 0; }

  .stat-bars { display: flex; flex-direction: column; gap: 3px; width: min(230px, 46vw); }
  .stat-row { display: flex; align-items: center; gap: 5px; }
  .stat-icon { font-size: 10px; width: 13px; text-align: center; flex-shrink: 0; }
  .stat-track { flex: 1; height: 6px; background: rgba(0,0,0,0.4); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
  .stat-fill { height: 100%; border-radius: 3px; transition: width 0.25s ease; }
  .xp-track { height: 4px; }

  .hud-right { display: flex; align-items: flex-start; gap: 8px; }
  .hud-coords {
    font-family: var(--font-mono); font-size: 10px; color: var(--sage); font-variant-numeric: tabular-nums;
    background: rgba(20,27,14,0.7); border: 1px solid var(--bark); padding: 5px 8px; border-radius: 4px; display: none;
  }
  .hud-icon-btn {
    background: rgba(20,27,14,0.78); border: 1px solid var(--bark); color: var(--parchment); font-size: 16px;
    width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hud-icon-btn:hover { border-color: var(--ember); }
  @media (min-width: 720px) { .hud-coords { display: inline-block; } }

  .inventory-strip { position: absolute; top: 62px; left: 12px; right: 12px; z-index: 6; display: flex; gap: 6px; flex-wrap: wrap; }
  .inv-chip { display: flex; align-items: center; gap: 5px; background: rgba(20,27,14,0.78); border: 1px solid var(--bark); border-radius: 5px; padding: 5px 8px; font-family: var(--font-mono); font-size: 11px; color: var(--parchment); }
  .inv-chip .n { font-variant-numeric: tabular-nums; }

  .hud-note {
    position: absolute; top: 62px; right: 12px; z-index: 6;
    background: rgba(20,27,14,0.72); border: 1px solid var(--bark); border-radius: 5px; padding: 7px 10px;
    font-size: 10.5px; color: var(--sage); max-width: 230px; line-height: 1.45; text-align: right;
  }
  .hud-note b { color: var(--ember); font-weight: 600; }
  @media (max-width: 760px) { .hud-note { display: none; } }

  .minimap-dock { position: absolute; right: 12px; top: 108px; z-index: 6; background: rgba(20,27,14,0.72); border: 1px solid var(--bark); border-radius: 6px; padding: 7px; }
  .minimap-dock canvas { display: block; border-radius: 3px; }
  .minimap-legend { display: flex; gap: 7px; margin-top: 5px; font-size: 8px; color: var(--sage); justify-content: center; text-transform: uppercase; letter-spacing: 0.03em; }
  .minimap-legend .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px; }
  @media (max-width: 640px) { .minimap-dock { display: none; } }

  .controls-hint {
    position: absolute; bottom: 12px; left: 12px; z-index: 6; font-family: var(--font-mono); font-size: 10.5px; color: var(--sage);
    background: rgba(20,27,14,0.72); border: 1px solid var(--bark); padding: 6px 10px; border-radius: 5px;
  }
  .controls-hint kbd { background: var(--moss-3); border: 1px solid var(--bark); border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; font-family: inherit; color: var(--parchment); margin: 0 1px; }
  @media (max-width: 640px) { .controls-hint { display: none; } }

  .action-cluster { position: absolute; right: 12px; bottom: 12px; z-index: 6; display: flex; align-items: flex-end; gap: 12px; }
  .context-btn {
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    width: 76px; height: 60px; background: rgba(111,174,90,0.16); border: 1px solid var(--forest-glow);
    color: var(--parchment); border-radius: 10px; font-size: 10px; font-weight: 600; touch-action: none;
  }
  .context-btn.visible { display: flex; }
  .context-btn .icon { font-size: 19px; }
  .context-btn:active { background: rgba(111,174,90,0.34); }

  .attack-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(193,80,63,0.22); border: 1px solid var(--rust); color: var(--parchment); font-size: 21px; touch-action: none; flex-shrink: 0; }
  .attack-btn.ready { animation: attackPulse 1.1s ease-in-out infinite; }
  .attack-btn:active { background: rgba(193,80,63,0.4); }
  @keyframes attackPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(193,80,63,0.45); } 50% { box-shadow: 0 0 0 8px rgba(193,80,63,0); } }

  .movepad { position: absolute; left: 12px; bottom: 12px; z-index: 6; width: 118px; height: 118px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 4px; }
  @media (min-width: 900px) {
    .movepad { right: 100px; left: auto; bottom: 12px; }
    .action-cluster { right: 12px; }
    .controls-hint { display: block; }
  }
  .movepad-btn { background: rgba(20,27,14,0.78); border: 1px solid var(--bark); color: var(--parchment); font-size: 15px; border-radius: 6px; -webkit-user-select: none; user-select: none; touch-action: none; }
  .movepad-btn:active { background: rgba(230,161,60,0.28); }
  .movepad-up { grid-column: 2; grid-row: 1; }
  .movepad-left { grid-column: 1; grid-row: 2; }
  .movepad-down { grid-column: 2; grid-row: 3; }
  .movepad-right { grid-column: 3; grid-row: 2; }

  /* ---------------- Overlay shell (menu / death / inventory) ---------------- */

  .overlay-veil { position: absolute; inset: 0; z-index: 20; background: rgba(6,9,4,0.72); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .overlay-card { width: min(92vw, 400px); background: var(--moss); border: 1px solid var(--bark); border-radius: 10px; padding: 24px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .overlay-kicker { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage); }
  .overlay-title { font-family: var(--font-display); font-weight: 800; font-size: 25px; margin: 4px 0 16px; }
  .overlay-title.danger { color: var(--rust); }

  .overlay-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 18px; padding: 14px; background: var(--moss-2); border-radius: 6px; border: 1px solid var(--bark); }
  .overlay-stat-label { font-family: var(--font-mono); font-size: 9.5px; color: var(--sage); text-transform: uppercase; letter-spacing: 0.06em; }
  .overlay-stat-value { font-family: var(--font-display); font-weight: 700; font-size: 16px; }

  .overlay-actions { display: flex; flex-direction: column; gap: 9px; }
  .overlay-btn { padding: 12px 16px; border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 14.5px; border: 1px solid transparent; }
  .overlay-btn.primary { background: linear-gradient(180deg, #f0b04f, var(--ember)); color: #241804; }
  .overlay-btn.ghost { background: transparent; border-color: var(--bark); color: var(--parchment); }
  .overlay-btn.ghost:hover { border-color: var(--rust); color: var(--rust); }

  .overlay-controls-list { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--bark); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--sage); }
  .overlay-controls-list b { color: var(--parchment); font-family: var(--font-mono); }

  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .inv-slot {
    background: var(--moss-2); border: 1px solid var(--bark); border-radius: 8px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; position: relative;
  }
  .inv-slot.equipped { border-color: var(--ember); box-shadow: 0 0 0 1px rgba(230,161,60,0.3) inset; }
  .inv-slot-icon { font-size: 22px; }
  .inv-slot-label { font-size: 10.5px; color: var(--sage); }
  .inv-slot-count { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--parchment); }
  .inv-slot-tag { position: absolute; top: -8px; right: -6px; background: var(--ember); color: #241804; font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 8px; text-transform: uppercase; }
  .inv-empty-note { font-size: 12px; color: var(--sage); text-align: center; padding: 10px 0 18px; }
  .craft-hint { font-size: 11.5px; color: var(--sage); margin: -6px 0 14px; line-height: 1.45; }
  .inv-slot.weapon-slot { cursor: pointer; }
  .inv-slot.weapon-slot:hover { border-color: var(--ember-dim); }
  .inv-slot.weapon-slot.disabled { opacity: 0.45; }
  .inv-slot.weapon-slot.disabled:hover { border-color: var(--bark); }
  .inv-slot.draggable { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
  .inv-slot.draggable:active { cursor: grabbing; }
  .inv-slot.drop-target { border-color: var(--ember); box-shadow: 0 0 0 2px rgba(230,161,60,0.35) inset; }
  .drag-ghost { position: fixed; z-index: 999; pointer-events: none; font-size: 26px; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }

  .char-stats { display: flex; flex-direction: column; gap: 8px; margin: 2px 0 4px; }
  .char-actions { display: flex; flex-direction: column; gap: 10px; }

  /* ---------------- Admin žemėlapio redaktorius ---------------- */
  .admin-screen { align-items: flex-start; }
  .admin-panel { width: min(94vw, 860px); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding: 32px 16px 48px; }
  .admin-toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
  .admin-tool-btn { background: var(--moss-2); border: 1px solid var(--bark); color: var(--parchment); border-radius: 6px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .admin-tool-btn.active { border-color: var(--ember); background: var(--moss-3); color: var(--ember); }
  .admin-zoom-row { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--sage); flex-wrap: wrap; }
  .admin-zoom-row .overlay-btn { padding: 4px 12px; width: auto; }
  .admin-map-wrap { max-height: 62vh; overflow: auto; border: 1px solid var(--bark); border-radius: 8px; background: #050703; align-self: flex-start; }
  .admin-canvas { display: block; cursor: crosshair; touch-action: none; }
  .admin-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11px; color: var(--sage); }
  .admin-legend span { display: flex; align-items: center; gap: 5px; }
  .admin-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4); flex-shrink: 0; }
  .admin-coord-readout { color: var(--parchment); }
  .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .admin-actions .forge-submit { width: auto; flex: 1 1 220px; }
  .admin-actions .overlay-btn { width: auto; flex: 1 1 160px; }
  .overlay-btn.danger { border-color: var(--rust); color: #ff9b8f; }
  .overlay-btn.danger:hover { background: rgba(193,80,63,0.16); }

  .admin-tabs { display: flex; gap: 6px; background: #0e120a; border-radius: 8px; padding: 4px; align-self: flex-start; }
  .admin-tabs button { padding: 9px 16px; background: transparent; border: none; color: var(--sage); border-radius: 6px; font-size: 13px; font-weight: 600; font-family: var(--font-body); white-space: nowrap; }
  .admin-tabs button.active { background: var(--moss-3); color: var(--ember); }

  .admin-member-list { display: flex; flex-direction: column; gap: 8px; }
  .admin-member-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--moss-2); border: 1px solid var(--bark); border-radius: 8px; padding: 10px 14px; }
  .admin-member-row.selected { border-color: var(--ember); }
  .admin-member-info { cursor: pointer; flex: 1 1 220px; min-width: 0; }
  .admin-member-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .admin-member-meta { font-size: 11.5px; color: var(--sage); margin-top: 2px; }
  .admin-member-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .admin-member-actions .overlay-btn { padding: 6px 11px; font-size: 12px; width: auto; }
  .admin-blocked-tag { background: var(--rust); color: var(--parchment); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.04em; }

  .admin-member-detail { margin-top: 4px; padding: 16px; background: var(--moss-2); border: 1px solid var(--bark); border-radius: 8px; }
  .admin-member-detail-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .admin-member-detail-header h3 { font-family: var(--font-display); font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .admin-member-detail-header .overlay-btn { width: auto; padding: 6px 12px; font-size: 12px; }
  .admin-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 14px; margin-bottom: 14px; }
  .admin-stat-grid > div { display: flex; flex-direction: column; gap: 2px; }
  .admin-stat-grid span { font-family: var(--font-mono); font-size: 9.5px; color: var(--sage); text-transform: uppercase; letter-spacing: 0.06em; }
  .admin-stat-grid b { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; }
  .admin-inv-heading { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); margin: 0 0 10px; }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   REST/JWT pagalbinės funkcijos - bendravimas su tikru serveriu
   (žr. src/authRoutes.js, src/adminRoutes.js, src/publicRoutes.js).
   Tokenas laikomas localStorage TIK kaip sesijos atkūrimo raktas -
   herojaus duomenys nebe saugomi klientе, serveris yra vienintelis
   tiesos šaltinis (žr. autosaveHero/heroToPatch žemiau).
   ============================================================ */
const API_BASE = '';
function getToken() { try { return localStorage.getItem('vienkiemis_token'); } catch { return null; } }
function setToken(t) { try { if (t) localStorage.setItem('vienkiemis_token', t); else localStorage.removeItem('vienkiemis_token'); } catch { /* nesvarbu */ } }
function getStoredUsername() { try { return localStorage.getItem('vienkiemis_username'); } catch { return null; } }
function setStoredUsername(u) { try { if (u) localStorage.setItem('vienkiemis_username', u); else localStorage.removeItem('vienkiemis_username'); } catch { /* nesvarbu */ } }

// `opts.token` leidžia perduoti KONKRETŲ (ne šiuo metu prisijungusio žaidėjo) raktą - naudojama
// admin panelėje, kur adminToken nėra tas pats, kaip įprasto žaidėjo getToken() (admin prisijungimas
// neina per handleEnter/setToken, žr. App/AdminScreen).
async function apiFetch(path, opts = {}) {
  const token = opts.token || getToken();
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch { /* tuščias/ne-JSON atsakymas */ }
  if (!res.ok) { const err = new Error((data && data.error) || ('HTTP ' + res.status)); err.status = res.status; err.data = data; throw err; }
  return data;
}

// šie override'ai laikomi Set'uose greitai paieškai ir taikomi tileType() žemiau, virš įprasto

const FORCED_TREE_TILES = new Set();
const FORCED_CLEAR_TILES = new Set();

// Kviečiama VIENĄ kartą iš bootstrap() (failo pabaigoje), gavus /api/map-overrides atsakymą -
// PERRAŠO aukščiau apibrėžtus `let` kintamuosius bei UŽPILDO (ne pakeičia - jos `const`) Set'us.
// Kadangi visos likusios funkcijos šiame skripte NPC_POS/SAFE_ZONE/HUT_POSITIONS/NPC2_POS
// naudoja kaip laisvus kintamuosius (closure), o ne kopijas, šis perrašymas automatiškai
// atsispindi VISUR (terenno generavime, atstumo skaičiavimuose ir t.t.), kol jis įvyksta PRIEŠ
// pirmąjį React render'ą (žr. bootstrap()) - joks komponentas dar nebūna spėjęs "įsiminti" senos reikšmės.
function applyServerMapOverrides(ov) {
  if (!ov || typeof ov !== 'object') return;
  if (ov.npcPos) { NPC_POS = ov.npcPos; SAFE_ZONE = { x: NPC_POS.x, y: NPC_POS.y, radius: 7 }; }
  if (ov.npc2Pos) NPC2_POS = ov.npc2Pos;
  if (ov.hutPositions) HUT_POSITIONS = ov.hutPositions;
  FORCED_TREE_TILES.clear();
  (ov.forcedTrees || []).forEach((key) => FORCED_TREE_TILES.add(key));
  FORCED_CLEAR_TILES.clear();
  (ov.forcedClear || []).forEach((key) => FORCED_CLEAR_TILES.add(key));
}

// Žemėlapio zonos (atstumu nuo namų/saugios zonos centro): iškart už miestelio - praretėjęs
// pomiškis, kuris pamažu tankėja į mišką (bet praretintas - tarp medžių lieka nemažai tarpų,
// kad būtų patogu vaikščioti/matyti priešus); o gerokai toliau, už miško, prasideda tamsi,
// uolėta "pavojaus" zona.
const FOREST_MIN_DENSITY = 0.08;
const FOREST_MAX_DENSITY = 0.4;
const FOREST_FULL_AT = 22;
const DANGER_START = 36;
const DANGER_ROCK_DENSITY = 0.5;

function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  h = h ^ (h >> 16);
  return (h >>> 0) / 4294967295;
}

function inPond(x, y) { return x >= POND.x0 && x <= POND.x1 && y >= POND.y0 && y <= POND.y1; }

// Grynai procedūrinis (be admin override'ų) reljefo tipas - naudojamas admin žemėlapio
// redaktoriuje kaip fonas, ant kurio piešiami dar neišsaugoti pakeitimai (žr. AdminScreen).
function naturalTileType(x, y) {
  if (inPond(x, y)) return 'water';
  if (inLake(x, y)) return 'water';
  const homeDist = Math.hypot(x - SAFE_ZONE.x, y - SAFE_ZONE.y);
  if (homeDist < SAFE_ZONE.radius) return 'town';
  if (homeDist >= DANGER_START) return 'danger';
  const clearingFrac = Math.max(0, Math.min(1, (homeDist - SAFE_ZONE.radius) / (FOREST_FULL_AT - SAFE_ZONE.radius)));
  const forestChance = FOREST_MIN_DENSITY + clearingFrac * (FOREST_MAX_DENSITY - FOREST_MIN_DENSITY);
  // hash2() returns values uniformly spread over roughly [0, 0.5) (a property of its bit-mixing,
  // not a true [0,1) range), so the comparison threshold is halved to make `forestChance` actually
  // mean what it says (e.g. 0.62 really does yield forest on ~62% of tiles, not ~24%).
  return hash2(x * 7 + 1, y * 13 + 3) > 0.5 * (1 - forestChance) ? 'forest' : 'grass';
}

function tileType(x, y) {
  const natural = naturalTileType(x, y);
  // Admin medžių override'ai galioja tik miško/pievos juostoje - miestelio (town), tvenkinio
  // (water) ir pavojaus zonos (danger) langeliai visada lieka tokie, kokius jau piešia jų
  // atskiros taisyklės, kad admin netyčia neuždarytų parduotuvės po medžiu ar pan.
  if (natural !== 'grass' && natural !== 'forest') return natural;
  const key = x + ',' + y;
  if (FORCED_CLEAR_TILES.has(key)) return 'grass';
  if (FORCED_TREE_TILES.has(key)) return 'forest';
  return natural;
}

// Daugiabučio vidaus langelio tipas - grynai procedūrinis (be jokio rankomis rašyto simbolių
// tinklelio), lx/ly yra VIETINĖS koordinatės (0..INTERIOR_SIZE-1). Kadangi žaidime apskritai
// nėra langelių susidūrimo (collision) - net miško medžiai yra pereinami - čia irgi "siena"/
// "kolona" yra tik vaizdinė, sujungiamumas garantuotas savaime (nėra ko blokuoti).
function interiorTileType(lx, ly) {
  const edge = lx === 0 || ly === 0 || lx === INTERIOR_SIZE - 1 || ly === INTERIOR_SIZE - 1;
  if (edge) {
    if (lx === 6 && ly === INTERIOR_SIZE - 1) return 'door';
    return 'wall';
  }
  // reti stulpeliai/griuvėsiai viduje - tik dekoratyvūs, po jais galima pereiti
  if ((lx === 3 || lx === 9) && (ly === 3 || ly === 9)) return 'pillar';
  return 'floor';
}

function gridToScreen(gx, gy) { return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) }; }

function xpForLevel(level) { return level * 100; }

// Suformatuoja "kiek laiko jau esi gyvas" trukmę (nuo hero.aliveSince) žmogui suprantamu būdu -
// rodoma CharacterScreen ekrane, atsinaujina, kol žaidėjas jame yra (žr. CharacterScreen).
function formatSurvivalTime(ms) {
  const totalMin = Math.max(0, Math.floor(ms / 60000));
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if (days > 0) return days + ' d. ' + hours + ' val.';
  if (hours > 0) return hours + ' val. ' + mins + ' min.';
  if (mins > 0) return mins + ' min.';
  return 'ką tik prasidėjo';
}

// Pritaiko senesnius (prieš šalmo/stack'inimo funkcijas) išsaugotus herojus prie naujos
// duomenų struktūros: senas boolean 'hasHelmet' virsta skaičiumi, o trūkstamas
// 'weaponCounts' žemėlapis sukuriamas tuščias, kad senos paskyros neprarastų progreso.
function migrateHero(hero) {
  const h = { ...hero };
  if (h.helmetCount === undefined) {
    // helmetCount saugo tik kuprinėje (nedėvimą) kiekį - jei senoji paskyra jį jau buvo
    // užsidėjusi (helmetOn=true), tas vienintelis šalmas yra ant galvos, o ne kuprinėje.
    h.helmetCount = (h.hasHelmet && !h.helmetOn) ? 1 : 0;
  }
  if (!h.weaponCounts) h.weaponCounts = {};
  return h;
}

// Standartinis paskyros herojaus "atgaivinimo" būdas - žr. defaultHeroState/migrateHero komentarus
// aukščiau dėl kodėl reikalinga BŪTENT ši spread'ų tvarka (trūkstami laukai gauna numatytas
// reikšmes, o realiai egzistuojantys - išsaugo tikrąsias). Naudojama prisijungimo, sesijos
// atkūrimo IR admin narių sąrašo (žr. AdminScreen) vietose, kad senos paskyros visur rodytųsi vienodai.
function hydrateHero(rawHero) {
  return { ...defaultHeroState(rawHero), ...migrateHero(rawHero) };
}

// Paverčia SERVERIO (žr. db/heroes.js rowToHero) grąžintą herojaus objektą į pilną kliento hero
// būseną - serveris NEturi campfires/lootDrops/homeX/homeY laukų (tai grynai kliento-vietiniai/
// laikini dalykai, žr. Sandbox), tad juos čia papildome. SVARBU: aliveSince serveryje yra
// TIMESTAMPTZ stulpelis, per JSON grįžta kaip ISO eilutė - kliento kodas visur daro aritmetiką
// (Date.now() - h.aliveSince), tad BŪTINA konvertuoti į skaičių (ms nuo epochos) čia, o ne
// palikti eilute (žr. formatSurvivalTime ir jo naudojimo vietas).
function hydrateNetworkHero(rawHero) {
  return {
    ...rawHero,
    campfires: [],
    lootDrops: Array.isArray(rawHero.lootDrops) ? rawHero.lootDrops : [],
    collectedPickups: Array.isArray(rawHero.collectedPickups) ? rawHero.collectedPickups : [],
    homeX: HOME_POS.x, homeY: HOME_POS.y,
    aliveSince: rawHero.aliveSince ? new Date(rawHero.aliveSince).getTime() : Date.now(),
  };
}

// Kuriuos hero laukus siųsti į PUT /api/hero (žr. db/heroes.js saveHero - COALESCE pagrindu,
// tad pilno objekto siuntimas saugus ir paprasčiausias). NEsiunčiame campfires/lootDrops/name/
// bodyColor/accentColor - serveris jų arba visai neturi (žr. hydrateNetworkHero aukščiau), arba
// jiems nereikia autosave (vardas/spalvos nekinta po registracijos).
function heroToPatch(h) {
  return {
    x: h.x, y: h.y, hp: h.hp, maxHp: h.maxHp, hunger: h.hunger, thirst: h.thirst,
    xp: h.xp, level: h.level, kills: h.kills,
    wood: h.wood, matches: h.matches, coins: h.coins, meat: h.meat, chocolate: h.chocolate,
    bandage: h.bandage, medicine: h.medicine, gira: h.gira, arrows: h.arrows, fish: h.fish,
    collectedPickups: h.collectedPickups,
    weapon: h.weapon, ownedWeapons: h.ownedWeapons, weaponCounts: h.weaponCounts,
    helmetCount: h.helmetCount, helmetOn: h.helmetOn,
    questAccepted: h.questAccepted, questChopped: h.questChopped, questClaimed: h.questClaimed,
    aliveSince: new Date(h.aliveSince).toISOString(),
  };
}

// Autosave - "ugnies ir pamiršk" (fire-and-forget): praleistas/nepavykęs bandymas nėra kritinis,
// nes kitas tick'as (žr. lastSaveRef frame() cikle) tiesiog pabandys vėl po ~900ms.

  apiFetch('/api/hero', { method: 'PUT', body: JSON.stringify(heroToPatch(h)) }).catch(() => { /* kitas autosave'as pabandys vėl */ });
